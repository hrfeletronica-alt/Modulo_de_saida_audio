<body>

    <!-- Header Superior com Logo e Status de Conexão -->
    <header class="app-header">
        <div class="header-brand">
            <span class="mixer-logo">🎛️</span>
            <span class="mixer-title">AUDIO MIXER 1/10</span>
        </div>

        <!-- Player Provisório para Carregar Áudio do PC -->
        <div class="audio-player-bar" id="audio-player-bar" title="Player de Teste: Carregue uma música/áudio do seu computador para testar VU, EQ e RTA">
            <input type="file" id="local-audio-file" accept="audio/*,video/*,.mp3,.wav,.ogg,.m4a,.aac,.flac" style="display: none;">
            <label class="player-load-btn" for="local-audio-file" id="player-load-btn" title="Carregar arquivo de áudio do computador">
                <span>📁</span> Carregar Áudio
            </label>
            <button class="player-demo-btn" id="player-demo-btn" title="Gerar música/áudio de teste imediatamente (sem precisar de arquivo)">🎵 Áudio Teste</button>
            <button class="player-play-btn" id="player-play-btn" title="Reproduzir / Pausar" disabled>▶</button>
            <div class="player-info-container">
                <span class="player-track-name" id="player-track-name">Nenhum áudio</span>
                <span class="player-time" id="player-time">00:00 / 00:00</span>
            </div>
            <div class="player-progress-bar" id="player-progress-bar" title="Avançar / Retroceder">
                <div class="player-progress-fill" id="player-progress-fill"></div>
            </div>
            <audio id="local-audio-element" preload="auto"></audio>
        </div>

        <div id="sync-badge" class="sync-badge" title="Sincronização em tempo real PC/Celular">
            <span class="status-dot"></span>
            <span id="sync-text">Sincronizado</span>
        </div>
    </header>

    <!-- Barra de Navegação Rápida entre Canais (Celular) -->
    <nav class="channel-nav-ribbon" id="channel-ribbon">
        <!-- Injetado via JS: botões [LR] [1] [2] ... [10] -->
    </nav>

    <div class="mixer-wrapper">
        <div class="mixer-container" id="mixer">
            <!-- Channels will be injected by JS -->
        </div>
    </div>

    <!-- Parametric EQ Modal -->
    <div class="modal-overlay" id="eq-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-header-left">
                    <h3 id="modal-title" style="margin:0; font-size: 16px; color: #FFF;">EQ Eight</h3>
                    <!-- Seletor de Modo: Paramétrico vs Gráfico -->
                    <div class="eq-mode-switch">
                        <button class="eq-mode-btn active" id="btn-mode-peq" onclick="setChannelEQMode('peq')">Paramétrico</button>
                        <button class="eq-mode-btn" id="btn-mode-geq" onclick="setChannelEQMode('geq')">Gráfico (31-B)</button>
                    </div>
                </div>
                <button class="close-btn" id="close-modal">Concluído</button>
            </div>

            <!-- Channel Selector -->
            <div class="ch-selector-row" id="ch-selector">
                <!-- Buttons injected by JS -->
            </div>
            
            <!-- ── Visualização 1: EQ Paramétrico (PEQ Eight) ── -->
            <div class="peq-view-container" id="peq-view">
                <div class="eq-graph-wrapper">
                    <div class="eq-graph-container">
                        <canvas class="eq-main-canvas" id="eqGraph" width="778" height="250"></canvas>
                    </div>
                    <!-- Controles laterais do canal ativo no EQ (Ganho + Fader) -->
                    <div class="modal-fader-panel" id="modal-fader-panel">
                        <!-- Ganho Pré-Amplificador do Canal no EQ -->
                        <div class="modal-gain-box">
                            <div class="modal-gain-label">GAIN</div>
                            <div class="modal-gain-knob-wrap">
                                <div class="modal-gain-knob" id="modal-gain-knob" title="Ganho do Canal (Arraste verticalmente, duplo-clique para 0 dB)">
                                    <div class="modal-gain-indicator" id="modal-gain-indicator"></div>
                                </div>
                            </div>
                            <div class="modal-gain-val" id="modal-gain-val" title="Toque para resetar para 0.0 dB">+0.0 dB</div>
                        </div>
                        <div class="modal-strip-divider"></div>
                        <div class="modal-fader-label">VOL</div>
                        <div class="modal-fader-val" id="modal-fader-val">+0.0 dB</div>
                        <div class="modal-fader-track-area" id="modal-fader-track">
                            <div class="modal-fader-track-line"></div>
                            <div class="modal-fader-mark-0db"></div>
                            <div class="modal-fader-scale">
                                <span style="top: 0%;">+6</span>
                                <span class="mark-0u" style="top: 30%;">0U</span>
                                <span style="top: 55%;">-10</span>
                                <span style="top: 75%;">-20</span>
                                <span style="top: 100%;">-∞</span>
                            </div>
                            <div class="modal-fader-cap" id="modal-fader-cap" style="bottom: 70%;"></div>
                        </div>
                    </div>
                </div>

                <!-- Toolbar de Ações Rápidas (EQ, RTA, HPF, Ruído Rosa, Reset) -->
                <div class="eq-actions-row">
                    <button class="eq-on-btn" id="eq-on-btn">EQ: On</button>
                    <button class="eq-on-btn" id="rta-btn" style="background:#FF9900; color:#000;">RTA: On</button>
                    <button class="eq-on-btn" id="hpf-btn" style="background:#555; color:#FFF;" title="Filtro Passa-Altas (HPF / Low Cut)">HPF: Off</button>
                    <button class="eq-on-btn" id="pink-noise-btn" style="background:#555; color:#FFF;">Ruído Rosa: Off</button>
                    <button class="eq-on-btn reset-btn" id="reset-eq-btn" style="background:#444; color:#FFF;" title="Resetar todas as bandas para Flat (0 dB)">Reset</button>
                </div>

                <div class="eq-bands-row" id="band-boxes">
                    <!-- Band boxes generated by JS -->
                </div>

                <div class="eq-bottom-row">
                    <div class="knob-container">
                        <span class="knob-lbl">Freq</span>
                        <div class="knob" id="knob-freq"><div class="knob-indicator" id="ind-freq"></div></div>
                        <div class="knob-stepper-wrap">
                            <button class="step-btn" onclick="stepParam('freq', -1)">-</button>
                            <div class="knob-val" id="val-freq">100 Hz</div>
                            <button class="step-btn" onclick="stepParam('freq', 1)">+</button>
                        </div>
                    </div>
                    <div class="knob-container">
                        <span class="knob-lbl">Gain</span>
                        <div class="knob" id="knob-gain"><div class="knob-indicator" id="ind-gain"></div></div>
                        <div class="knob-stepper-wrap">
                            <button class="step-btn" onclick="stepParam('gain', -1)">-</button>
                            <div class="knob-val" id="val-gain">0.0 dB</div>
                            <button class="step-btn" onclick="stepParam('gain', 1)">+</button>
                        </div>
                    </div>
                    <div class="knob-container">
                        <span class="knob-lbl">Q</span>
                        <div class="knob" id="knob-q"><div class="knob-indicator" id="ind-q"></div></div>
                        <div class="knob-stepper-wrap">
                            <button class="step-btn" onclick="stepParam('q', -1)">-</button>
                            <div class="knob-val" id="val-q">1.0</div>
                            <button class="step-btn" onclick="stepParam('q', 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ── Visualização 2: EQ Gráfico (GEQ 31-Bandas ISO) ── -->
            <div class="geq-view-container" id="geq-view">
                <div class="geq-toolbar">
                    <div class="geq-toolbar-left">
                        <span class="geq-title-badge">Equalizador Gráfico (31 Bandas ISO)</span>
                        <span class="geq-scale-legend">Escala: ±12.0 dB • Centro: 0 dB • RTA em Tempo Real</span>
                    </div>
                    <div class="geq-toolbar-right">
                        <button class="geq-btn" id="geq-rta-btn" onclick="toggleRTA()" style="background:#FF9900; color:#000;">RTA: On</button>
                        <button class="geq-btn" id="geq-on-btn" onclick="toggleGEQBypass()">GEQ: On</button>
                        <button class="geq-btn" onclick="resetGEQFlat()" title="Resetar todas as 31 bandas para Flat (0.0 dB)">Zerar (Flat)</button>
                    </div>
                </div>
                <div class="geq-main-area">
                    <div class="geq-rack-wrapper">
                        <div class="geq-rack" id="geq-rack">
                            <!-- 31 sliders injetados via JavaScript -->
                        </div>
                    </div>
                    <!-- Painel lateral de Ganho e Volume também disponível no GEQ -->
                    <div class="modal-fader-panel" id="modal-fader-panel-geq">
                        <!-- Ganho Pré-Amplificador do Canal no GEQ -->
                        <div class="modal-gain-box">
                            <div class="modal-gain-label">GAIN</div>
                            <div class="modal-gain-knob-wrap">
                                <div class="modal-gain-knob" id="modal-gain-knob-geq" title="Ganho do Canal (Arraste verticalmente, duplo-clique para 0 dB)">
                                    <div class="modal-gain-indicator" id="modal-gain-indicator-geq"></div>
                                </div>
                            </div>
                            <div class="modal-gain-val" id="modal-gain-val-geq" title="Toque para resetar para 0.0 dB">+0.0 dB</div>
                        </div>
                        <div class="modal-strip-divider"></div>
                        <div class="modal-fader-label">VOL</div>
                        <div class="modal-fader-val" id="modal-fader-val-geq">+0.0 dB</div>
                        <div class="modal-fader-track-area" id="modal-fader-track-geq">
                            <div class="modal-fader-track-line"></div>
                            <div class="modal-fader-mark-0db"></div>
                            <div class="modal-fader-scale">
                                <span style="top: 0%;">+6</span>
                                <span class="mark-0u" style="top: 30%;">0U</span>
                                <span style="top: 55%;">-10</span>
                                <span style="top: 75%;">-20</span>
                                <span style="top: 100%;">-∞</span>
                            </div>
                            <div class="modal-fader-cap" id="modal-fader-cap-geq" style="bottom: 70%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = 'client_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
        const channelGainState = new Array(11).fill(0.0); // Ganho em dB (-18.0 dB a +18.0 dB, padrão 0.0 dB)

        // ── 31-Band Graphic Equalizer Constants & State ──────────────
        const ISO_GEQ_FREQS = [
            20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800,
            1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000, 10000, 12500, 16000, 20000
        ];
        const ISO_GEQ_LABELS = [
            '20', '25', '31.5', '40', '50', '63', '80', '100', '125', '160', '200', '250', '315', '400', '500', '630', '800',
            '1k', '1.25k', '1.6k', '2k', '2.5k', '3.15k', '4k', '5k', '6.3k', '8k', '10k', '12.5k', '16k', '20k'
        ];
        const NUM_GEQ_BANDS = 31;
        const channelEQMode = new Array(11).fill('peq'); // 'peq' ou 'geq'
        const channelGEQState = Array.from({length: 11}, () => new Array(NUM_GEQ_BANDS).fill(0.0));


        const STORAGE_KEY = 'audio_mixer_state_v1';
        let localSaveTimer = null;

        function scheduleSaveLocalState(delay = 100) {
            if (localSaveTimer) clearTimeout(localSaveTimer);
            localSaveTimer = setTimeout(saveLocalState, delay);
        }

        function saveLocalState() {
            try {
                if (!channelStripsData || channelStripsData.length === 0) return;
                const state = {
                    channels: []
                };
                for (let i = 0; i < 11; i++) {
                    const data = channelStripsData[i];
                    if (!data) continue;
                    const volPct = parseFloat(data.faderCap.style.bottom) || 70;
                    const gainDb = (typeof channelGainState !== 'undefined' && channelGainState[i] !== undefined) ? channelGainState[i] : 0.0;
                    const isMuted = data.muteBtn.classList.contains('muted');
                    const chName = data.channelInput ? data.channelInput.value : '';
                    const bands = (typeof channelEQState !== 'undefined' && channelEQState[i]) ? channelEQState[i] : null;
                    const eqOn = (typeof channelEQEnabled !== 'undefined' && channelEQEnabled[i] !== undefined) ? channelEQEnabled[i] : true;
                    const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[i]) ? channelHPFState[i] : null;

                    state.channels.push({
                        id: i,
                        volume: Math.round(volPct * 10) / 10,
                        gain: Math.round(gainDb * 10) / 10,
                        mute: isMuted,
                        name: chName,
                        eqEnabled: eqOn,
                        eqMode: (typeof channelEQMode !== 'undefined') ? (channelEQMode[i] || 'peq') : 'peq',
                        bands: bands,
                        geqBands: (typeof channelGEQState !== 'undefined' && channelGEQState[i]) ? channelGEQState[i] : null,
                        hpf: hpf
                    });
                }
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                // Modo anônimo ou storage desabilitado
            }
        }

        function restoreLocalState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (saved && Array.isArray(saved.channels)) {
                    saved.channels.forEach((ch, idx) => {
                        if (channelStripsData[idx]) {
                            if (ch.gain !== undefined) applyGain(idx, ch.gain);
                            if (ch.volume !== undefined) applyVolume(idx, ch.volume);
                            if (ch.mute !== undefined) applyMute(idx, ch.mute);
                            if (ch.name !== undefined) {
                                applyName(idx, ch.name);
                                if (channelStripsData[idx].pill) {
                                    const textSpan = channelStripsData[idx].pill.querySelector('.ribbon-text') || channelStripsData[idx].pill;
                                    textSpan.textContent = idx === 0 ? "LR" : `${idx}: ${ch.name}`;
                                }
                            }
                            if (ch.bands && typeof channelEQState !== 'undefined') channelEQState[idx] = ch.bands;
                            if (ch.eqEnabled !== undefined && typeof channelEQEnabled !== 'undefined') channelEQEnabled[idx] = ch.eqEnabled;
                            if (ch.eqMode && typeof channelEQMode !== 'undefined') channelEQMode[idx] = ch.eqMode;
                            if (ch.geqBands && typeof channelGEQState !== 'undefined') channelGEQState[idx] = ch.geqBands;
                            if (ch.hpf && typeof channelHPFState !== 'undefined') channelHPFState[idx] = ch.hpf;
                            if (typeof drawMiniEQ === 'function') drawMiniEQ(idx);
                        }
                    });
                }
            } catch (e) {
                console.warn("[Storage] Erro ao restaurar estado local:", e);
            }
        }


        function applyGain(idx, gainDb) {
            if (idx === undefined || idx < 0 || idx >= 11) return;
            const clamped = Math.max(-18.0, Math.min(18.0, Math.round(gainDb * 10) / 10));
            channelGainState[idx] = clamped;

            const data = channelStripsData[idx];
            if (data) {
                if (data.gainVal) {
                    data.gainVal.textContent = (clamped >= 0 ? '+' : '') + clamped.toFixed(1) + ' dB';
                }
                if (data.gainIndicator) {
                    const deg = (clamped / 18.0) * 135.0;
                    data.gainIndicator.style.transform = `rotate(${deg}deg)`;
                }
                if (data.preampGain && audioCtx) {
                    const linGain = Math.pow(10, clamped / 20.0);
                    data.preampGain.gain.setTargetAtTime(linGain, audioCtx.currentTime, 0.015);
                }
            }

            // Sincroniza o botão de ganho do modal se o EQ estiver aberto neste canal
            if (typeof syncModalGain === 'function' && modal && modal.style.display === 'flex' && idx === activeChannelIdx) {
                syncModalGain(idx);
            }

            if (typeof scheduleSaveLocalState === 'function') scheduleSaveLocalState(200);
        }

        let gainSyncTimer = null;
        function sendGainSync(idx, gainDb, immediate = false) {
            if (gainSyncTimer) clearTimeout(gainSyncTimer);
            const payload = { type: 'gain', channel: idx, value: gainDb };
            if (immediate) {
                sendSync(payload);
            } else {
                gainSyncTimer = setTimeout(() => sendSync(payload), 40);
            }
        }

        function setupGainKnobEvents(gainKnob, gainIndicator, gainVal, chIdx) {
            let isDraggingGain = false;
            let startGainY = 0;
            let initialGainVal = 0;

            function startGainDrag(clientY) {
                isDraggingGain = true;
                startGainY = clientY;
                initialGainVal = channelGainState[chIdx] || 0.0;
                gainKnob.classList.add('dragging');
            }

            function moveGainDrag(clientY) {
                if (!isDraggingGain) return;
                const dy = startGainY - clientY; // arrastar para cima aumenta ganho
                const deltaDb = (dy / 3.0) * 0.5; // sensibilidade suave
                const newDb = Math.max(-18.0, Math.min(18.0, initialGainVal + deltaDb));
                applyGain(chIdx, newDb);
                sendGainSync(chIdx, newDb, false);
            }

            function endGainDrag(clientY) {
                if (!isDraggingGain) return;
                isDraggingGain = false;
                gainKnob.classList.remove('dragging');
                sendGainSync(chIdx, channelGainState[chIdx], true);
            }

            // Touch events
            gainKnob.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                startGainDrag(e.touches[0].clientY);
            }, { passive: false });

            gainKnob.addEventListener('touchmove', (e) => {
                if (isDraggingGain) {
                    e.preventDefault();
                    e.stopPropagation();
                    moveGainDrag(e.touches[0].clientY);
                }
            }, { passive: false });

            gainKnob.addEventListener('touchend', (e) => {
                if (isDraggingGain) {
                    e.preventDefault();
                    e.stopPropagation();
                    endGainDrag(e.changedTouches[0].clientY);
                }
            }, { passive: false });

            gainKnob.addEventListener('touchcancel', () => {
                isDraggingGain = false;
                gainKnob.classList.remove('dragging');
            });

            // Mouse / Pointer
            gainKnob.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                e.stopPropagation();
                gainKnob.setPointerCapture(e.pointerId);
                startGainDrag(e.clientY);
            });

            gainKnob.addEventListener('pointermove', (e) => {
                if (e.pointerType === 'touch') return;
                if (isDraggingGain) moveGainDrag(e.clientY);
            });

            gainKnob.addEventListener('pointerup', (e) => {
                if (e.pointerType === 'touch') return;
                if (isDraggingGain) {
                    try { gainKnob.releasePointerCapture(e.pointerId); } catch(err) {}
                    endGainDrag(e.clientY);
                }
            });

            gainKnob.addEventListener('pointercancel', (e) => {
                if (isDraggingGain) {
                    isDraggingGain = false;
                    gainKnob.classList.remove('dragging');
                    try { gainKnob.releasePointerCapture(e.pointerId); } catch(err) {}
                }
            });

            // Duplo-clique no knob ou clique no valor reseta para 0.0 dB
            gainKnob.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                applyGain(chIdx, 0.0);
                sendGainSync(chIdx, 0.0, true);
            });

            if (gainVal) {
                gainVal.addEventListener('click', (e) => {
                    e.stopPropagation();
                    applyGain(chIdx, 0.0);
                    sendGainSync(chIdx, 0.0, true);
                });
            }
        }

        const channelStripsData = [];
        let ws = null;
        let sse = null;

        function setSyncStatus(connected, count = null) {
            const badge = document.getElementById('sync-badge');
            const text = document.getElementById('sync-text');
            if (!badge || !text) return;
            if (connected) {
                badge.classList.remove('disconnected');
                if (count !== null) {
                    if (count >= 2) {
                        badge.style.color = '#00ff66';
                        badge.style.borderColor = '#00ff66';
                        text.textContent = `🟢 Sincronizado (${count} aparelhos)`;
                    } else {
                        badge.style.color = '#ffcc00';
                        badge.style.borderColor = '#ffcc00';
                        text.textContent = `🟡 1 aparelho (conecte o outro)`;
                    }
                } else {
                    text.textContent = '🟢 Conectado';
                }
            } else {
                badge.classList.add('disconnected');
                badge.style.color = '#ff4444';
                badge.style.borderColor = '#772222';
                text.textContent = '🔴 Reconectando...';
            }
        }

        function sendSync(payload) {
            payload.clientId = CLIENT_ID;
            if (typeof scheduleSaveLocalState === 'function') scheduleSaveLocalState(150);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            } else {
                fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => setSyncStatus(false));
            }
        }

        let eqSyncTimer = null;
        function notifyEQChanged(immediate = false) {
            if (typeof drawMiniEQ === 'function') drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
            if (eqSyncTimer) clearTimeout(eqSyncTimer);
            const payload = {
                type: 'eq',
                channel: activeChannelIdx,
                bands: currentBands,
                enabled: eqEnabled,
                hpf: (typeof channelHPFState !== 'undefined') ? channelHPFState[activeChannelIdx] : undefined
            };
            if (immediate) {
                sendSync(payload);
            } else {
                eqSyncTimer = setTimeout(() => sendSync(payload), 40);
            }
        }

        const mixerContainer = document.getElementById('mixer');
        const modal = document.getElementById('eq-modal');
        const closeModal = document.getElementById('close-modal');
        const modalTitle = document.getElementById('modal-title');
        const rtaBtn = document.getElementById('rta-btn');
        const hpfBtn = document.getElementById('hpf-btn');
        
        let currentBands = [];
        let selectedBandIndex = 3; 
        let rtaEnabled = true;
        let eqEnabled = true;
        let rtaBands = new Array(64).fill(0);

        function updateRTAButtonsUI() {
            ['rta-btn', 'geq-rta-btn'].forEach(btnId => {
                const btn = document.getElementById(btnId);
                if (btn) {
                    btn.textContent = rtaEnabled ? 'RTA: On' : 'RTA: Off';
                    btn.style.background = rtaEnabled ? '#FF9900' : '#555';
                    btn.style.color = rtaEnabled ? '#000' : '#FFF';
                }
            });
        }

        function toggleRTA() {
            rtaEnabled = !rtaEnabled;
            updateRTAButtonsUI();
            if (!rtaEnabled) {
                drawEQGraph();
                if (typeof clearGEQRTABars === 'function') clearGEQRTABars();
            }
        }

        rtaBtn.onclick = toggleRTA;

        if (hpfBtn) {
            hpfBtn.onclick = () => {
                if (typeof toggleHPF === 'function') toggleHPF();
            };
        }

        // ─── Motor de Áudio: VU Meter Reativo + Ruído Rosa + EQ em Tempo Real ─
        let audioCtx          = null;
        let micAnalyser       = null;    // analisa microfone / áudio real
        let micStream         = null;
        let micSource         = null;
        let vuAnimId          = null;
        let vuSmooth          = new Array(11).fill(0);
        let sharedNoiseSource = null;    // fonte única compartilhada de ruído rosa
        let sharedNoiseUsers  = 0;       // contagem de canais com ruído ligado
        let mixerMasterBus    = null;    // barramento mestre interno do mixer
        let masterLimiter     = null;    // compressor/limiter de proteção na saída

        function ensureAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            initMixerAudioGraph();
            return audioCtx;
        }

        function createAnalyser(ctx) {
            const an = ctx.createAnalyser();
            an.fftSize = 1024;
            an.smoothingTimeConstant = 0.5;
            return an;
        }

        // Buffer de Ruído Rosa sintetizado (algoritmo de Voss-McCartney)
        function buildPinkNoiseBuffer(ctx) {
            const bufSize = 2 * ctx.sampleRate;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const out = buf.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufSize; i++) {
                const w = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + w * 0.0555179;
                b1 = 0.99332 * b1 + w * 0.0750759;
                b2 = 0.96900 * b2 + w * 0.1538520;
                b3 = 0.86650 * b3 + w * 0.3104856;
                b4 = 0.55000 * b4 + w * 0.5329522;
                b5 = -0.7616 * b5 - w * 0.0168980;
                out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.04;
                b6 = w * 0.115926;
            }
            return buf;
        }

        function ensureSharedNoise() {
            ensureAudioCtx();
            if (sharedNoiseSource) return;
            sharedNoiseSource = audioCtx.createBufferSource();
            sharedNoiseSource.buffer = buildPinkNoiseBuffer(audioCtx);
            sharedNoiseSource.loop = true;
            sharedNoiseSource.start();

            // Conecta ruído rosa aos nós de ruído dos canais de saída 1 a 10
            for (let ch = 1; ch <= 10; ch++) {
                const data = channelStripsData[ch];
                if (data && data.noiseGain) {
                    try { sharedNoiseSource.connect(data.noiseGain); } catch(e) {}
                }
            }
        }

        // Configura a cascata de filtros Web Audio API para o canal (HPF 12/24dB + 6 bandas paramétricas)
        function setupChannelEQAudioNodes(idx) {
            const data = channelStripsData[idx];
            if (!data) return;
            ensureAudioCtx();

            if (!data.hpfFilter1) {
                // Filtro Passa-Altas (HPF) com 12 ou 24 dB/oitava (Butterworth)
                data.hpfFilter1 = audioCtx.createBiquadFilter();
                data.hpfFilter1.type = 'highpass';
                data.hpfFilter1.frequency.value = 10;
                data.hpfFilter1.Q.value = 0.707;

                data.hpfFilter2 = audioCtx.createBiquadFilter();
                data.hpfFilter2.type = 'highpass';
                data.hpfFilter2.frequency.value = 10;
                data.hpfFilter2.Q.value = 0.707;

                data.hpfFilter1.connect(data.hpfFilter2);
                data.channelInputNode = data.hpfFilter1;
            }

            if (!data.eqFilters) {
                const bands = (typeof channelEQState !== 'undefined' && channelEQState[idx]) ? channelEQState[idx] : defaultBands;
                data.eqFilters = [];

                bands.forEach((b) => {
                    const filter = audioCtx.createBiquadFilter();
                    if (b.mode === 'LShv') {
                        filter.type = 'lowshelf';
                    } else if (b.mode === 'HShv') {
                        filter.type = 'highshelf';
                    } else {
                        filter.type = 'peaking';
                        filter.Q.value = b.q || 2.0;
                    }
                    filter.frequency.value = b.freq || 1000;
                    const isEqActive = (typeof channelEQEnabled !== 'undefined' && channelEQEnabled[idx] !== undefined)
                        ? channelEQEnabled[idx] : true;
                    filter.gain.value = isEqActive ? b.gain : 0;
                    data.eqFilters.push(filter);
                });

                // Conecta HPF -> EQ cascata (hpfFilter2 -> eqFilters[0] -> 1 -> 2 -> 3 -> 4 -> 5)
                data.hpfFilter2.connect(data.eqFilters[0]);
                for (let i = 0; i < data.eqFilters.length - 1; i++) {
                    data.eqFilters[i].connect(data.eqFilters[i + 1]);
                }
            }

            if (!data.geqFilters) {
                data.geqFilters = [];
                for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                    const f = audioCtx.createBiquadFilter();
                    f.type = 'peaking';
                    f.frequency.value = ISO_GEQ_FREQS[k];
                    f.Q.value = 4.31; // Q de 1/3 de oitava
                    f.gain.value = 0.0;
                    data.geqFilters.push(f);
                }
                // Conecta PEQ último filtro -> GEQ cascata (geqFilters[0..30])
                data.eqFilters[data.eqFilters.length - 1].connect(data.geqFilters[0]);
                for (let k = 0; k < data.geqFilters.length - 1; k++) {
                    data.geqFilters[k].connect(data.geqFilters[k + 1]);
                }
            }
        }

        // Configura a cadeia de áudio completa do canal (HPF + EQ + Analyser + Fader Gain + Roteamento)
        function setupChannelAudioChain(idx) {
            const data = channelStripsData[idx];
            if (!data || !audioCtx) return;
            if (data.audioChainReady) return;

            setupChannelEQAudioNodes(idx);
            const inputNode   = data.channelInputNode || data.eqFilters[0];
            const lastFilter  = (data.geqFilters && data.geqFilters.length > 0)
                ? data.geqFilters[data.geqFilters.length - 1]
                : data.eqFilters[data.eqFilters.length - 1];

            // 1. Nó de Ganho / Preamp Trim na entrada de cada canal (Entrada e Saídas)
            if (!data.preampGain) {
                data.preampGain = audioCtx.createGain();
                const initGainDb = channelGainState[idx] || 0.0;
                data.preampGain.gain.value = Math.pow(10, initGainDb / 20.0);
            }
            data.preampGain.disconnect();
            data.preampGain.connect(inputNode);

            // Analisador RTA pós-EQ exclusivo deste canal
            if (!data.rtaAnalyser) {
                data.rtaAnalyser = createAnalyser(audioCtx);
            }

            // Ganho do canal (controlado pelo fader e mute)
            if (!data.channelGain) {
                data.channelGain = audioCtx.createGain();
                data.channelGain.gain.value = 0.00001;
            }

            // Encadeamento interno do canal (PÓS-FADER: para o Analyser e RTA refletirem ganho real do potenciômetro):
            // inputNode(HPF) -> eqFilters[0..5] -> channelGain -> rtaAnalyser
            lastFilter.connect(data.channelGain);
            data.channelGain.connect(data.rtaAnalyser);

            if (idx === 0) {
                // Canal 0 (Entrada LR): alimenta o barramento mestre interno do mixer pós-fader e pós-EQ
                data.rtaAnalyser.connect(mixerMasterBus);
            } else {
                // Canais 1 a 10 (Saídas):
                // Recebe sinal do barramento mestre e entra no nó de entrada (HPF) do canal
                mixerMasterBus.connect(data.preampGain);

                // Entrada de ruído rosa independente
                data.noiseGain = audioCtx.createGain();
                data.noiseGain.gain.value = 0.00001;
                data.noiseGain.connect(inputNode);

                if (sharedNoiseSource) {
                    try { sharedNoiseSource.connect(data.noiseGain); } catch(e) {}
                }

                // Saída pós-fader do canal vai para o Master Limiter -> destination (caixas de som)
                data.rtaAnalyser.connect(masterLimiter);
            }

            data.audioChainReady = true;
            updateChannelFaderGain(idx);
            updateChannelEQFilters(idx);
        }

        // Inicializa o grafo Web Audio completo do mixer
        function initMixerAudioGraph() {
            if (!audioCtx) return;
            if (mixerMasterBus) return;
            if (!channelStripsData[0] || !channelStripsData[10]) return; // aguarda criação do DOM

            // Limiter profissional para evitar clipping ou distorção digital
            masterLimiter = audioCtx.createDynamicsCompressor();
            masterLimiter.threshold.value = -1.0;
            masterLimiter.knee.value = 3;
            masterLimiter.ratio.value = 20;
            masterLimiter.attack.value = 0.003;
            masterLimiter.release.value = 0.1;
            masterLimiter.connect(audioCtx.destination);

            // Barramento mestre interno (liga a saída do Canal 0 à entrada dos Canais 1 a 10)
            mixerMasterBus = audioCtx.createGain();
            mixerMasterBus.gain.value = 1.0;

            for (let i = 0; i < 11; i++) {
                setupChannelAudioChain(i);
            }

            // Se o player já tiver nó criado, conecta na entrada do Canal 0
            if (playerAnalyser && channelStripsData[0]) {
                const targetNode = channelStripsData[0].preampGain || channelStripsData[0].channelInputNode || (channelStripsData[0].eqFilters && channelStripsData[0].eqFilters[0]);
                if (targetNode) {
                    try { playerAnalyser.connect(targetNode); } catch(e) {}
                }
            }
        }

        // Atualiza os parâmetros dos filtros de áudio em tempo real quando o usuário mexe no EQ
        function updateChannelEQFilters(idx) {
            const data = channelStripsData[idx];
            if (!data || !data.eqFilters || !audioCtx) return;
            const bands = (typeof channelEQState !== 'undefined' && channelEQState[idx]) ? channelEQState[idx] : defaultBands;
            const isEqActive = (typeof channelEQEnabled !== 'undefined' && channelEQEnabled[idx] !== undefined)
                ? channelEQEnabled[idx] : true;
            const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[idx]) 
                ? channelHPFState[idx] : { enabled: false, freq: 80, slope: 12 };

            // Atualiza os filtros passa-altas (HPF: 12 ou 24 dB/oitava Butterworth)
            if (data.hpfFilter1 && data.hpfFilter2) {
                const isHpfActive = isEqActive && hpf.enabled;
                const targetFreq = isHpfActive ? Math.max(20, Math.min(1000, hpf.freq || 80)) : 10;
                data.hpfFilter1.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.01);
                data.hpfFilter1.Q.setTargetAtTime(0.707, audioCtx.currentTime, 0.01);

                const targetFreq2 = (isHpfActive && hpf.slope === 24) ? targetFreq : 10;
                data.hpfFilter2.frequency.setTargetAtTime(targetFreq2, audioCtx.currentTime, 0.01);
                data.hpfFilter2.Q.setTargetAtTime(0.707, audioCtx.currentTime, 0.01);
            }

            // 2. Filtros PEQ (Paramétrico 6 Bandas): permanecem ativos e cumulativos com o GEQ
            bands.forEach((b, i) => {
                const filter = data.eqFilters[i];
                if (!filter) return;
                try {
                    const targetFreq = Math.max(20, Math.min(20000, b.freq));
                    const targetGain = isEqActive ? b.gain : 0.0;
                    filter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.01);
                    filter.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.01);
                    if (filter.type === 'peaking') {
                        filter.Q.setTargetAtTime(Math.max(0.1, b.q), audioCtx.currentTime, 0.01);
                    }
                } catch(e) {}
            });

            // 3. Filtros GEQ (Gráfico 31 Bandas ISO): permanecem ativos e cumulativos com o PEQ
            if (data.geqFilters) {
                const geqBands = (typeof channelGEQState !== 'undefined' && channelGEQState[idx])
                    ? channelGEQState[idx]
                    : null;
                for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                    const f = data.geqFilters[k];
                    if (!f) continue;
                    try {
                        const targetGain = (isEqActive && geqBands) ? geqBands[k] : 0.0;
                        f.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.01);
                    } catch(e) {}
                }
            }
        }

        // Atualiza o ganho do fader do canal
        function updateChannelFaderGain(idx) {
            const data = channelStripsData[idx];
            if (!data || !data.channelGain || !audioCtx) return;

            const isMuted = data.muteBtn && data.muteBtn.classList.contains('muted');
            const faderPct = parseFloat(data.faderCap.style.bottom) || 0;

            if (isMuted || faderPct <= 1.0) {
                data.channelGain.gain.setTargetAtTime(0.00001, audioCtx.currentTime, 0.015);
                return;
            }

            // Curva do fader: 70% = 0 dB (ganho 1.0); 100% = +6 dB (~ ganho 2.0); 0% = silêncio
            let gainVal = 0;
            if (faderPct <= 70) {
                gainVal = Math.pow(faderPct / 70, 2);
            } else {
                gainVal = 1.0 + ((faderPct - 70) / 30) * 1.0;
            }

            // Canal 0 (Entrada LR): ganho unitário
            // Canais 1 a 10 (Saídas): fator 0.7 para folga de mixagem na soma
            const factor = (idx === 0) ? 1.0 : 0.7;
            const targetGain = Math.max(0.00001, Math.min(3.0, gainVal * factor));
            data.channelGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.015);
        }

        // Aciona ruído rosa individualmente no canal passando pelo equalizador (EQ Eight)
        function channelPinkOn(idx) {
            if (idx === 0) return; // Canal de Entrada (LR) não possui ruído rosa
            const data = channelStripsData[idx];
            if (!data) return;
            ensureAudioCtx();
            initMixerAudioGraph();
            ensureSharedNoise();

            data.noiseEnabled = true;
            sharedNoiseUsers++;
            if (data.noiseGain) {
                data.noiseGain.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.015);
            }
            updateChannelEQFilters(idx);
            updateChannelFaderGain(idx);

            if (data.strip) data.strip.classList.add('pink-noise-active');
            if (data.pill) data.pill.classList.add('pink-noise-active');
        }

        // Desliga ruído rosa do canal
        function channelPinkOff(idx) {
            const data = channelStripsData[idx];
            if (!data || !data.noiseEnabled) return;

            data.noiseEnabled = false;
            sharedNoiseUsers = Math.max(0, sharedNoiseUsers - 1);

            if (data.noiseGain) {
                data.noiseGain.gain.setTargetAtTime(0.00001, audioCtx.currentTime, 0.015);
            }
            updateChannelFaderGain(idx);

            if (data.strip) data.strip.classList.remove('pink-noise-active');
            if (data.pill) data.pill.classList.remove('pink-noise-active');

            if (sharedNoiseUsers <= 0 && sharedNoiseSource) {
                try {
                    sharedNoiseSource.stop();
                    sharedNoiseSource.disconnect();
                } catch(e) {}
                sharedNoiseSource = null;
                sharedNoiseUsers = 0;
            }
        }

        // Atualiza o estado visual do botão de ruído rosa no modal do EQ
        function updatePinkNoiseButton() {
            if (activeChannelIdx === 0) {
                // Canal de entrada LR não possui ruído rosa
                pinkNoiseBtn.style.display = 'none';
                return;
            }
            pinkNoiseBtn.style.display = 'inline-block';
            const isNoiseOn = !!(channelStripsData[activeChannelIdx] && channelStripsData[activeChannelIdx].noiseEnabled);
            pinkNoiseBtn.textContent = isNoiseOn ? 'Ruído Rosa: On' : 'Ruído Rosa: Off';
            pinkNoiseBtn.style.background = isNoiseOn ? '#FF0055' : '#555';
            pinkNoiseBtn.style.color = '#FFF';
        }

        // Botão de ruído rosa: aciona individualmente no canal ativo (apenas saídas 1 a 10)
        const pinkNoiseBtn = document.getElementById('pink-noise-btn');
        pinkNoiseBtn.onclick = () => {
            if (activeChannelIdx === 0) return;
            ensureAudioCtx();
            const idx = activeChannelIdx;
            const data = channelStripsData[idx];
            if (!data) return;

            const willBeOn = !data.noiseEnabled;
            if (willBeOn) {
                channelPinkOn(idx);
            } else {
                channelPinkOff(idx);
            }
            updatePinkNoiseButton();
            sendSync({ type: 'pink_noise', channel: idx, value: willBeOn });
        };

        // Captura de áudio real do microfone/entrada
        async function startMicCapture() {
            try {
                ensureAudioCtx();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                micSource = audioCtx.createMediaStreamSource(micStream);
                micAnalyser = createAnalyser(audioCtx);
                micSource.connect(micAnalyser);
                console.log('[VU] Entrada de áudio conectada');
            } catch (err) {
                console.log('[VU] Áudio externo não disponível ou não autorizado:', err.message);
            }
        }

        // ── Player Provisório de Áudio Local (Carregar do PC) ───────────
        let playerElement      = null;
        let playerSourceNode   = null;
        let playerAnalyser     = null;
        let playerMasterGain   = null;

        function formatAudioTime(sec) {
            if (!sec || isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }

        function initLocalAudioPlayer() {
            playerElement = document.getElementById('local-audio-element');
            const fileInput = document.getElementById('local-audio-file');
            const loadBtn = document.getElementById('player-load-btn');
            const playBtn = document.getElementById('player-play-btn');
            const trackName = document.getElementById('player-track-name');
            const timeLabel = document.getElementById('player-time');
            const progressBar = document.getElementById('player-progress-bar');
            const progressFill = document.getElementById('player-progress-fill');

            if (!playerElement || !fileInput) return;

            // Permite carregar por clique e também arrastar e soltar arquivo
            fileInput.onchange = async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                await loadAndPlayAudioFile(files[0]);
            };

            // Gera áudio sintetizado em WAV diretamente na memória do navegador para teste imediato
            const demoBtn = document.getElementById('player-demo-btn');
            if (demoBtn) {
                demoBtn.onclick = async () => {
                    try {
                        ensureAudioCtx();
                        if (audioCtx && audioCtx.state === 'suspended') {
                            await audioCtx.resume();
                        }
                        trackName.textContent = 'Gerando áudio demo...';

                        // Gera um groove rítmico musical de 10 segundos com bumbo, baixo e acordes
                        const sampleRate = 44100;
                        const duration = 12; // 12 segundos em loop
                        const totalSamples = sampleRate * duration;
                        const buffer = new Float32Array(totalSamples);
                        
                        const bpm = 120;
                        const beatSec = 60 / bpm; // 0.5s por batida
                        
                        for (let s = 0; s < totalSamples; s++) {
                            const t = s / sampleRate;
                            let val = 0;

                            // 1. Kick Drum (bumbo nas batidas 1, 2, 3, 4)
                            const beatTime = t % beatSec;
                            if (beatTime < 0.25) {
                                const kickFreq = 120 * Math.exp(-beatTime * 28) + 40;
                                const kickEnv = Math.exp(-beatTime * 14);
                                val += Math.sin(2 * Math.PI * kickFreq * beatTime) * kickEnv * 0.7;
                            }

                            // 2. Linha de Baixo melódica nos 16 avos
                            const bassNotes = [55, 55, 65.4, 73.4, 82.4, 73.4, 65.4, 49]; // Lá, Dó, Ré, Mi...
                            const bassIdx = Math.floor((t / (beatSec / 2)) % bassNotes.length);
                            const bassFreq = bassNotes[bassIdx];
                            const bassBeatTime = t % (beatSec / 2);
                            const bassEnv = Math.exp(-bassBeatTime * 6);
                            val += (Math.sin(2 * Math.PI * bassFreq * t) + 0.3 * Math.sin(4 * Math.PI * bassFreq * t)) * bassEnv * 0.35;

                            // 3. Sintetizador / Acordes
                            const chordFreqs = [220, 261.63, 329.63, 392]; // Am7
                            chordFreqs.forEach((f, fi) => {
                                const tremolo = 0.8 + 0.2 * Math.sin(2 * Math.PI * 4 * t);
                                val += Math.sin(2 * Math.PI * f * t) * 0.06 * tremolo;
                            });

                            // 4. Hi-hat / Prato leve nos contra-tempos
                            const hatBeat = (t + beatSec / 2) % beatSec;
                            if (hatBeat < 0.08) {
                                const whiteNoise = (Math.random() * 2 - 1);
                                val += whiteNoise * Math.exp(-hatBeat * 40) * 0.15;
                            }

                            buffer[s] = Math.max(-1, Math.min(1, val));
                        }

                        // Converte Float32Array para Blob WAV mono
                        const wavBlob = createWavBlob(buffer, sampleRate);
                        const fileUrl = URL.createObjectURL(wavBlob);
                        
                        playerElement.src = fileUrl;
                        playerElement.loop = true;
                        trackName.textContent = '🎵 Demo Groove (120 BPM)';
                        trackName.title = 'Áudio de demonstração sintetizado para teste';
                        trackName.style.color = '#00ff88';
                        playBtn.disabled = false;
                        playBtn.textContent = '⏸';
                        playBtn.style.color = '#ff9900';

                        setupPlayerAudioNodes();
                        await playerElement.play();
                    } catch(err) {
                        console.error('Erro ao gerar demo:', err);
                        trackName.textContent = 'Erro ao sintetizar demo: ' + err.message;
                    }
                };
            }

            // Utilitário rápido para codificar WAV PCM 16-bit
            function createWavBlob(samples, sampleRate) {
                const buffer = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buffer);
                const writeString = (offset, string) => {
                    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
                };
                writeString(0, 'RIFF');
                view.setUint32(4, 36 + samples.length * 2, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true); // PCM
                view.setUint16(22, 1, true); // Mono
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeString(36, 'data');
                view.setUint32(40, samples.length * 2, true);
                let offset = 44;
                for (let i = 0; i < samples.length; i++, offset += 2) {
                    const s = Math.max(-1, Math.min(1, samples[i]));
                    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                }
                return new Blob([buffer], { type: 'audio/wav' });
            }

            async function loadAndPlayAudioFile(file) {
                try {
                    ensureAudioCtx();
                    if (audioCtx && audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }
                    
                    const fileUrl = URL.createObjectURL(file);
                    playerElement.src = fileUrl;
                    trackName.textContent = file.name;
                    trackName.title = file.name;
                    trackName.style.color = '#fff';
                    playBtn.disabled = false;
                    playBtn.textContent = '▶';

                    // Conecta AudioContext e os nós de saída / analisador
                    setupPlayerAudioNodes();

                    const playPromise = playerElement.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            playBtn.textContent = '⏸';
                            playBtn.style.color = '#ff9900';
                        }).catch(err => {
                            console.warn('Autoplay bloqueado ou aguardando clique explícito:', err);
                            trackName.textContent = '▶ Clique Play para iniciar: ' + file.name;
                            playBtn.textContent = '▶';
                            playBtn.style.color = '#00ff88';
                        });
                    }
                } catch(err) {
                    console.error('Erro ao carregar arquivo de áudio:', err);
                    trackName.textContent = 'Erro ao carregar: ' + err.message;
                    trackName.style.color = '#ff4444';
                }
            }

            // Suporte para arrastar e soltar arquivo direto na barra do player
            const playerBar = document.getElementById('audio-player-bar');
            if (playerBar) {
                playerBar.ondragover = (e) => {
                    e.preventDefault();
                    playerBar.style.borderColor = '#ff9900';
                };
                playerBar.ondragleave = () => {
                    playerBar.style.borderColor = '#3d3f47';
                };
                playerBar.ondrop = (e) => {
                    e.preventDefault();
                    playerBar.style.borderColor = '#3d3f47';
                    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        loadAndPlayAudioFile(e.dataTransfer.files[0]);
                    }
                };
            }

            playBtn.onclick = async () => {
                if (!playerElement.src) return;
                ensureAudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                setupPlayerAudioNodes();
                if (playerElement.paused) {
                    try {
                        await playerElement.play();
                        playBtn.textContent = '⏸';
                        playBtn.style.color = '#ff9900';
                    } catch(err) {
                        console.error('Erro ao dar play:', err);
                    }
                } else {
                    playerElement.pause();
                    playBtn.textContent = '▶';
                    playBtn.style.color = '#00ff88';
                }
            };

            playerElement.onerror = (e) => {
                console.error('Elemento de áudio com erro:', playerElement.error);
                trackName.textContent = 'Formato não suportado pelo navegador';
                trackName.style.color = '#ff4444';
            };

            playerElement.ontimeupdate = () => {
                const cur = playerElement.currentTime || 0;
                const dur = playerElement.duration || 0;
                timeLabel.textContent = formatAudioTime(cur) + ' / ' + formatAudioTime(dur);
                if (dur > 0) {
                    const pct = (cur / dur) * 100;
                    progressFill.style.width = pct + '%';
                }
            };

            playerElement.onended = () => {
                playBtn.textContent = '▶';
                playBtn.style.color = '#00ff88';
                progressFill.style.width = '0%';
            };

            if (progressBar) {
                progressBar.onclick = (e) => {
                    if (!playerElement.duration) return;
                    const rect = progressBar.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const ratio = Math.max(0, Math.min(1, clickX / rect.width));
                    playerElement.currentTime = ratio * playerElement.duration;
                };
            }
        }

        function setupPlayerAudioNodes() {
            ensureAudioCtx();
            initMixerAudioGraph();
            if (playerSourceNode) return; // já configurado

            try {
                // Conecta o elemento de áudio ao Web Audio Graph
                playerSourceNode = audioCtx.createMediaElementSource(playerElement);

                // Analisador exclusivo do player
                playerAnalyser = createAnalyser(audioCtx);

                // Roteamento físico de estúdio:
                // Player -> playerAnalyser -> Entrada (HPF / EQ) do Canal 0 (LR Entrada)
                playerSourceNode.connect(playerAnalyser);
                if (channelStripsData[0]) {
                    const targetNode = channelStripsData[0].preampGain || channelStripsData[0].channelInputNode || (channelStripsData[0].eqFilters && channelStripsData[0].eqFilters[0]);
                    if (targetNode) {
                        try { playerAnalyser.connect(targetNode); } catch(e) {}
                    }
                }

                // Aplica imediatamente a posição atual de todos os faders
                for (let ch = 0; ch < 11; ch++) {
                    updateChannelFaderGain(ch);
                }

                console.log('[Player] Web Audio Graph conectado aos EQs do Mixer com sucesso!');
            } catch(e) {
                console.warn('[Player] Erro ao conectar nós de áudio do player:', e);
            }
        }

        // Atualiza os ganhos dos faders do mixer
        function updateInputChannelVolume() {
            for (let ch = 0; ch < 11; ch++) {
                updateChannelFaderGain(ch);
            }
        }

        // ── Loop de Animação do VU Meter ─────────────────────────────
        // O VU meter SÓ se move quando houver sinal de áudio real OU ruído rosa acionado
        function vuLoop() {
            requestAnimationFrame(vuLoop);

            // Mede sinal geral da entrada (Canal 0 pós-EQ, player ou microfone)
            let inputSignalPct = 0;
            const activeInputAnalyser = (channelStripsData[0] && channelStripsData[0].rtaAnalyser)
                ? channelStripsData[0].rtaAnalyser
                : (playerAnalyser || micAnalyser);

            if (activeInputAnalyser) {
                const buf = new Float32Array(activeInputAnalyser.fftSize);
                activeInputAnalyser.getFloatTimeDomainData(buf);
                let sum = 0;
                for (let j = 0; j < buf.length; j++) sum += buf[j] * buf[j];
                const rms = Math.sqrt(sum / buf.length);
                if (rms > 0.001) {
                    const db = 20 * Math.log10(rms);
                    // -50dB = 0%, 0dB = 72% (marca 0U), +6dB = 100%
                    inputSignalPct = Math.max(0, Math.min(100, (db + 50) / 56 * 100));
                }
            }

            // Atualiza cada um dos 11 canais
            for (let i = 0; i < 11; i++) {
                const data = channelStripsData[i];
                if (!data || !data.meterFill) continue;

                const isMuted = data.muteBtn.classList.contains('muted');
                const faderPct = parseFloat(data.faderCap.style.bottom) || 0;

                let targetLevel = 0;

                if (!isMuted && faderPct > 1.0) {
                    // 1. Sinal do Ruído Rosa (apenas nos canais de saída 1 a 10)
                    let noiseLevel = 0;
                    if (i > 0 && data.noiseEnabled) {
                        const flutter = (Math.random() - 0.5) * 5;
                        noiseLevel = Math.max(0, Math.min(100, faderPct + flutter));
                    }

                    // 2. Sinal de Áudio Real (se presente: Player ou Mic)
                    let audioLevel = 0;
                    if (inputSignalPct > 0) {
                        const inputFaderPct = (channelStripsData[0] && !channelStripsData[0].muteBtn.classList.contains('muted'))
                            ? (parseFloat(channelStripsData[0].faderCap.style.bottom) || 0)
                            : 0;
                        const inputFactor = inputFaderPct / 100;

                        const inputGainDb = channelGainState[0] || 0.0;
                        const inputGainFactor = Math.pow(10, inputGainDb / 20.0);

                        if (i === 0) {
                            // LR Entrada Master recebe sinal proporcional ao fader e ganho de entrada
                            audioLevel = inputSignalPct * inputFactor * inputGainFactor;
                        } else {
                            // Canais 1 a 10 de Saída recebem sinal condicionado à Entrada LR, fader E ganho do canal
                            const chGainDb = channelGainState[i] || 0.0;
                            const chGainFactor = Math.pow(10, chGainDb / 20.0);
                            audioLevel = inputSignalPct * inputFactor * (faderPct / 100) * inputGainFactor * chGainFactor;
                        }
                    }

                    targetLevel = Math.max(audioLevel, noiseLevel);
                }

                // Balística de VU Meter analógico (Attack rápido, Decay suave)
                const attack = 0.65;
                const decay  = 0.16;
                const speed = targetLevel > vuSmooth[i] ? attack : decay;
                vuSmooth[i] += (targetLevel - vuSmooth[i]) * speed;

                if (vuSmooth[i] < 0.25) vuSmooth[i] = 0;

                // A cortina escura cobre o medidor: 100% = apagado (silêncio)
                // Quanto maior o sinal, menor a cortina (revela o gradiente verde/amarelo/vermelho)
                data.meterFill.style.height = (100 - vuSmooth[i]) + '%';
            }
        }

        // Inicia o motor de VU, player local e captura de áudio
        vuLoop();
        initLocalAudioPlayer();
        startMicCapture();

        const eqOnBtn = document.getElementById('eq-on-btn');
        eqOnBtn.onclick = () => {
            eqEnabled = !eqEnabled;
            if (typeof channelEQEnabled !== 'undefined') {
                channelEQEnabled[activeChannelIdx] = eqEnabled;
            }
            eqOnBtn.textContent = eqEnabled ? 'EQ: On' : 'EQ: Off';
            eqOnBtn.style.background = eqEnabled ? '#FF9900' : '#555';
            eqOnBtn.style.color = eqEnabled ? '#000' : '#FFF';
            drawEQGraph();
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(true);
        };

        // ── Botão Reset Geral do Equalizador ──────────────────────────
        const resetEQBtn = document.getElementById('reset-eq-btn');
        resetEQBtn.onclick = () => {
            // Restaura todas as 6 bandas do canal ativo para o padrão original (flat 0 dB)
            channelEQState[activeChannelIdx] = JSON.parse(JSON.stringify(defaultBands));
            currentBands = channelEQState[activeChannelIdx];

            // Reseta também o HPF do canal ativo
            channelHPFState[activeChannelIdx] = { enabled: false, freq: 80, slope: 12 };
            updateHPFUI();

            // Atualiza os valores visuais dos boxes de cada banda
            currentBands.forEach((b, i) => {
                const freqStr = b.freq >= 1000 ? (b.freq / 1000).toFixed(2) + 'k' : b.freq + ' Hz';
                setBoxVal(document.getElementById(`bx-f-${i}`), freqStr);
                setBoxVal(document.getElementById(`bx-g-${i}`), b.gain.toFixed(1));
                setBoxVal(document.getElementById(`bx-q-${i}`), b.q.toFixed(1));
            });

            updateKnobs();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(true);
        };

        const defaultBands = [
            { id: 1, name: 'Low',     color: '#00FFFF', freq: 80,    gain: 0,    q: 2.0, mode: 'LShv' },
            { id: 2, name: 'Low 2',   color: '#00FF00', freq: 160,   gain: 0,    q: 2.0, mode: 'PEQ'  },
            { id: 3, name: 'Low Mid', color: '#FFFF00', freq: 500,   gain: 0,    q: 2.0, mode: 'PEQ'  },
            { id: 4, name: 'High Mid',color: '#FF00FF', freq: 1720,  gain: 0,    q: 1.4, mode: 'PEQ'  },
            { id: 5, name: 'High 2',  color: '#FF0000', freq: 4370,  gain: 0,    q: 2.0, mode: 'PEQ'  },
            { id: 6, name: 'High',    color: '#FF8800', freq: 10000, gain: 0,    q: 2.0, mode: 'HShv' }
        ];

        // ── Per-channel EQ state (11 channels: 1 Entrada LR + 10 Saídas Ch 1..10) ──
        const NUM_CHANNELS = 11;
        const channelEQState = Array.from({length: NUM_CHANNELS}, () =>
            JSON.parse(JSON.stringify(defaultBands))
        );
        const channelEQEnabled = new Array(NUM_CHANNELS).fill(true);
        const channelHPFState = Array.from({length: NUM_CHANNELS}, () => ({
            enabled: false,
            freq: 80,
            slope: 12
        }));
        let activeChannelIdx = 0; // which channel's EQ is open

        function getActiveHPF() {
            return channelHPFState[activeChannelIdx];
        }

        function getHPFResponseDb(f, hpf) {
            if (!hpf || !hpf.enabled) return 0;
            const order = (hpf.slope === 24) ? 8 : 4;
            const ratio = (hpf.freq || 80) / Math.max(1, f);
            const db = -10 * Math.log10(1 + Math.pow(ratio, order));
            return Math.max(-36, db);
        }

        function updateHPFUI() {
            const hpf = getActiveHPF();
            if (!hpf) return;
            const hpfBtn = document.getElementById('hpf-btn');
            if (hpfBtn) {
                hpfBtn.textContent = hpf.enabled ? 'HPF: On' : 'HPF: Off';
                hpfBtn.style.background = hpf.enabled ? '#00E5FF' : '#555';
                hpfBtn.style.color = hpf.enabled ? '#000' : '#FFF';
            }
            const boxToggle = document.getElementById('hpf-box-toggle');
            if (boxToggle) {
                boxToggle.textContent = hpf.enabled ? 'ON' : 'OFF';
                boxToggle.classList.toggle('active', hpf.enabled);
            }
            const slopeBtn = document.getElementById('hpf-slope-btn');
            if (slopeBtn) {
                slopeBtn.textContent = `${hpf.slope} dB`;
            }
            const freqInput = document.getElementById('bx-hpf-f');
            if (freqInput) {
                const freqStr = hpf.freq >= 1000 ? (hpf.freq/1000).toFixed(2) + 'k' : Math.round(hpf.freq) + ' Hz';
                if (document.activeElement !== freqInput) freqInput.value = freqStr;
            }
            const hpfBox = document.getElementById('band-box-hpf');
            if (hpfBox) {
                hpfBox.classList.toggle('selected', selectedBandIndex === -1);
            }
        }

        function toggleHPF() {
            const hpf = getActiveHPF();
            if (!hpf) return;
            hpf.enabled = !hpf.enabled;
            updateHPFUI();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(true);
        }

        function toggleHPFSlope() {
            const hpf = getActiveHPF();
            if (!hpf) return;
            hpf.slope = (hpf.slope === 12) ? 24 : 12;
            updateHPFUI();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(true);
        }

        function onHPFFreqBoxChange(rawVal) {
            selectBand(-1);
            const hpf = getActiveHPF();
            if (!hpf) return;
            let s = String(rawVal).trim().toLowerCase().replace(',', '.');
            let isK = s.includes('k');
            s = s.replace(/[^0-9.]/g, '');
            let num = parseFloat(s);
            if (!isNaN(num)) {
                if (isK && num < 100) num *= 1000;
                hpf.freq = Math.max(20, Math.min(1000, Math.round(num)));
            }
            updateHPFUI();
            updateKnobs();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(true);
        }

        function renderChannelSelector(channelIdx) {
            const chSelectorRow = document.getElementById('ch-selector');
            if(!chSelectorRow) return;
            chSelectorRow.innerHTML = '';
            const channelStrips = document.querySelectorAll('.channel-strip');

            for (let i = 0; i < NUM_CHANNELS; i++) {
                const btn = document.createElement('button');
                btn.className = `ch-btn ${i === channelIdx ? 'active' : ''}`;
                
                let labelName = i === 0 ? 'LR' : `${i}`;
                if (channelStrips[i]) {
                    const inp = channelStrips[i].querySelector('.channel-input');
                    if (inp && inp.value.trim() !== '') {
                        labelName = i === 0 ? 'LR' : `${i}: ${inp.value.trim()}`;
                    }
                }
                btn.textContent = labelName;
                btn.onclick = () => {
                    initModal(i);
                };
                chSelectorRow.appendChild(btn);
            }
            const activeBtn = chSelectorRow.querySelector('.ch-btn.active');
            if(activeBtn) {
                setTimeout(() => activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }), 50);
            }
        }

        
        // ═════════════════════════════════════════════════════════════════════
        // ── 31-Band Graphic Equalizer (GEQ) Implementation ─────────────────
        // ═════════════════════════════════════════════════════════════════════

        let geqSyncTimer = null;
        function sendGEQSync(chIdx, immediate = false) {
            if (geqSyncTimer) clearTimeout(geqSyncTimer);
            const payload = {
                type: 'geq',
                channel: chIdx,
                bands: channelGEQState[chIdx] ? [...channelGEQState[chIdx]] : new Array(NUM_GEQ_BANDS).fill(0.0),
                enabled: (channelEQEnabled[chIdx] !== false)
            };
            if (immediate) {
                sendSync(payload);
            } else {
                geqSyncTimer = setTimeout(() => sendSync(payload), 40);
            }
        }

        // Alterna entre modo Paramétrico (PEQ) e Gráfico (GEQ)
        function setChannelEQMode(mode, syncRemote = true) {
            const ch = activeChannelIdx;
            channelEQMode[ch] = mode;

            const btnPeq = document.getElementById('btn-mode-peq');
            const btnGeq = document.getElementById('btn-mode-geq');
            const peqView = document.getElementById('peq-view');
            const geqView = document.getElementById('geq-view');

            if (btnPeq) btnPeq.classList.toggle('active', mode === 'peq');
            if (btnGeq) btnGeq.classList.toggle('active', mode === 'geq');

            if (peqView) {
                if (mode === 'peq') {
                    peqView.classList.remove('hidden');
                    currentBands = (typeof channelEQState !== 'undefined' && channelEQState[ch])
                        ? channelEQState[ch] : defaultBands;
                    currentBands.forEach((b, k) => {
                        const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2)+'k' : Math.round(b.freq)+' Hz';
                        setBoxVal(document.getElementById(`bx-f-${k}`), freqStr);
                        setBoxVal(document.getElementById(`bx-g-${k}`), b.gain.toFixed(1));
                        setBoxVal(document.getElementById(`bx-q-${k}`), b.q.toFixed(1));
                    });
                    if (typeof updateHPFUI === 'function') updateHPFUI();
                    if (typeof updateKnobs === 'function') updateKnobs();
                    if (typeof drawEQGraph === 'function') drawEQGraph();
                    syncModalGain(ch);
                    syncModalFader(ch);
                } else {
                    peqView.classList.add('hidden');
                }
            }

            if (geqView) {
                if (mode === 'geq') {
                    geqView.classList.add('active');
                    renderGEQSliders(ch);
                    updateGEQToolbarUI();
                    updateRTAButtonsUI();
                    syncModalGain(ch);
                    syncModalFader(ch);
                } else {
                    geqView.classList.remove('active');
                    if (typeof clearGEQRTABars === 'function') clearGEQRTABars();
                }
            }

            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(ch);
            }
            if (typeof drawMiniEQ === 'function') {
                drawMiniEQ(ch);
            }

            if (syncRemote) {
                sendSync({
                    type: 'eq_mode',
                    channel: ch,
                    value: mode
                });
                if (typeof scheduleSaveLocalState === 'function') {
                    scheduleSaveLocalState(150);
                }
            }
        }

        function updateGEQToolbarUI() {
            const isEqOn = (channelEQEnabled[activeChannelIdx] !== false);
            const geqOnBtn = document.getElementById('geq-on-btn');
            if (geqOnBtn) {
                geqOnBtn.textContent = isEqOn ? 'GEQ: On' : 'GEQ: Bypass';
                geqOnBtn.style.background = isEqOn ? '#ff9900' : '#444';
                geqOnBtn.style.color = isEqOn ? '#000' : '#fff';
            }
        }

        function toggleGEQBypass() {
            const ch = activeChannelIdx;
            const newState = !(channelEQEnabled[ch] !== false);
            channelEQEnabled[ch] = newState;

            eqEnabled = newState;
            if (eqOnBtn) {
                eqOnBtn.textContent = eqEnabled ? 'EQ: On' : 'EQ: Off';
                eqOnBtn.style.background = eqEnabled ? '#FF9900' : '#555';
                eqOnBtn.style.color = eqEnabled ? '#000' : '#FFF';
            }
            updateGEQToolbarUI();

            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(ch);
            }
            if (typeof drawMiniEQ === 'function') {
