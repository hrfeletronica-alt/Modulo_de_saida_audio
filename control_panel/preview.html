            }

            sendGEQSync(ch, true);
            if (typeof scheduleSaveLocalState === 'function') {
                scheduleSaveLocalState(100);
            }
        }

        function resetGEQFlat() {
            const ch = activeChannelIdx;
            if (!channelGEQState[ch]) {
                channelGEQState[ch] = new Array(NUM_GEQ_BANDS).fill(0.0);
            } else {
                channelGEQState[ch].fill(0.0);
            }

            for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                updateGEQSliderUI(k, 0.0);
            }

            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(ch);
            }
            if (typeof drawMiniEQ === 'function') {
                drawMiniEQ(ch);
            }

            sendGEQSync(ch, true);
            if (typeof scheduleSaveLocalState === 'function') {
                scheduleSaveLocalState(100);
            }
        }

        function updateGEQSliderUI(bandIdx, valDb) {
            valDb = Math.max(-12.0, Math.min(12.0, valDb));
            const col = document.getElementById(`geq-col-${bandIdx}`);
            if (!col) return;

            const valEl  = col.querySelector('.geq-db-val');
            const fillEl = col.querySelector('.geq-fill-bar');
            const capEl  = col.querySelector('.geq-cap');

            // Formatação do dB text
            if (valEl) {
                valEl.textContent = (valDb > 0 ? '+' : '') + valDb.toFixed(1);
                valEl.className = 'geq-db-val' + (valDb > 0.05 ? ' boosted' : (valDb < -0.05 ? ' cut' : ''));
            }

            // Posição percentual do cap fader (0% em -12 dB, 50% em 0 dB, 100% em +12 dB)
            const pct = (valDb + 12.0) / 24.0;
            if (capEl) {
                capEl.style.bottom = (pct * 100).toFixed(2) + '%';
            }

            // Barra vermelha de preenchimento a partir do centro (0 dB)
            if (fillEl) {
                if (valDb > 0.01) {
                    fillEl.style.bottom = '50%';
                    fillEl.style.top = 'auto';
                    fillEl.style.height = ((valDb / 24.0) * 100).toFixed(2) + '%';
                    fillEl.className = 'geq-fill-bar';
                } else if (valDb < -0.01) {
                    fillEl.style.top = '50%';
                    fillEl.style.bottom = 'auto';
                    fillEl.style.height = ((Math.abs(valDb) / 24.0) * 100).toFixed(2) + '%';
                    fillEl.className = 'geq-fill-bar cut-fill';
                } else {
                    fillEl.style.height = '0px';
                }
            }
        }

        function setGEQBandGain(chIdx, bandIdx, valDb, isFinal = false) {
            valDb = Math.max(-12.0, Math.min(12.0, Math.round(valDb * 10) / 10));
            if (!channelGEQState[chIdx]) {
                channelGEQState[chIdx] = new Array(NUM_GEQ_BANDS).fill(0.0);
            }
            channelGEQState[chIdx][bandIdx] = valDb;

            updateGEQSliderUI(bandIdx, valDb);

            // Atualiza nó de áudio Web Audio do filtro peaking correspondente
            const data = channelStripsData[chIdx];
            if (data && data.geqFilters && data.geqFilters[bandIdx]) {
                const isEqActive = (channelEQEnabled[chIdx] !== false) && (channelEQMode[chIdx] === 'geq');
                try {
                    data.geqFilters[bandIdx].gain.setTargetAtTime(isEqActive ? valDb : 0.0, audioCtx.currentTime, 0.01);
                } catch(e) {}
            }

            if (typeof drawMiniEQ === 'function') {
                drawMiniEQ(chIdx);
            }

            sendGEQSync(chIdx, isFinal);
            if (isFinal && typeof scheduleSaveLocalState === 'function') {
                scheduleSaveLocalState(150);
            }
        }

        function setupGEQSliderEvents(col, bandIdx) {
            const track = col.querySelector('.geq-slider-track');
            const cap   = col.querySelector('.geq-cap');
            const valEl = col.querySelector('.geq-db-val');
            if (!track) return;

            let isDragging = false;

            function calcGainFromY(clientY) {
                const rect = track.getBoundingClientRect();
                const rawPct = 1 - (clientY - rect.top) / rect.height;
                const clampedPct = Math.max(0, Math.min(1, rawPct));
                let db = (clampedPct * 24.0) - 12.0;
                // Snap suave para 0 dB
                if (Math.abs(db) < 0.25) db = 0.0;
                return Math.round(db * 10) / 10;
            }

            // Pointer / Mouse events
            track.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                isDragging = true;
                track.classList.add('dragging');
                try { track.setPointerCapture(e.pointerId); } catch(err) {}
                const db = calcGainFromY(e.clientY);
                setGEQBandGain(activeChannelIdx, bandIdx, db, false);
            });

            track.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const db = calcGainFromY(e.clientY);
                setGEQBandGain(activeChannelIdx, bandIdx, db, false);
            });

            const onRelease = (e) => {
                if (!isDragging) return;
                isDragging = false;
                track.classList.remove('dragging');
                try { track.releasePointerCapture(e.pointerId); } catch(err) {}
                const curDb = (channelGEQState[activeChannelIdx] && channelGEQState[activeChannelIdx][bandIdx] !== undefined)
                    ? channelGEQState[activeChannelIdx][bandIdx] : 0.0;
                setGEQBandGain(activeChannelIdx, bandIdx, curDb, true);
            };

            track.addEventListener('pointerup', onRelease);
            track.addEventListener('pointercancel', onRelease);

            // Duplo clique reseta para 0 dB
            track.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                setGEQBandGain(activeChannelIdx, bandIdx, 0.0, true);
            });

            // Clique no valor de dB reseta para 0 dB
            if (valEl) {
                valEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setGEQBandGain(activeChannelIdx, bandIdx, 0.0, true);
                });
            }

            // Mouse wheel para ajuste fino (±0.5 dB)
            track.addEventListener('wheel', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const step = (e.deltaY < 0 ? 0.5 : -0.5);
                const cur = (channelGEQState[activeChannelIdx] && channelGEQState[activeChannelIdx][bandIdx] !== undefined)
                    ? channelGEQState[activeChannelIdx][bandIdx] : 0.0;
                const newDb = Math.max(-12.0, Math.min(12.0, cur + step));
                setGEQBandGain(activeChannelIdx, bandIdx, newDb, true);
            }, { passive: false });
        }

        // Renderiza ou sincroniza os 31 sliders no rack
        function renderGEQSliders(channelIdx) {
            const rack = document.getElementById('geq-rack');
            if (!rack) return;

            if (!channelGEQState[channelIdx]) {
                channelGEQState[channelIdx] = new Array(NUM_GEQ_BANDS).fill(0.0);
            }
            const bands = channelGEQState[channelIdx];

            // Se o rack ainda não possui as 31 colunas, constrói a estrutura DOM
            if (rack.children.length !== NUM_GEQ_BANDS) {
                rack.innerHTML = '';
                for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                    const col = document.createElement('div');
                    col.className = 'geq-col';
                    col.id = `geq-col-${k}`;
                    col.innerHTML = `
                        <div class="geq-db-val" title="Clique ou duplo-clique para 0 dB">0.0</div>
                        <div class="geq-slider-track" title="${ISO_GEQ_LABELS[k]} Hz • Arraste verticalmente, duplo-clique para 0 dB">
                            <div class="geq-track-groove"></div>
                            <div class="geq-rta-bar" id="geq-rta-bar-${k}"></div>
                            <div class="geq-rta-peak" id="geq-rta-peak-${k}"></div>
                            <div class="geq-center-zero-line"></div>
                            <div class="geq-fill-bar" style="height: 0px;"></div>
                            <div class="geq-cap" style="bottom: 50%;"></div>
                        </div>
                        <div class="geq-freq-lbl">${ISO_GEQ_LABELS[k]}</div>
                    `;
                    rack.appendChild(col);
                    setupGEQSliderEvents(col, k);
                }
            }

            // Atualiza os valores visuais dos 31 faders
            for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                updateGEQSliderUI(k, bands[k] || 0.0);
            }
        }

        function initModal(channelIdx) {
            activeChannelIdx = channelIdx;
            // Load this channel's saved EQ state (do NOT clone — edits update it directly)
            currentBands = channelEQState[channelIdx];

            // Carrega modo EQ do canal (Paramétrico ou Gráfico)
            const curMode = (typeof channelEQMode !== 'undefined' && channelEQMode[channelIdx]) ? channelEQMode[channelIdx] : 'peq';
            setChannelEQMode(curMode, false);

            eqEnabled = (channelEQEnabled[channelIdx] !== false);
            eqOnBtn.textContent = eqEnabled ? 'EQ: On' : 'EQ: Off';
            eqOnBtn.style.background = eqEnabled ? '#FF9900' : '#555';
            eqOnBtn.style.color = eqEnabled ? '#000' : '#FFF';

            const channelStrips = document.querySelectorAll('.channel-strip');

                if (inp) modalTitle.textContent = "EQ Eight - " + inp.value;

            const boxesContainer = document.getElementById('band-boxes');
            boxesContainer.innerHTML = '';
            
            // Box dedicado do Filtro Passa-Altas (HPF)

            hpfBox.id = 'band-box-hpf';
            hpfBox.onclick = () => selectBand(-1);
            const hpfFreqStr = hpf.freq >= 1000 ? (hpf.freq/1000).toFixed(2)+'k' : Math.round(hpf.freq)+' Hz';
            hpfBox.innerHTML = `
                <div class="band-header">
                    <div class="band-num" style="background: #00E5FF; color: #000; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 3px;">HP</div>
                    <div class="band-name" style="color: #00E5FF;">HPF</div>
                    <button class="hpf-toggle-btn ${hpf.enabled ? 'active' : ''}" id="hpf-box-toggle" onclick="event.stopPropagation(); toggleHPF();">${hpf.enabled ? 'ON' : 'OFF'}</button>
                </div>
                <div class="band-param"><span class="param-lbl">Freq</span><input type="text" class="param-val-box" id="bx-hpf-f" value="${hpfFreqStr}" onclick="event.stopPropagation()" onfocus="this.select()" onchange="onHPFFreqBoxChange(this.value)" onkeydown="if(event.key==='Enter'){this.blur();}"></div>
                <div class="band-param"><span class="param-lbl">Slope</span><button class="hpf-slope-btn" id="hpf-slope-btn" onclick="event.stopPropagation(); toggleHPFSlope();">${hpf.slope} dB</button></div>
                <div class="band-param"><span class="param-lbl">Status</span><span style="font-size:10px; font-weight:bold; color:${hpf.enabled ? '#00E5FF' : '#888'}; cursor:pointer;" onclick="event.stopPropagation(); toggleHPF();">${hpf.enabled ? 'ATIVO' : 'BYPASS'}</span></div>
            `;
            boxesContainer.appendChild(hpfBox);

            currentBands.forEach((b, i) => {
                const box = document.createElement('div');
                box.className = `band-box b${b.id} ${i === selectedBandIndex ? 'selected' : ''}`;
                box.onclick = () => selectBand(i);
                
                const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2)+'k' : b.freq+' Hz';
                box.innerHTML = `
                    <div class="band-header">
                        <div class="band-num">${b.id}</div>
                        <div class="band-name">${b.name}</div>
                    </div>
                    <div class="band-param"><span class="param-lbl">Freq</span><input type="text" class="param-val-box" id="bx-f-${i}" value="${freqStr}" onclick="event.stopPropagation()" onfocus="this.select()" onchange="onBoxParamChange(${i}, 'freq', this.value)" onkeydown="if(event.key==='Enter'){this.blur();}"></div>
                    <div class="band-param"><span class="param-lbl">Gain</span><input type="text" class="param-val-box" id="bx-g-${i}" value="${b.gain.toFixed(1)}" onclick="event.stopPropagation()" onfocus="this.select()" onchange="onBoxParamChange(${i}, 'gain', this.value)" onkeydown="if(event.key==='Enter'){this.blur();}"></div>
                    <div class="band-param"><span class="param-lbl">Q</span><input type="text" class="param-val-box" id="bx-q-${i}" value="${b.q.toFixed(1)}" onclick="event.stopPropagation()" onfocus="this.select()" onchange="onBoxParamChange(${i}, 'q', this.value)" onkeydown="if(event.key==='Enter'){this.blur();}"></div>
                `;
                boxesContainer.appendChild(box);
            });
            
            updateHPFUI();
            updateKnobs();
            drawEQGraph();

            if (typeof syncModalGain === 'function') syncModalGain(channelIdx);

        function setBoxVal(el, val) {
            if (!el) return;
            if (el.tagName === 'INPUT') {
                if (document.activeElement !== el) el.value = val;
            } else {
                el.textContent = val;
            }
        }

        function onBoxParamChange(bandIdx, param, rawVal) {
            selectBand(bandIdx);
            const b = currentBands[bandIdx];
            if (!b) return;

            let s = String(rawVal).trim().toLowerCase().replace(',', '.');
            if (param === 'freq') {
                let isK = s.includes('k');
                s = s.replace(/[^0-9.]/g, '');
                let num = parseFloat(s);
                if (!isNaN(num)) {
                    if (isK && num < 100) num *= 1000;
                    b.freq = Math.max(20, Math.min(20000, Math.round(num)));
                }
            } else if (param === 'gain') {
                s = s.replace(/[^0-9.-]/g, '');
                let num = parseFloat(s);
                if (!isNaN(num)) {
                    b.gain = Math.max(-15, Math.min(15, Math.round(num * 10) / 10));
                }
            } else if (param === 'q') {
                s = s.replace(/[^0-9.]/g, '');
                let num = parseFloat(s);
                if (!isNaN(num)) {
                    b.q = Math.max(0.1, Math.min(10, Math.round(num * 10) / 10));
                }
            }

            const freqStr = b.freq >= 1000 ? (b.freq / 1000).toFixed(2) + 'k' : b.freq + ' Hz';
            const fEl = document.getElementById(`bx-f-${bandIdx}`);
            const gEl = document.getElementById(`bx-g-${bandIdx}`);
            const qEl = document.getElementById(`bx-q-${bandIdx}`);
            if (fEl) fEl.value = freqStr;
            if (gEl) gEl.value = b.gain.toFixed(1);
            if (qEl) qEl.value = b.q.toFixed(1);

            updateKnobs();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(true);
        }

        function selectBand(index) {
            selectedBandIndex = index;
            const hpfBox = document.getElementById('band-box-hpf');
            if (hpfBox) hpfBox.classList.toggle('selected', index === -1);
            const nonHpfBoxes = document.querySelectorAll('.band-box:not(.band-box-hpf)');
            nonHpfBoxes.forEach((b, i) => {
                b.classList.toggle('selected', i === index);
            });
            const targetBox = (index === -1) ? hpfBox : (nonHpfBoxes ? nonHpfBoxes[index] : null);
            if (targetBox && targetBox.scrollIntoView) {
                try {
                    targetBox.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } catch(e) {}
            }
            updateKnobs();
            drawEQGraph();
        }

        function stepParam(type, dir) {
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (!hpf) return;
                if (type === 'freq') {
                    hpf.freq = Math.max(20, Math.min(1000, Math.round(hpf.freq * (dir > 0 ? 1.15 : 0.87))));
                } else if (type === 'gain') {
                    hpf.slope = (hpf.slope === 12) ? 24 : 12;
                } else if (type === 'q') {
                    hpf.enabled = !hpf.enabled;
                }
                updateHPFUI();
                updateKnobs();
                drawEQGraph();
                drawMiniEQ(activeChannelIdx);
                if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
                notifyEQChanged(true);
                return;
            }
            const b = currentBands[selectedBandIndex];
            if (type === 'freq') {
                const minF = 20, maxF = 20000;
                b.freq = Math.max(minF, Math.min(maxF, b.freq * (dir > 0 ? 1.15 : 0.87)));
            } else if (type === 'gain') {
                b.gain = Math.max(-15, Math.min(15, Math.round((b.gain + dir * 0.5) * 10) / 10));
            } else if (type === 'q') {
                b.q = Math.max(0.2, Math.min(10, Math.round((b.q + dir * 0.1) * 10) / 10));
            }
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(true);
        }

        function updateKnobs() {
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (!hpf) return;
                const freqStr = hpf.freq >= 1000 ? (hpf.freq/1000).toFixed(2) + 'k' : Math.round(hpf.freq) + ' Hz';
                document.getElementById('val-freq').textContent = freqStr;
                document.getElementById('val-gain').textContent = `${hpf.slope} dB`;
                document.getElementById('val-q').textContent = hpf.enabled ? 'ON' : 'OFF';

                const minF = Math.log10(20); const maxF = Math.log10(1000);
                const normF = (Math.log10(hpf.freq) - minF) / (maxF - minF);
                document.getElementById('ind-freq').style.transform = `rotate(${Math.max(0, Math.min(1, normF)) * 270 - 135}deg)`;
                document.getElementById('ind-gain').style.transform = hpf.slope === 24 ? 'rotate(90deg)' : 'rotate(-90deg)';
                document.getElementById('ind-q').style.transform = hpf.enabled ? 'rotate(90deg)' : 'rotate(-90deg)';
                return;
            }
            const b = currentBands[selectedBandIndex];
            if (!b) return;
            document.getElementById('val-freq').textContent = b.freq >= 1000 ? (b.freq/1000).toFixed(2) + 'k' : Math.round(b.freq) + ' Hz';
            document.getElementById('val-gain').textContent = (b.gain > 0 ? '+' : '') + b.gain.toFixed(1) + ' dB';
            document.getElementById('val-q').textContent = b.q.toFixed(2);
            
            const minF = Math.log10(20); const maxF = Math.log10(20000);
            const normF = (Math.log10(b.freq) - minF) / (maxF - minF);
            document.getElementById('ind-freq').style.transform = `rotate(${normF * 270 - 135}deg)`;

            const normG = (b.gain + 15) / 30;
            document.getElementById('ind-gain').style.transform = `rotate(${normG * 270 - 135}deg)`;

            const normQ = b.q / 10;
            document.getElementById('ind-q').style.transform = `rotate(${normQ * 270 - 135}deg)`;
        }

        function drawEQGraph() {
            const canvas = document.getElementById('eqGraph');
            const ctx = canvas.getContext('2d');
            
            // Adjust internal canvas resolution to match display size for crisp lines
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0 && (canvas.width !== rect.width || canvas.height !== rect.height)) {
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            
            const w = canvas.width; const h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i = 0; i <= 6; i++) {
                const y = i * (h / 6);
                ctx.moveTo(0, y); ctx.lineTo(w, y);
            }
            const freqs = [20, 40, 80, 100, 200, 400, 800, 1000, 2000, 4000, 8000, 10000, 20000];
            const minF = Math.log10(20); const maxF = Math.log10(20000);
            freqs.forEach(f => {
                const x = ((Math.log10(f) - minF) / (maxF - minF)) * w;
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
            });
            ctx.stroke();

            ctx.strokeStyle = '#555'; ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();

            // --- RTA Bars (drawn behind EQ curve, from bottom = -15dB upward) ---
            if(rtaEnabled && rtaBands.length > 0) {
                const numBars = rtaBands.length;
                const barW = w / numBars;
                for(let b = 0; b < numBars; b++) {
                    // Full height = full scale (bottom of canvas = -15dB)
                    const barH = rtaBands[b] * h;
                    const bx   = b * barW;
                    const by   = h - barH; // start from the very bottom

                    // Color gradient: dark green (quiet) → bright green → yellow at top
                    const pct = rtaBands[b];
                    const r  = Math.round(pct * pct * 220);
                    const g  = Math.round(180 + pct * 60);
                    const bl = Math.round(30);
                    ctx.fillStyle = `rgba(${r},${g},${bl},0.50)`;
                    ctx.fillRect(bx, by, barW - 1, barH);

                    // Peak hold indicator (bright line at top of bar)
                    ctx.fillStyle = `rgba(${Math.min(255,r+80)},${g},${bl},0.95)`;
                    ctx.fillRect(bx, by - 2, barW - 1, 2);
                }
            }

            // Draw EQ curve (flat if EQ disabled)
            ctx.beginPath();
            ctx.moveTo(0, h/2);
            
            const hpf = getActiveHPF();
            let points = [];
            for(let px = 0; px <= w; px++) {
                const curLogF = minF + (px/w)*(maxF - minF);
                const curF = Math.pow(10, curLogF);
                
                let totalDb = 0;
                if(eqEnabled) {
                    if (hpf && hpf.enabled) {
                        totalDb += getHPFResponseDb(curF, hpf);
                    }
                    currentBands.forEach(b => {
                        if(b.gain === 0) return;
                        const octDiff = Math.log2(curF / b.freq);
                        const bw = 1 / b.q; 
                        const response = b.gain * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                        totalDb += response;
                    });
                }
                
                let y = h/2 - (totalDb / 15) * (h/2);
                y = Math.max(0, Math.min(h, y));
                points.push({x: px, y: y});
                ctx.lineTo(px, y);
            }
            
            const fillPath = new Path2D();
            fillPath.moveTo(0, h/2);
            points.forEach(p => fillPath.lineTo(p.x, p.y));
            fillPath.lineTo(w, h/2);
            fillPath.closePath();
            ctx.fillStyle = eqEnabled ? "rgba(255,136,0,0.6)" : "rgba(100,100,100,0.3)";
            ctx.fill(fillPath);

            ctx.strokeStyle = eqEnabled ? "#FF8800" : "#888";
            ctx.lineWidth = 2;
            ctx.beginPath();
            points.forEach((p, i) => {
                if(i===0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            // Draw HPF Handle Node on graph
            if (hpf) {
                const hpfX = ((Math.log10(hpf.freq) - minF) / (maxF - minF)) * w;
                const hpfDb = (eqEnabled && hpf.enabled) ? getHPFResponseDb(hpf.freq, hpf) : 0;
                const hpfY = h/2 - (hpfDb / 15) * (h/2);
                const isSelected = (selectedBandIndex === -1);
                const nodeColor = hpf.enabled ? "#00E5FF" : "#667788";

                // Guia vertical ciano
                ctx.strokeStyle = hpf.enabled ? "rgba(0, 229, 255, 0.30)" : "rgba(255, 255, 255, 0.08)";
                ctx.lineWidth = isSelected ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(hpfX, 0); ctx.lineTo(hpfX, h);
                ctx.stroke();

                // Círculo externo (touch target)
                const radius = isSelected ? 26 : 20;
                ctx.beginPath();
                ctx.arc(hpfX, hpfY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = isSelected ? "rgba(0, 229, 255, 0.45)" : "rgba(0, 229, 255, 0.15)";
                ctx.fill();

                // Círculo interno sólido
                const innerRadius = isSelected ? 15 : 12;
                ctx.beginPath();
                ctx.arc(hpfX, hpfY, innerRadius, 0, 2 * Math.PI);
                ctx.fillStyle = nodeColor;
                ctx.fill();

                // Texto HP
                ctx.fillStyle = hpf.enabled ? '#000' : '#FFF';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('HP', hpfX, hpfY);
            }

            currentBands.forEach((b, i) => {
                const x = ((Math.log10(b.freq) - minF) / (maxF - minF)) * w;
                const y = h/2 - (b.gain / 15) * (h/2);
                
                const isSelected = (i === selectedBandIndex);
                
                // Faint vertical line
                ctx.strokeStyle = "rgba(255,255,255,0.05)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
                ctx.stroke();
                
                // Translucent outer circle (large for easy touch target)
                const radius = isSelected ? 26 : 20;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = b.color + (isSelected ? "88" : "44"); // Hex alpha
                ctx.fill();
                
                // Inner solid circle
                const innerRadius = isSelected ? 15 : 12;
                ctx.beginPath();
                ctx.arc(x, y, innerRadius, 0, 2 * Math.PI);
                ctx.fillStyle = b.color;
                ctx.fill();
                
                // Band ID text
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.id, x, y);
            });
        }

        // Mouse and Touch interaction for knobs
        let isDragging = false;
        let startY = 0;
        let activeKnob = null;
        let lastKnobTapTime = 0;

        const startDrag = (y, knobId) => {
            isDragging = true;
            startY = y;
            activeKnob = knobId;
        };

        const resetKnob = (knobId) => {
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (hpf) {
                    if (knobId === 'knob-freq') hpf.freq = 80;
                    else if (knobId === 'knob-gain') hpf.slope = 12;
                    else if (knobId === 'knob-q') hpf.enabled = false;
                    updateHPFUI();
                    updateKnobs();
                    drawEQGraph();
                    drawMiniEQ(activeChannelIdx);
                    if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
                    notifyEQChanged(true);
                }
                return;
            }
            const b = currentBands[selectedBandIndex];
            const def = defaultBands.find(db => db.id === b.id);
            if(knobId === 'knob-gain') {
                b.gain = 0;
                setBoxVal(document.getElementById(`bx-g-${selectedBandIndex}`), '0.0');
            } else if(knobId === 'knob-freq') {
                b.freq = def.freq;
                const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2) + 'k' : Math.round(b.freq) + ' Hz';
                setBoxVal(document.getElementById(`bx-f-${selectedBandIndex}`), freqStr);
            } else if(knobId === 'knob-q') {
                b.q = def.q;
                setBoxVal(document.getElementById(`bx-q-${selectedBandIndex}`), b.q.toFixed(2));
            }
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(true);
        };

        const moveDrag = (y) => {
            if(!isDragging || !activeKnob) return;
            const dy = startY - y; // up is positive
            startY = y;
            
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (hpf) {
                    if (activeKnob === 'knob-freq') {
                        const logF = Math.log10(hpf.freq);
                        const newF = Math.pow(10, logF + dy * 0.015);
                        hpf.freq = Math.max(20, Math.min(1000, Math.round(newF)));
                    } else if (activeKnob === 'knob-gain') {
                        if (dy > 4) hpf.slope = 24;
                        else if (dy < -4) hpf.slope = 12;
                    } else if (activeKnob === 'knob-q') {
                        if (dy > 4) hpf.enabled = true;
                        else if (dy < -4) hpf.enabled = false;
                    }
                    updateHPFUI();
                    updateKnobs();
                    drawEQGraph();
                    drawMiniEQ(activeChannelIdx);
                    if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
                    notifyEQChanged(false);
                }
                return;
            }

            const b = currentBands[selectedBandIndex];
            
            if(activeKnob === 'knob-freq') {
                const logF = Math.log10(b.freq);
                const newF = Math.pow(10, logF + dy * 0.015);
                b.freq = Math.max(20, Math.min(20000, newF));
                const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2) + 'k' : Math.round(b.freq) + ' Hz';
                setBoxVal(document.getElementById(`bx-f-${selectedBandIndex}`), freqStr);
            }
            else if(activeKnob === 'knob-gain') {
                b.gain = Math.max(-15, Math.min(15, b.gain + dy * 0.3));
                setBoxVal(document.getElementById(`bx-g-${selectedBandIndex}`), b.gain.toFixed(1));
            }
            else if(activeKnob === 'knob-q') {
                b.q = Math.max(0.1, Math.min(10, b.q + dy * 0.08));
                setBoxVal(document.getElementById(`bx-q-${selectedBandIndex}`), b.q.toFixed(2));
            }
            
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(false);
        };

        const endDrag = () => {
            if(isDragging) {
                isDragging = false;
                activeKnob = null;
                notifyEQChanged(true);
            }
        };

        document.querySelectorAll('.knob').forEach(knob => {
            const handleKnobStart = (y, id) => {
                const now = Date.now();
                if(now - lastKnobTapTime < 300 && activeKnob === id) {
                    resetKnob(id);
                }
                lastKnobTapTime = now;
                startDrag(y, id);
            };
            knob.addEventListener('mousedown', (e) => { e.preventDefault(); handleKnobStart(e.clientY, knob.id); });
            knob.addEventListener('touchstart', (e) => { e.preventDefault(); handleKnobStart(e.touches[0].clientY, knob.id); }, {passive: false});
        });

        window.addEventListener('mousemove', (e) => moveDrag(e.clientY));
        window.addEventListener('touchmove', (e) => {
            if(isDragging) { e.preventDefault(); moveDrag(e.touches[0].clientY); }
        }, {passive: false});

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        // Graph Interaction (Drag directly on the canvas)
        const eqCanvasNode = document.getElementById('eqGraph');
        let isPointerDown   = false; // true while mouse/finger is held
        let isDraggingGraph = false; // true only after crossing threshold
        let graphHasMoved   = false; // true if actual drag happened
        let startGraphX = 0, startGraphY = 0;
        let initialBandFreq = 0, initialBandGain = 0;
        const DRAG_THRESHOLD = 8;

        // Double-tap tracking
        let lastTapBandIdx = -1;
        let lastTapTime    = 0;

        const getGraphCoords = (e) => {
            const rect = eqCanvasNode.getBoundingClientRect();
            const src  = e.changedTouches ? e.changedTouches[0]
                       : e.touches        ? e.touches[0]
                       : e;
            return {
                x: (src.clientX - rect.left) * (eqCanvasNode.width  / rect.width),
                y: (src.clientY - rect.top)  * (eqCanvasNode.height / rect.height)
            };
        };

        const selectNearestBand = (x) => {
            const w = eqCanvasNode.width;
            const minF = Math.log10(20), maxF = Math.log10(20000);
            const curF = Math.pow(10, minF + (x / w) * (maxF - minF));
            
            const hpf = getActiveHPF();
            let nearestIdx = 0;
            let minDist = Infinity;

            if (hpf) {
                const dHP = Math.abs(Math.log10(hpf.freq) - Math.log10(curF));
                minDist = dHP;
                nearestIdx = -1; // -1 represents HPF node
            }

            currentBands.forEach((b, i) => {
                const d = Math.abs(Math.log10(b.freq) - Math.log10(curF));
                if(d < minDist) { minDist = d; nearestIdx = i; }
            });
            return nearestIdx;
        };

        const resetBandGain = (idx) => {
            if (idx === -1) {
                toggleHPF();
                return;
            }
            currentBands[idx].gain = 0;
            setBoxVal(document.getElementById(`bx-g-${idx}`), '0.0');
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(true);
        };

        // ── POINTER DOWN ──────────────────────────────────────────────
        const onGraphDown = (e) => {
            e.preventDefault();
            isPointerDown   = true;
            isDraggingGraph = false;
            graphHasMoved   = false;

            const {x, y} = getGraphCoords(e);
            startGraphX = x;
            startGraphY = y;

            const idx = selectNearestBand(x);
            selectBand(idx);
            if (idx === -1) {
                const hpf = getActiveHPF();
                initialBandFreq = hpf ? hpf.freq : 80;
                initialBandGain = 0;
            } else {
                initialBandFreq = currentBands[idx].freq;
                initialBandGain = currentBands[idx].gain;
            }
        };

        // ── POINTER MOVE ──────────────────────────────────────────────
        const onGraphMove = (e) => {
            if(!isPointerDown) return;   // ignore move when not pressing
            e.preventDefault();

            const {x, y} = getGraphCoords(e);
            const dx = x - startGraphX;
            const dy = y - startGraphY;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if(!isDraggingGraph) {
                if(dist > DRAG_THRESHOLD) {
                    isDraggingGraph = true;
                    graphHasMoved   = true;
                } else {
                    return; // still within tap zone
                }
            }

            const w = eqCanvasNode.width, h = eqCanvasNode.height;
            const minF = Math.log10(20), maxF = Math.log10(20000);
            const initX = ((Math.log10(initialBandFreq) - minF) / (maxF - minF)) * w;
            const newX  = Math.max(0, Math.min(w, initX + dx));

            if (selectedBandIndex === -1) {
                // Dragging HPF cutoff frequency (20 Hz - 1000 Hz)
                const hpf = getActiveHPF();
                if (hpf) {
                    const newFreq = Math.pow(10, minF + (newX / w) * (maxF - minF));
                    hpf.freq = Math.max(20, Math.min(1000, Math.round(newFreq)));
                    updateHPFUI();
                    updateKnobs();
                    drawEQGraph();
                    drawMiniEQ(activeChannelIdx);
                    if (typeof updateChannelEQFilters === 'function') {
                        updateChannelEQFilters(activeChannelIdx);
                    }
                    notifyEQChanged(false);
                }
                return;
            }

            const b = currentBands[selectedBandIndex];
            b.freq  = Math.max(20,  Math.min(20000, Math.pow(10, minF + (newX / w) * (maxF - minF))));
            b.gain  = Math.max(-15, Math.min(15, initialBandGain - (dy / (h / 2)) * 15));

            const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2)+'k' : Math.round(b.freq)+' Hz';
            setBoxVal(document.getElementById(`bx-f-${selectedBandIndex}`), freqStr);
            setBoxVal(document.getElementById(`bx-g-${selectedBandIndex}`), b.gain.toFixed(1));
            updateKnobs();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(false);
        };

        // ── POINTER UP ────────────────────────────────────────────────
        const onGraphUp = (e) => {
            if(!isPointerDown) return;
            isPointerDown   = false;
            isDraggingGraph = false;

            if(!graphHasMoved) {
                // Clean tap → check for double-tap
                const now        = Date.now();
                const tappedBand = selectedBandIndex;
                if(now - lastTapTime < 400 && lastTapBandIdx === tappedBand) {
                    resetBandGain(tappedBand);
                    lastTapTime    = 0;
                    lastTapBandIdx = -999;
                } else {
                    lastTapTime    = now;
                    lastTapBandIdx = tappedBand;
                }
            }
            graphHasMoved = false;
            notifyEQChanged(true);
        };

        eqCanvasNode.addEventListener('mousedown',  (e) => onGraphDown(e));
        eqCanvasNode.addEventListener('touchstart', (e) => onGraphDown(e), {passive: false});

        window.addEventListener('mousemove',  (e) => onGraphMove(e));
        window.addEventListener('touchmove',  (e) => onGraphMove(e), {passive: false});

        window.addEventListener('mouseup',  (e) => onGraphUp(e));
        window.addEventListener('touchend', (e) => onGraphUp(e));

        // Handle window resize for canvas redraw
        window.addEventListener('resize', () => {
            if(modal.style.display === 'flex') drawEQGraph();
        });

        // --- RTA Animation Loop (Espectro Real do Áudio no Canal) ---
        let rtaPeak = new Array(64).fill(0);
        let rtaSmooth = new Array(64).fill(0);
        let rtaTarget = new Array(64).fill(0);
        const rtaFreqData = new Uint8Array(512);

        
        // ── RTA em Tempo Real para o Equalizador Gráfico de 31 Bandas ─
        const geqRtaSmooth = new Array(NUM_GEQ_BANDS).fill(0);
        const geqRtaPeak   = new Array(NUM_GEQ_BANDS).fill(0);
        const geqRtaTarget = new Array(NUM_GEQ_BANDS).fill(0);

        function clearGEQRTABars() {
            for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                geqRtaSmooth[k] = 0;
                geqRtaPeak[k] = 0;
                geqRtaTarget[k] = 0;
                const bar = document.getElementById(`geq-rta-bar-${k}`);
                const peak = document.getElementById(`geq-rta-peak-${k}`);
                if (bar) {
                    bar.style.height = '0%';
                    bar.style.opacity = '0';
                }
                if (peak) {
                    peak.style.bottom = '0%';
                    peak.style.opacity = '0';
                }
            }
        }

        function updateGEQRTA(hasAudioSignal, isPinkNoise, isMuted, faderPct, potDb, activeAnalyser, sampleRate, nyquist, binCount) {
            const isEqOn = (channelEQEnabled[activeChannelIdx] !== false);
            const geqBands = (typeof channelGEQState !== 'undefined' && channelGEQState[activeChannelIdx])
                ? channelGEQState[activeChannelIdx] : null;
            const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[activeChannelIdx])
                ? channelHPFState[activeChannelIdx] : null;

            for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                if (hasAudioSignal && activeAnalyser && !isMuted && faderPct > 1.0) {
                    const f0 = ISO_GEQ_FREQS[k];
                    const fStart = f0 * 0.8909;
                    const fEnd   = f0 * 1.1225;

                    let eqDb = 0;
                    if (isEqOn) {
                        if (hpf && hpf.enabled) {
                            eqDb += getHPFResponseDb(f0, hpf);
                        }
                        // Inclui resposta do PEQ na frequência f0
                        const peqBands = (typeof channelEQState !== 'undefined' && channelEQState[activeChannelIdx])
                            ? channelEQState[activeChannelIdx] : currentBands;
                        if (peqBands) {
                            peqBands.forEach(band => {
                                if (band.gain === 0) return;
                                if (band.mode === 'HShv') {
                                    const oct = Math.log2(f0 / band.freq);
                                    eqDb += band.gain / (1 + Math.exp(-oct * 2.2));
                                } else if (band.mode === 'LShv') {
                                    const oct = Math.log2(f0 / band.freq);
                                    eqDb += band.gain / (1 + Math.exp(oct * 2.2));
                                } else {
                                    const octDiff = Math.log2(f0 / band.freq);
                                    const bw = 1 / Math.max(0.1, band.q);
                                    eqDb += band.gain * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                                }
                            });
                        }
                        if (geqBands) {
                            eqDb += (geqBands[k] || 0);
                        }
                    }

                    let normLevel = 0;

                    if (isPinkNoise) {
                        const jitterDb = Math.sin(k * 11.3 + Date.now() * 0.005) * 0.25 + (Math.random() - 0.5) * 0.3;
                        const totalDb = eqDb + potDb + jitterDb;
                        normLevel = Math.max(0, Math.min(1, 0.50 + (totalDb / 30)));
                    } else {
                        if (fStart >= nyquist) {
                            normLevel = 0;
                        } else {
                            const binStart = Math.max(0, Math.min(binCount - 1, Math.floor((fStart / nyquist) * binCount)));
                            const binEnd   = Math.max(binStart, Math.min(binCount - 1, Math.ceil((fEnd / nyquist) * binCount)));

                            let maxBinVal = 0;
                            let sumBinVal = 0;
                            let count = 0;
                            for (let b = binStart; b <= binEnd; b++) {
                                const v = rtaFreqData[b];
                                if (v > maxBinVal) maxBinVal = v;
                                sumBinVal += v;
                                count++;
                            }
                            const avgBinVal = count > 0 ? (sumBinVal / count) : 0;
                            let bandVal = (maxBinVal * 0.70 + avgBinVal * 0.30) / 255.0;

                            // Compensação de inclinação espectral (+3.2 dB/oitava acima de 1 kHz)
                            if (f0 > 1000 && bandVal > 0.002) {
                                const tilt = Math.pow(f0 / 1000, 0.25);
                                bandVal = Math.min(1.0, bandVal * tilt);
                            }

                            // Atua estritamente nas frequências existentes no áudio
                            if (bandVal < 0.005) {
                                normLevel = 0;
                            } else {
                                const scaledSignal = bandVal * 0.70;
                                const potOffset = (potDb / 30);
                                const eqOffset = (eqDb / 30);
                                const presence = Math.min(1.0, scaledSignal * 2.2);
                                normLevel = Math.max(0, Math.min(1, scaledSignal + (potOffset * 0.30) + (eqOffset * presence)));
                            }
                        }
                    }

                    geqRtaTarget[k] = Math.max(0, Math.min(1, normLevel));
                } else {
                    geqRtaTarget[k] = 0;
                }

                // Attack rápido e Decay suave
                const attack = 0.75;
                const decay  = 0.20;
                const speed  = geqRtaSmooth[k] < geqRtaTarget[k] ? attack : decay;
                geqRtaSmooth[k] += (geqRtaTarget[k] - geqRtaSmooth[k]) * speed;

                if (geqRtaSmooth[k] < 0.005) geqRtaSmooth[k] = 0;

                // Peak hold com decaimento suave
                if (geqRtaSmooth[k] > geqRtaPeak[k]) {
                    geqRtaPeak[k] = geqRtaSmooth[k];
                } else {
                    geqRtaPeak[k] = Math.max(0, Math.min(geqRtaPeak[k] - 0.006, geqRtaSmooth[k] + 0.12));
                }

                // Atualiza visualmente a barra e o marcador de pico no DOM
                const bar = document.getElementById(`geq-rta-bar-${k}`);
                const peak = document.getElementById(`geq-rta-peak-${k}`);
                const lvl = geqRtaSmooth[k];
                const pk  = geqRtaPeak[k];

                if (bar) {
                    bar.style.height = (lvl * 100).toFixed(1) + '%';
                    bar.style.opacity = lvl > 0.01 ? '0.85' : '0';
                }
                if (peak) {
                    peak.style.bottom = (pk * 100).toFixed(1) + '%';
                    peak.style.opacity = pk > 0.02 ? '0.9' : '0';
                }
            }
        }

        function updateRTA() {
            const numBars = 64;
            const minF = Math.log10(20);
            const maxF = Math.log10(20000);

            const activeData = channelStripsData[activeChannelIdx];
            const isMuted = activeData && activeData.muteBtn.classList.contains('muted');
            const faderPct = activeData ? (parseFloat(activeData.faderCap.style.bottom) || 0) : 0;

            // Ganho do potenciômetro do canal ativo (70% = 0.0 dB / ganho 1.0)
            let potGain = 0;
            let potDb = -60;
            if (!isMuted && faderPct > 1.0) {
                if (faderPct >= 70) {
                    potGain = 1.0 + ((faderPct - 70) / 30) * 1.0;
                } else {
                    potGain = Math.pow(faderPct / 70, 2);
                }
                potDb = 20 * Math.log10(Math.max(0.0001, potGain));
            }

            // Flag explícita: true quando a fonte de áudio do canal é o gerador de ruído rosa
            let isPinkNoise = false;
            let activeAnalyser = null;

            // Identifica analisador de entrada de áudio real (player ou mic)
            const realInputAnalyser = (playerAnalyser && playerElement && !playerElement.paused)
                ? playerAnalyser
                : micAnalyser;

            const inputData = channelStripsData[0];
            const isInputMuted = inputData && inputData.muteBtn.classList.contains('muted');
            const inputFaderPct = (inputData && !isInputMuted) ? (parseFloat(inputData.faderCap.style.bottom) || 0) : 0;

            if (!isMuted && faderPct > 1.0) {
                // 1. Ruído Rosa ativo no canal atual (saídas 1 a 10)
                if (activeChannelIdx > 0 && activeData && activeData.noiseEnabled && activeData.rtaAnalyser) {
                    activeAnalyser = activeData.rtaAnalyser;
                    isPinkNoise = true;
                }
                // 2. Ou áudio real (player / mic / entrada externa) lido do Analyser pós-fader do canal
                else if (activeData && activeData.rtaAnalyser) {
                    // Se for canal de saída (1 a 10), só recebe áudio se a Entrada LR estiver aberta
                    if (activeChannelIdx === 0 || inputFaderPct > 1.0) {
                        activeAnalyser = activeData.rtaAnalyser;
                    }
                }
                else if (realInputAnalyser) {
                    if (activeChannelIdx === 0 || inputFaderPct > 1.0) {
                        activeAnalyser = realInputAnalyser;
                    }
                }
            }

            // Para ruído rosa: sinal ativo se o fader do canal estiver aberto
            // Para player/microfone: detecta via energia dos bins FFT pós-fader
            let hasAudioSignal = isPinkNoise && !isMuted && faderPct > 1.0;

            if (!isPinkNoise && activeAnalyser && audioCtx && audioCtx.state === 'running' && !isMuted && faderPct > 1.0) {
                activeAnalyser.getByteFrequencyData(rtaFreqData);
                let energySum = 0;
                for (let k = 0; k < rtaFreqData.length; k++) energySum += rtaFreqData[k];
                if (energySum > 100) {
                    hasAudioSignal = true;
                }
            } else if (isPinkNoise && activeAnalyser && audioCtx && audioCtx.state === 'running') {
                activeAnalyser.getByteFrequencyData(rtaFreqData);
            }

            const sampleRate = audioCtx ? audioCtx.sampleRate : 48000;
            const nyquist = sampleRate / 2;
            const binCount = rtaFreqData.length;

            for (let b = 0; b < numBars; b++) {
                if (hasAudioSignal && activeAnalyser && !isMuted && faderPct > 1.0) {
                    // Intervalo de frequência correspondente à largura exata desta barra
                    const logF_start = minF + (b / numBars) * (maxF - minF);
                    const logF_end   = minF + ((b + 1) / numBars) * (maxF - minF);
                    const logF_mid   = (logF_start + logF_end) * 0.5;
                    const curF       = Math.pow(10, logF_mid);
                    const fStart     = Math.pow(10, logF_start);
                    const fEnd       = Math.pow(10, logF_end);

                    let normLevel = 0;

                    // Resposta cumulativa total (PEQ + GEQ + HPF) em dB na frequência exata desta barra
                    let eqDb = 0;
                    if (eqEnabled) {
                        const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[activeChannelIdx])
                            ? channelHPFState[activeChannelIdx] : null;
                        if (hpf && hpf.enabled) {
                            eqDb += getHPFResponseDb(curF, hpf);
                        }
                        // Contribuição do PEQ
                        const peqBands = (typeof channelEQState !== 'undefined' && channelEQState[activeChannelIdx])
                            ? channelEQState[activeChannelIdx] : currentBands;
                        if (peqBands) {
                            peqBands.forEach(band => {
                                if (band.gain === 0) return;
                                if (band.mode === 'HShv') {
                                    const oct = Math.log2(curF / band.freq);
                                    eqDb += band.gain / (1 + Math.exp(-oct * 2.2));
                                } else if (band.mode === 'LShv') {
                                    const oct = Math.log2(curF / band.freq);
                                    eqDb += band.gain / (1 + Math.exp(oct * 2.2));
                                } else {
                                    const octDiff = Math.log2(curF / band.freq);
                                    const bw = 1 / Math.max(0.1, band.q);
                                    eqDb += band.gain * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                                }
                            });
                        }
                        // Contribuição do GEQ
                        const geqBands = (typeof channelGEQState !== 'undefined' && channelGEQState[activeChannelIdx])
                            ? channelGEQState[activeChannelIdx] : null;
                        if (geqBands) {
                            const bw = 1 / 4.31;
                            for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                                const g = geqBands[k];
                                if (!g) continue;
                                const f0 = ISO_GEQ_FREQS[k];
                                const octDiff = Math.log2(curF / f0);
                                eqDb += g * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                            }
                        }
                    }

                    // === 1. RUÍDO ROSA: espectro sintetizado calibrado para RTA ===
                    if (isPinkNoise) {
                        const jitterDb = Math.sin(b * 13.7 + Date.now() * 0.005) * 0.25 + (Math.random() - 0.5) * 0.3;
                        const totalDb = eqDb + potDb + jitterDb;
                        normLevel = Math.max(0, Math.min(1, 0.50 + (totalDb / 30)));
                    }
                    // === 2. ÁUDIO REAL (PLAYER OU MICROFONE): atua exclusivamente nas frequências existentes no áudio ===
                    else {
                        // Se a frequência da barra ultrapassa a frequência de Nyquist do dispositivo de áudio, não há dados reais
                        if (fStart >= nyquist) {
                            normLevel = 0;
                        } else {
                            const binStart = Math.max(0, Math.min(binCount - 1, Math.floor((fStart / nyquist) * binCount)));
                            const binEnd   = Math.max(binStart, Math.min(binCount - 1, Math.ceil((fEnd / nyquist) * binCount)));

                            let maxBinVal = 0;
                            let sumBinVal = 0;
                            let count = 0;
                            for (let k = binStart; k <= binEnd; k++) {
                                const v = rtaFreqData[k];
                                if (v > maxBinVal) maxBinVal = v;
                                sumBinVal += v;
                                count++;
                            }
                            const avgBinVal = count > 0 ? (sumBinVal / count) : 0;
                            let bandVal = (maxBinVal * 0.70 + avgBinVal * 0.30) / 255.0;

                            // Compensação de inclinação espectral (+3.2 dB/oitava acima de 1 kHz para resposta sonora natural)
                            if (curF > 1000 && bandVal > 0.002) {
                                const tilt = Math.pow(curF / 1000, 0.25);
                                bandVal = Math.min(1.0, bandVal * tilt);
                            }

                            // Atua estritamente nas frequências presentes no áudio:
                            // Se a banda não tiver energia mensurável no sinal, a barra zera completamente
                            if (bandVal < 0.005) {
                                normLevel = 0;
                            } else {
                                const scaledSignal = bandVal * 0.70;
                                const potOffset = (potDb / 30);
                                const eqOffset = (eqDb / 30);
                                const presence = Math.min(1.0, scaledSignal * 2.2);

                                normLevel = Math.max(0, Math.min(1, scaledSignal + (potOffset * 0.30) + (eqOffset * presence)));
                            }
                        }
                    }

                    rtaTarget[b] = Math.max(0, Math.min(1, normLevel));
                } else {
                    // Sem áudio no canal ou potenciômetro fechado/mutado -> barras zeram completamente
                    rtaTarget[b] = 0;
                }

                // Attack rápido, Decay suave (mais ágil durante ajustes manuais do EQ)
                const isActivelyAdjusting = (typeof isPointerDown !== 'undefined' && isPointerDown) || 
                                           (typeof isDragging !== 'undefined' && isDragging);
                const attack = isActivelyAdjusting ? 0.85 : 0.65;
                const decay  = isActivelyAdjusting ? 0.40 : 0.15;
                const speed  = rtaSmooth[b] < rtaTarget[b] ? attack : decay;
                rtaSmooth[b] += (rtaTarget[b] - rtaSmooth[b]) * speed;

                if (rtaSmooth[b] < 0.005) rtaSmooth[b] = 0;

                // Peak hold com decaimento que acompanha cortes do EQ
                if (rtaSmooth[b] > rtaPeak[b]) {
                    rtaPeak[b] = rtaSmooth[b];
                } else {
                    rtaPeak[b] = Math.max(0, Math.min(rtaPeak[b] - 0.005, rtaSmooth[b] + 0.12));
                }

                rtaBands[b] = rtaSmooth[b];
            }

            if (rtaEnabled && modal.style.display === 'flex') {
                const curMode = (typeof channelEQMode !== 'undefined' && channelEQMode[activeChannelIdx]) ? channelEQMode[activeChannelIdx] : 'peq';
                if (curMode === 'peq') {
                    drawEQGraph();
                } else if (curMode === 'geq') {
                    updateGEQRTA(hasAudioSignal, isPinkNoise, isMuted, faderPct, potDb, activeAnalyser, sampleRate, nyquist, binCount);
                }
            } else if (!rtaEnabled && modal.style.display === 'flex') {
                if (typeof clearGEQRTABars === 'function') clearGEQRTABars();
            }
            requestAnimationFrame(updateRTA);
        }
        updateRTA(); // Start loop always, drawing only when enabled

        closeModal.onclick = () => { modal.style.display = 'none'; };

        // ── Fader Vertical do Modal ─────────────────────────────────────
        // Converte pct (0-100) para dB display (70% = 0.0 dB exato)
        function pctToDbStr(pct) {
            if (pct <= 1) return '-∞ dB';
            let db = 0;
            if (pct >= 70) {
                const gain = 1.0 + ((pct - 70) / 30) * 1.0;
                db = 20 * Math.log10(gain);
            } else {
                const gain = Math.pow(pct / 70, 2);
                db = 20 * Math.log10(gain);
                if (db < -60) return '-∞ dB';
            }
            return (db >= 0 ? '+' : '') + db.toFixed(1) + ' dB';
        }


        // ── Sincronização e Eventos do Botão de Ganho no Modal de EQ ────
        function syncModalGain(channelIdx) {
            const idx = (channelIdx !== undefined) ? channelIdx : activeChannelIdx;
            const gainDb = (channelGainState && channelGainState[idx] !== undefined) ? channelGainState[idx] : 0.0;
            const textStr = (gainDb >= 0 ? '+' : '') + gainDb.toFixed(1) + ' dB';
            const deg = (gainDb / 18.0) * 135.0;

            ['', '-geq'].forEach(suf => {
                const ind = document.getElementById('modal-gain-indicator' + suf);
                const val = document.getElementById('modal-gain-val' + suf);
                if (val) {
                    val.textContent = textStr;
                    if (Math.abs(gainDb) > 0.01) {
                        val.classList.add('active-gain');
                    } else {
                        val.classList.remove('active-gain');
                    }
                }
                if (ind) {
                    ind.style.transform = `rotate(${deg}deg)`;
                }
            });
        }

        function setupModalGainKnobEvents() {
            const gainKnob = document.getElementById('modal-gain-knob');
            const gainVal  = document.getElementById('modal-gain-val');
            if (!gainKnob) return;

            let isDragging = false;
            let startY = 0;
            let initialVal = 0;

            function startDrag(clientY) {
                isDragging = true;
                startY = clientY;
                initialVal = channelGainState[activeChannelIdx] || 0.0;
                gainKnob.classList.add('dragging');
            }

            function moveDrag(clientY) {
                if (!isDragging) return;
                const dy = startY - clientY;
                const deltaDb = (dy / 3.0) * 0.5; // sensibilidade suave
                const newDb = Math.max(-18.0, Math.min(18.0, initialVal + deltaDb));
                applyGain(activeChannelIdx, newDb);
                sendGainSync(activeChannelIdx, newDb, false);
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                gainKnob.classList.remove('dragging');
                sendGainSync(activeChannelIdx, channelGainState[activeChannelIdx], true);
            }

            // Touch events
            gainKnob.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                startDrag(e.touches[0].clientY);
            }, { passive: false });

            gainKnob.addEventListener('touchmove', (e) => {
                if (isDragging) {
                    e.preventDefault();
                    e.stopPropagation();
                    moveDrag(e.touches[0].clientY);
                }
            }, { passive: false });

            gainKnob.addEventListener('touchend', (e) => {
                if (isDragging) {
                    e.preventDefault();
                    e.stopPropagation();
                    endDrag();
                }
            }, { passive: false });

            gainKnob.addEventListener('touchcancel', () => {
                isDragging = false;
                gainKnob.classList.remove('dragging');
            });

            // Pointer / Mouse events
            gainKnob.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                e.stopPropagation();
                gainKnob.setPointerCapture(e.pointerId);
                startDrag(e.clientY);
            });

            gainKnob.addEventListener('pointermove', (e) => {
                if (isDragging && e.pointerType !== 'touch') {
                    moveDrag(e.clientY);
                }
            });

            gainKnob.addEventListener('pointerup', (e) => {
                if (isDragging && e.pointerType !== 'touch') {
                    endDrag();
                }
            });

            // Mouse wheel para ajuste fino
            gainKnob.addEventListener('wheel', (e) => {
                e.preventDefault();
                const step = (e.deltaY < 0 ? 0.5 : -0.5);
                const cur = channelGainState[activeChannelIdx] || 0.0;
                const newDb = Math.max(-18.0, Math.min(18.0, cur + step));
                applyGain(activeChannelIdx, newDb);
                sendGainSync(activeChannelIdx, newDb, true);
            }, { passive: false });

            // Duplo clique reseta para 0.0 dB
            gainKnob.addEventListener('dblclick', () => {
                applyGain(activeChannelIdx, 0.0);
                sendGainSync(activeChannelIdx, 0.0, true);
            });

            // Toque no display de valor reseta para 0.0 dB
            if (gainVal) {
                gainVal.addEventListener('click', () => {
                    applyGain(activeChannelIdx, 0.0);
                    sendGainSync(activeChannelIdx, 0.0, true);
                });
            }
        }
        setupModalGainKnobEvents();

        // Configura também o knob de ganho dentro do GEQ
        function setupModalGainKnobEventsGEQ() {
            const gainKnob = document.getElementById('modal-gain-knob-geq');
            const gainVal  = document.getElementById('modal-gain-val-geq');
            if (!gainKnob) return;

            let isDragging = false;

            function startDrag(clientY) {

            function moveDrag(clientY) {
