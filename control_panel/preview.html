<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Audio Mixer 1/10</title>
        <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background-color: #121316;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Top Navigation App Bar */
        .app-header {
            height: 48px;
            background: #191a1f;
            border-bottom: 1px solid #2a2c34;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            flex-shrink: 0;
            z-index: 100;
            gap: 8px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .mixer-logo {
            font-size: 18px;
            filter: drop-shadow(0 0 4px rgba(255, 153, 0, 0.4));
        }
        .mixer-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #eeeeee;
            white-space: nowrap;
        }

        /* Sync Status Badge */
        .sync-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(26, 28, 34, 0.95);
            border: 1px solid #3d414d;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: #00ff66;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #00ff66;
            box-shadow: 0 0 6px #00ff66;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .sync-badge.disconnected {
            color: #ff4444;
            border-color: #772222;
        }
        .sync-badge.disconnected .status-dot {
            background-color: #ff4444;
            box-shadow: 0 0 6px #ff4444;
        }

        /* Player de Áudio */
        .audio-player-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #23252d;
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid #383b45;
            max-width: 480px;
            overflow: hidden;
        }
        .player-load-btn {
            background: #ff9900;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .player-load-btn:hover { background: #ffaa22; }
        .player-load-btn:active { transform: scale(0.96); }

        .player-demo-btn {
            background: #333640;
            color: #ffaa33;
            border: 1px solid #484d5c;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .player-demo-btn:hover { background: #3f4350; }
        .player-demo-btn:active { transform: scale(0.96); }

        .player-play-btn {
            background: #2b2e38;
            color: #00ff88;
            border: 1px solid #484d5c;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            width: 28px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .player-play-btn:hover:not(:disabled) { background: #3c404e; }
        .player-play-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .player-info-container {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 80px;
            overflow: hidden;
        }
        .player-track-name {
            font-size: 10px;
            font-weight: bold;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-time {
            font-size: 9px;
            color: #888;
            font-family: monospace;
        }
        .player-progress-bar {
            width: 60px;
            height: 5px;
            background: #17181c;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        .player-progress-fill {
            height: 100%;
            width: 0%;
            background: #00ff88;
            transition: width 0.1s linear;
        }

        /* Barra de Navegação Rápida entre Canais */
        .channel-nav-ribbon {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 6px;
            padding: 6px 10px;
            background: #16171b;
            border-bottom: 1px solid #23252d;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-shrink: 0;
            z-index: 50;
        }
        .channel-nav-ribbon::-webkit-scrollbar {
            display: none;
        }
        .ribbon-pill {
            flex: 0 0 auto;
            min-width: 44px;
            height: 36px;
            padding: 0 10px;
            background: #25272e;
            border: 1px solid #3c3f4a;
            border-radius: 18px;
            color: #cfd3dc;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.12s ease;
            outline: none;
            font-family: inherit;
        }
        .ribbon-pill:hover {
            background: #31343e;
            border-color: #555a68;
            color: #fff;
        }
        .ribbon-pill:active {
            transform: scale(0.95);
        }
        .ribbon-pill.active {
            background: #ff9900;
            color: #000;
            border-color: #ffaa22;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.55);
            font-weight: 800;
        }
        .ribbon-pill[data-ch="0"] {
            border-color: #ff7700;
            color: #ffaa44;
        }
        .ribbon-pill[data-ch="0"].active {
            background: #ff7700;
            color: #000;
            border-color: #ff9900;
        }
        .ribbon-pill.is-muted {
            border-color: #ff3344 !important;
            color: #ff4455 !important;
        }
        .ribbon-pill.is-muted::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff2233;
            box-shadow: 0 0 5px #ff2233;
        }
        .ribbon-pill .ribbon-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: transparent;
            display: none;
        }
        .ribbon-pill.pink-noise-active {
            border-color: #ff0055 !important;
            color: #ff0055 !important;
        }
        .ribbon-pill.pink-noise-active .ribbon-dot {
            display: inline-block;
            background-color: #ff0055 !important;
            box-shadow: 0 0 6px #ff0055;
        }

        /* Mixer horizontal container & channels */
        .mixer-wrapper {
            flex: 1;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 8px 10px;
            box-sizing: border-box;
            display: flex;
            align-items: stretch;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
            scrollbar-color: #383b46 transparent;
        }
        .mixer-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .mixer-wrapper::-webkit-scrollbar-thumb {
            background: #383b46;
            border-radius: 3px;
        }
        .mixer-container {
            display: inline-flex;
            background-color: #17181c;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #23252d;
            gap: 6px;
            height: 100%;
            min-height: 420px;
            box-sizing: border-box;
        }
        .channel-strip {
            width: 86px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #24262d 0%, #191b20 100%);
            border: 1px solid #343742;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .channel-strip.active-focused {
            border-color: #ff9900 !important;
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.4);
        }
        .main-strip {
            background: linear-gradient(180deg, #322216 0%, #1c140e 100%);
            border: 1.5px solid #ff7700;
            box-shadow: 0 4px 12px rgba(255, 119, 0, 0.2);
        }

        /* Container e Botão de Ganho (Preamp Trim) */
        .channel-gain-container {
            height: 46px;
            margin: 3px 4px 2px 4px;
            padding: 2px 3px;
            background: #111216;
            border: 1px solid #252830;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
            transition: border-color 0.15s ease;
        }
        .main-strip .channel-gain-container {
            border-color: #ff7700;
            background: #1c130c;
        }
        .gain-title {
            font-size: 8px;
            font-weight: 800;
            color: #8c909d;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 2px;
        }
        .main-strip .gain-title {
            color: #ffaa33;
        }
        .gain-knob-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }
        .gain-knob {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #3c3f4a 0%, #17181c 100%);
            border: 1.5px solid #0d0e11;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 2px 5px rgba(0,0,0,0.7);
            position: relative;
            cursor: pointer;
            touch-action: none;
            flex-shrink: 0;
            transition: box-shadow 0.1s ease;
        }
        .gain-knob:hover, .gain-knob.dragging {
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 0 8px rgba(0, 229, 255, 0.6);
        }
        .main-strip .gain-knob:hover, .main-strip .gain-knob.dragging {
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.3), 0 0 8px rgba(255, 153, 0, 0.7);
        }
        .gain-indicator {
            position: absolute;
            top: 2px;
            left: 50%;
            width: 2px;
            height: 8px;
            margin-left: -1px;
            background: #00e5ff;
            box-shadow: 0 0 4px #00e5ff;
            border-radius: 1px;
            transform-origin: center 9px;
            pointer-events: none;
            transition: transform 0.05s linear;
        }
        .main-strip .gain-indicator {
            background: #ff9900;
            box-shadow: 0 0 4px #ff9900;
        }
        .gain-val {
            font-size: 9px;
            font-weight: 800;
            color: #ffffff;
            font-family: monospace, sans-serif;
            min-width: 38px;
            text-align: right;
            cursor: pointer;
            letter-spacing: -0.2px;
        }
        .gain-val:hover {
            color: #00e5ff;
        }
        .main-strip .gain-val:hover {
            color: #ffaa33;
        }

        .eq-display {
            background-color: #0c0d11;
            border: 1px solid #262933;
            border-radius: 4px;
            margin: 4px 4px 0 4px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        .eq-display:hover { border-color: #ff9900; }
        .eq-canvas { width: 100%; height: 100%; pointer-events: none; }

        .mute-btn {
            background: linear-gradient(180deg, #32353d 0%, #202227 100%);
            border: 1px solid #141518;
            border-radius: 4px;
            color: #a0a6b2;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.8px;
            height: 30px;
            margin: 4px 4px 2px 4px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .mute-btn:hover {
            background: linear-gradient(180deg, #3a3e47 0%, #292c33 100%);
            color: #c8ceda;
        }
        .mute-btn:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }
        .mute-btn.muted {
            background: linear-gradient(180deg, #e6202f 0%, #9e101c 100%);
            color: #ffffff;
            border-color: #610910;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 12px rgba(230, 32, 47, 0.75);
            text-shadow: 0 0 4px rgba(255,255,255,0.7);
        }

        /* Real-Time Volume Readout Badge */
        .fader-vol-readout {
            font-size: 10px;
            font-weight: 800;
            color: #ff9900;
            font-family: monospace, sans-serif;
            text-align: center;
            background: #0d0f13;
            border: 1px solid #282a33;
            border-radius: 4px;
            margin: 2px 4px;
            padding: 2px 0;
            cursor: pointer;
            touch-action: manipulation;
            letter-spacing: 0.5px;
            transition: all 0.1s ease;
        }
        .fader-vol-readout:hover {
            border-color: #ff9900;
            background: #14171d;
        }
        .fader-vol-readout:active {
            transform: scale(0.95);
            background: #222630;
        }
        .fader-vol-readout.muted {
            color: #ff4444;
            opacity: 0.6;
            text-decoration: line-through;
        }

        /* Fader & Meter Column */
        .fader-area {
            background-color: #0a0b0e;
            border: 1px solid #202229;
            border-radius: 6px;
            margin: 2px 4px;
            flex: 1;
            position: relative;
            min-height: 220px;
            display: flex;
            overflow: hidden;
            touch-action: pan-x pan-y;
            cursor: default;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        .main-strip .fader-area {
            border: 1.5px solid #ff7700;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 8px rgba(255,119,0,0.25);
        }

        .meter-bg {
            position: absolute;
            left: 6px;
            top: 10px;
            bottom: 10px;
            width: 10px;
            background: linear-gradient(to top, 
                #00b020 0%, #00d028 55%, 
                #ffb800 68%, #ff9900 80%, 
                #ff2a1a 92%, #ff0000 100%);
            border-radius: 2px;
            border: 1px solid #111215;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.9);
            overflow: hidden;
            pointer-events: none;
        }
        .meter-fill {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 100%;
            background: #0a0b0e;
            transition: height 0.04s linear;
        }
        .meter-fill.muted {
            height: 100% !important;
        }
        .meter-clip.line1 {
            position: absolute;
            left: 0;
            right: 0;
            top: 3px;
            height: 1px;
            background: rgba(0,0,0,0.6);
            z-index: 2;
        }
        .meter-clip.line2 {
            position: absolute;
            left: 0;
            right: 0;
            top: 7px;
            height: 1px;
            background: rgba(0,0,0,0.6);
            z-index: 2;
        }

        .scale-marks {
            position: absolute;
            right: 4px;
            top: 10px;
            bottom: 10px;
            width: 22px;
            pointer-events: none;
            font-size: 8px;
            font-weight: bold;
            color: #ffffff;
            font-family: monospace, sans-serif;
            opacity: 0.8;
        }
        .scale-marks span {
            position: absolute;
            right: 0;
            transform: translateY(-50%);
            line-height: 1;
            white-space: nowrap;
        }
        .scale-mark-0u {
            color: #ff9900 !important;
            font-weight: 800 !important;
            text-shadow: 0 0 6px rgba(255, 153, 0, 0.7);
        }

        .fader-track {
            display: none;
        }

        .fader-track-touch {
            position: absolute;
            left: 18px;
            right: 2px;
            top: 10px;
            bottom: 10px;
            cursor: default;
            touch-action: pan-x pan-y;
            user-select: none;
            pointer-events: none;
            z-index: 5;
        }

        .fader-track-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #050608;
            border: 1px solid #1a1b20;
            border-radius: 2px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        .fader-track-mark-0db {
            position: absolute;
            left: 6px;
            right: 22px;
            height: 2px;
            background: #ff9900;
            box-shadow: 0 0 6px rgba(255, 153, 0, 0.8);
            border-radius: 1px;
            bottom: 70%;
            pointer-events: none;
            z-index: 2;
        }

        .fader-cap {
            position: absolute;
            left: 22px;
            transform: translate(-50%, 50%);
            width: 30px;
            height: 56px;
            background-image: url('fader_knob.svg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85)) drop-shadow(0 1px 3px rgba(0,0,0,0.6));
            cursor: grab;
            z-index: 10;
            pointer-events: auto;
            touch-action: none;
            transition: filter 0.1s ease;
        }
        .fader-cap::before {
            content: '';
            position: absolute;
            top: -8px;
            bottom: -8px;
            left: -12px;
            right: -12px;
            pointer-events: auto;
        }
        .fader-cap:active, .fader-cap.dragging {
            cursor: grabbing;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95)) drop-shadow(0 0 8px rgba(255, 153, 0, 0.7));
        }

        .channel-label-container {
            height: 50px;
            background-color: #17181c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3px;
            border-top: 1px solid #282a32;
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }
        .main-strip .channel-label-container {
            background-color: #26170d;
            border-top: 1px solid #ff7700;
        }
        .channel-number {
            font-size: 10px;
            font-weight: 800;
            color: #a0a6b2;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .main-strip .channel-number {
            color: #ff9900;
        }
        .channel-input {
            width: 92%;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            background-color: #23252d;
            border: 1px solid #3a3d48;
            border-radius: 4px;
            padding: 3px 2px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: inherit;
        }
        .channel-input:focus {
            outline: none;
            border-color: #ff9900;
            background-color: #2b2e38;
        }
        .main-strip .channel-input {
            background-color: transparent;
            border: none;
            color: #ffaa33;
            pointer-events: none;
            font-weight: 800;
        }

        .channel-strip.pink-noise-active {
            border-color: #ff0055 !important;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.45);
        }

        
        
        .schematic-link-btn {
            background: #161922;
            border: 1px solid #2b3140;
            color: #ffd600;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            white-space: nowrap;
            user-select: none;
        }
        .schematic-link-btn:hover {
            background: #222736;
            border-color: #ffd600;
            color: #fff;
            box-shadow: 0 0 8px rgba(255, 214, 0, 0.35);
        }

        /* ── Seletor de Modo no EQ (Paramétrico vs Gráfico) ──────────── */
        .modal-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .eq-mode-switch {
            display: flex;
            background: #0f1014;
            border: 1px solid #2d303a;
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
        }
        .eq-mode-btn {
            background: transparent;
            border: none;
            color: #8e929f;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            white-space: nowrap;
        }
        .eq-mode-btn:hover {
            color: #fff;
        }
        .eq-mode-btn.active {
            background: #ff9900;
            color: #000;
            font-weight: 800;
            box-shadow: 0 1px 6px rgba(255, 153, 0, 0.4);
        }

        /* ── Container do Equalizador Gráfico (GEQ 31-Band) ──────────── */
        .geq-view-container {
            display: none;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-bottom: 10px;
        }

            border: 1px solid #1a1b20;
        }
        .modal-fader-mark-0db {
            position: absolute;
            left: 4px;
            right: 4px;
            height: 2px;
            background: #ff9900;
            box-shadow: 0 0 6px rgba(255,153,0,0.8);
            border-radius: 1px;
            bottom: 70%;
            pointer-events: none;
            z-index: 2;
        }
        .modal-fader-scale {
            position: absolute;
            right: 2px;
            top: 0;
            bottom: 0;
            width: 18px;
            pointer-events: none;
            font-size: 8px;
            font-weight: bold;
            font-family: monospace, sans-serif;
            color: #666;
            user-select: none;
        }
        .modal-fader-scale span {
            position: absolute;
            right: 0;
            transform: translateY(-50%);
            line-height: 1;
            white-space: nowrap;
        }
        .modal-fader-scale .mark-0u {
            color: #ff9900;
            font-weight: 800;
            text-shadow: 0 0 6px rgba(255, 153, 0, 0.7);
        }
        .modal-fader-cap {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 30px;
            height: 54px;
            background-image: url('fader_knob.svg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85));
            cursor: grab;
            z-index: 10;
        }
        .modal-fader-cap:active, .modal-fader-cap.dragging {
            cursor: grabbing;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95)) drop-shadow(0 0 8px rgba(255,153,0,0.7));
        }

        /* Toolbar de Ações do EQ */
        .eq-actions-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .eq-on-btn {
            height: 36px;

            border-radius: 6px;
            border: 1px solid #383b46;
            background: #ff9900;
            color: #000;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .eq-on-btn:active { transform: scale(0.95); }

        /* Band Boxes Row */
        .eq-bands-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 10px;
        }
        .band-box {
            background: #2a2c33;
            border: 1.5px solid #1c1d22;
            border-radius: 6px;
            flex: 1 1 30%;
            min-width: 90px;

            padding: 6px;
            cursor: pointer;
            position: relative;
            touch-action: manipulation;
            user-select: none;
            transition: all 0.1s ease;
        }
        .band-box:active { transform: scale(0.97); }
        .band-box.selected {
            background: #393c45;
            border: 2px solid #ff9900;
            box-shadow: 0 0 8px rgba(255,153,0,0.4);
        }
        .band-header {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            border-bottom: 2px solid;
            padding-bottom: 3px;
        }
        .band-num {
            background: #111;
            color: white;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            margin-right: 5px;
            border-radius: 3px;
            font-weight: 800;
        }
        .band-name { font-size: 11px; font-weight: 800; color: #ffffff; }

        .band-param { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; }
        .param-lbl { font-size: 11px; color: #8a8e98; }
        .param-val-box {
            background: #d8dbe2;
            color: #000;
            border: 1px solid #111;
            border-radius: 3px;
            font-size: 11px;
            padding: 2px 4px;
            width: 50px;
            text-align: right;
            font-weight: 800;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }
        .param-val-box:focus {
            background: #fff;
            border-color: #ff9900;
            box-shadow: 0 0 4px #ff9900;
        }

        /* Bottom Controls Row */
        .eq-bottom-row {
            display: flex;
            flex-wrap: wrap;
            background: #262830;
            border: 1px solid #1c1d22;
            border-radius: 8px;
            padding: 10px;
            gap: 12px;
            align-items: center;
            justify-content: space-around;
        }
        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            touch-action: none;
            user-select: none;
        }
        .knob-lbl {
            font-size: 11px;
            color: #a0a6b2;
            text-align: center;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .knob {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #18191d;
            border: 2.5px solid #111;
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.15), 0 4px 8px rgba(0,0,0,0.6);
        }
        .knob-indicator {
            position: absolute;
            top: 5px;
            left: 22px;
            width: 4px;
            height: 15px;
            background: #ff9900;
            transform-origin: center 20px;
            border-radius: 2px;
        }
        .knob-stepper-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .step-btn {
            width: 38px;
            height: 38px;
            background: #333640;
            border: 1px solid #484d5c;
            border-radius: 6px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }
        .step-btn:hover { background: #3f4350; }
        .step-btn:active {
            transform: scale(0.92);
            background: #ff9900;
            color: #000;
        }
        .knob-val {
            background: #ffffff;
            color: #000000;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #000;
            text-align: center;
            min-width: 58px;
        }

        .b1 .band-header { border-color: #00FFFF; } .b1 .band-num { color: #00FFFF; border: 1px solid #00FFFF;}
        .b2 .band-header { border-color: #00FF00; } .b2 .band-num { color: #00FF00; border: 1px solid #00FF00;}

        .b6 .band-header { border-color: #FF8800; } .b6 .band-num { color: #FF8800; border: 1px solid #FF8800;}
