                const dy = startY - clientY;
                const deltaDb = (dy / 3.0) * 0.5;
                const newDb = Math.max(-18.0, Math.min(18.0, initialVal + deltaDb));
                applyGain(activeChannelIdx, newDb);
                sendGainSync(activeChannelIdx, newDb, false);
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                gainKnob.classList.remove('dragging');
                sendGainSync(activeChannelIdx, channelGainState[activeChannelIdx], true);
            }

            gainKnob.addEventListener('touchstart', (e) => {
                e.preventDefault(); e.stopPropagation(); startDrag(e.touches[0].clientY);
            }, { passive: false });
            gainKnob.addEventListener('touchmove', (e) => {
                if (isDragging) { e.preventDefault(); e.stopPropagation(); moveDrag(e.touches[0].clientY); }
            }, { passive: false });
            gainKnob.addEventListener('touchend', (e) => {
                if (isDragging) { e.preventDefault(); e.stopPropagation(); endDrag(); }
            }, { passive: false });
            gainKnob.addEventListener('touchcancel', () => {
                isDragging = false; gainKnob.classList.remove('dragging');
            });

            gainKnob.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                e.stopPropagation();
                gainKnob.setPointerCapture(e.pointerId);
                startDrag(e.clientY);
            });
            gainKnob.addEventListener('pointermove', (e) => {
                if (isDragging && e.pointerType !== 'touch') moveDrag(e.clientY);
            });
            gainKnob.addEventListener('pointerup', (e) => {
                if (isDragging && e.pointerType !== 'touch') endDrag();
            });

            gainKnob.addEventListener('wheel', (e) => {
                e.preventDefault();
                const step = (e.deltaY < 0 ? 0.5 : -0.5);
                const cur = channelGainState[activeChannelIdx] || 0.0;
                const newDb = Math.max(-18.0, Math.min(18.0, cur + step));
                applyGain(activeChannelIdx, newDb);
                sendGainSync(activeChannelIdx, newDb, true);
            }, { passive: false });

            gainKnob.addEventListener('dblclick', () => {
                applyGain(activeChannelIdx, 0.0);
                sendGainSync(activeChannelIdx, 0.0, true);
            });
            if (gainVal) {
                gainVal.addEventListener('click', () => {
                    applyGain(activeChannelIdx, 0.0);
                    sendGainSync(activeChannelIdx, 0.0, true);
                });
            }
        }
        setupModalGainKnobEventsGEQ();

        // Sincroniza posição visual do fader do modal (PEQ e GEQ) com o fader real do canal
        function syncModalFader(channelIdx) {
            const data = channelStripsData[channelIdx];
            if (!data) return;
            const pct = parseFloat(data.faderCap.style.bottom) || 0;
            const dbStr = pctToDbStr(pct);
            ['', '-geq'].forEach(suf => {
                const cap = document.getElementById('modal-fader-cap' + suf);
                const val = document.getElementById('modal-fader-val' + suf);
                if (cap) cap.style.bottom = pct + '%';
                if (val) val.textContent = dbStr;
            });
        }

        // Lógica de drag do fader do modal (unificada para PEQ e GEQ)
        let isModalFaderDragging = false;
        let activeFaderTrack = null;

        function applyModalFaderWithTrack(clientY, trackEl, isFinal) {
            if (!trackEl) return;
            const rect = trackEl.getBoundingClientRect();
            const pct = 1 - (clientY - rect.top) / rect.height;
            const valPct = Math.max(0, Math.min(1, pct)) * 100;
            const dbStr = pctToDbStr(valPct);

            ['', '-geq'].forEach(suf => {
                const cap = document.getElementById('modal-fader-cap' + suf);
                const val = document.getElementById('modal-fader-val' + suf);
                if (cap) cap.style.bottom = valPct + '%';
                if (val) val.textContent = dbStr;
            });

            applyVolume(activeChannelIdx, valPct);
            sendVolumeSync(activeChannelIdx, Math.round(valPct * 10) / 10, isFinal);
        }

        ['modal-fader-track', 'modal-fader-track-geq'].forEach(trackId => {
            const track = document.getElementById(trackId);
            if (!track) return;
            track.addEventListener('pointerdown', (e) => {
                isModalFaderDragging = true;
                activeFaderTrack = track;
                track.setPointerCapture(e.pointerId);
                const cap = track.querySelector('.modal-fader-cap');
                if (cap) cap.classList.add('dragging');
                applyModalFaderWithTrack(e.clientY, track, false);
                e.preventDefault();
            });
        });

        window.addEventListener('pointermove', (e) => {
            if (!isModalFaderDragging || !activeFaderTrack) return;
            applyModalFaderWithTrack(e.clientY, activeFaderTrack, false);
            e.preventDefault();
        });

        window.addEventListener('pointerup', (e) => {
            if (!isModalFaderDragging || !activeFaderTrack) return;
            isModalFaderDragging = false;
            const cap = activeFaderTrack.querySelector('.modal-fader-cap');
            if (cap) cap.classList.remove('dragging');
            applyModalFaderWithTrack(e.clientY, activeFaderTrack, true);
            activeFaderTrack = null;
        });

        // Touch events para fader do modal (PEQ e GEQ)
        ['modal-fader-track', 'modal-fader-track-geq'].forEach(trackId => {
            const track = document.getElementById(trackId);
            if (!track) return;
            track.addEventListener('touchstart', (e) => {
                isModalFaderDragging = true;
                activeFaderTrack = track;
                const cap = track.querySelector('.modal-fader-cap');
                if (cap) cap.classList.add('dragging');
                applyModalFaderWithTrack(e.touches[0].clientY, track, false);
                e.preventDefault();
            }, { passive: false });
            track.addEventListener('touchmove', (e) => {
                if (!isModalFaderDragging) return;
                applyModalFaderWithTrack(e.touches[0].clientY, track, false);
                e.preventDefault();
            }, { passive: false });
            track.addEventListener('touchend', (e) => {
                if (!isModalFaderDragging) return;
                isModalFaderDragging = false;
                const cap = track.querySelector('.modal-fader-cap');
                if (cap) cap.classList.remove('dragging');
                const t = e.changedTouches[0];
                if (t) applyModalFaderWithTrack(t.clientY, track, true);
                activeFaderTrack = null;
            }, { passive: false });
        });


        // ── Drawing Mini EQ Curves (Retina / Mobile Crisp) ─────────
        function drawMiniEQ(chIdx) {
            const data = channelStripsData[chIdx];
            if (!data) return;
            const canvas = data.eqCanvas;
            const ctx = data.eqCtx;
            if (!canvas || !ctx) return;

            const w = 70, h = 32;
            const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
            const tw = Math.round(w * dpr);
            const th = Math.round(h * dpr);
            if (canvas.width !== tw || canvas.height !== th) {
                canvas.width = tw;
                canvas.height = th;
            }
            if (ctx.resetTransform) ctx.resetTransform();
            else ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, w, h);

            const bands = channelEQState[chIdx] || defaultBands;
            const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[chIdx]) 
                ? channelHPFState[chIdx] : null;
            const isEqOn = (typeof channelEQEnabled !== 'undefined' && channelEQEnabled[chIdx] !== undefined)
                ? channelEQEnabled[chIdx] : true;
            const minF = Math.log10(20), maxF = Math.log10(20000);

            ctx.fillStyle = "rgba(255, 136, 0, 0.2)";
            ctx.strokeStyle = "#FF8800";
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(0, h/2);
            for (let px = 0; px <= w; px++) {
                const curLogF = minF + (px / w) * (maxF - minF);
                const curF = Math.pow(10, curLogF);
                let totalDb = 0;
                if (isEqOn) {
                    // Resposta do HPF
                    if (hpf && hpf.enabled) {
                        totalDb += getHPFResponseDb(curF, hpf);
                    }
                    // Resposta do EQ Paramétrico (PEQ)
                    bands.forEach(b => {
                        if (b.gain === 0) return;
                        const octDiff = Math.log2(curF / b.freq);
                        const bw = 1 / b.q;
                        totalDb += b.gain * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                    });
                    // Resposta do EQ Gráfico (GEQ)
                    const geqBands = (typeof channelGEQState !== 'undefined' && channelGEQState[chIdx])
                        ? channelGEQState[chIdx] : null;
                    if (geqBands) {
                        const bw = 1 / 4.31; // Q de 1/3 oitava
                        for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                            const g = geqBands[k];
                            if (!g) continue;
                            const f0 = ISO_GEQ_FREQS[k];
                            const octDiff = Math.log2(curF / f0);
                            totalDb += g * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                        }
                    }
                }
                let y = h/2 - (totalDb / 15) * (h/2);
                y = Math.max(0, Math.min(h, y));
                ctx.lineTo(px, y);
            }
            ctx.stroke();
        }

        // ── Apply Remote Updates ──────────────────────────────────────
        function applyVolume(idx, valPct) {
            const data = channelStripsData[idx];
            if (!data) return;
            const clamped = Math.max(0, Math.min(100, valPct));
            data.faderCap.style.bottom = clamped + '%';
            if (data.volReadout && typeof pctToDbStr === 'function') {
                data.volReadout.textContent = pctToDbStr(clamped);
            }
            
            // Atualiza o ganho do fader no grafo de áudio do mixer
            updateChannelFaderGain(idx);

            // Sincroniza o fader do modal se o EQ estiver aberto neste canal
            if (modal.style.display === 'flex' && idx === activeChannelIdx) {
                const cap = document.getElementById('modal-fader-cap');
                const val = document.getElementById('modal-fader-val');
                if (cap) cap.style.bottom = clamped + '%';
                if (val && typeof pctToDbStr === 'function') val.textContent = pctToDbStr(clamped);
            }
        }


        function applyMute(idx, isMuted) {
            const data = channelStripsData[idx];
            if (!data) return;
            if (isMuted) {
                data.muteBtn.classList.add('muted');
                data.meterFill.classList.add('muted');
                if (data.pill) data.pill.classList.add('is-muted');
                if (data.volReadout) data.volReadout.classList.add('muted');
            } else {
                data.muteBtn.classList.remove('muted');
                data.meterFill.classList.remove('muted');
                if (data.pill) data.pill.classList.remove('is-muted');
                if (data.volReadout) data.volReadout.classList.remove('muted');
            }
            
            // Atualiza o ganho do fader considerando o mute
            updateChannelFaderGain(idx);
        }

        function applyName(idx, name) {
            const data = channelStripsData[idx];
            if (!data) return;
            if (data.channelInput.value !== name) {
                data.channelInput.value = name;
            }
            if (modal.style.display === 'flex') {
                if (activeChannelIdx === idx) {
                    modalTitle.textContent = "EQ Eight - " + name;
                }
                renderChannelSelector(activeChannelIdx);
            }
        }

        // ── Throttled Volume Sync ─────────────────────────────────────
        let lastVolSendTime = 0;
        let volSendTimer = null;
        function sendVolumeSync(channel, valPct, isFinal = false) {
            const now = Date.now();
            const valRounded = Math.round(valPct * 10) / 10;
            if (isFinal) {
                if (volSendTimer) clearTimeout(volSendTimer);
                sendSync({ type: 'volume', channel, value: valRounded });
                return;
            }
            if (now - lastVolSendTime > 35) {
                lastVolSendTime = now;
                sendSync({ type: 'volume', channel, value: valRounded });
            } else {
                if (volSendTimer) clearTimeout(volSendTimer);
                volSendTimer = setTimeout(() => {
                    sendSync({ type: 'volume', channel, value: valRounded });
                }, 35);
            }
        }

        // Generate mixer channels (LR Entrada + Ch 1 to Ch 10 Saídas)
        for (let i = 0; i < 11; i++) {
            const isInput = i === 0;
            const channelNumber = isInput ? "LR" : `${i}`;
            const defaultName = isInput ? "Entrada" : `Ch ${i}`;
            
            const strip = document.createElement('div');
            strip.className = `channel-strip ${isInput ? 'main-strip' : ''}`;
            
            strip.innerHTML = `
                <div class="channel-gain-container">
                    <span class="gain-title">GAIN</span>
                    <div class="gain-knob-wrapper">
                        <div class="gain-knob" data-ch="${i}" title="Ganho do Canal (Arraste verticalmente, duplo-clique para 0 dB)">
                            <div class="gain-indicator"></div>
                        </div>
                        <div class="gain-val" title="Toque para resetar para 0.0 dB">+0.0 dB</div>
                    </div>
                </div>
                <div class="eq-display" title="Abrir EQ Eight">
                    <canvas class="eq-canvas" width="70" height="32"></canvas>
                </div>
                <button class="mute-btn">Mute</button>
                <div class="fader-vol-readout" title="Toque para resetar para 0.0 dB">+0.0 dB</div>
                <div class="fader-area">
                    <div class="meter-bg">
                        <div class="meter-clip line1"></div>
                        <div class="meter-clip line2"></div>
                        <div class="meter-fill" style="height: 100%"></div>
                    </div>
                    <div class="fader-track"></div>
                    <div class="scale-marks">
                        <span style="top: 0%;">+6</span>
                        <span style="top: 15%;">+3</span>
                        <span class="scale-mark-0u" style="top: 30%;">0 U</span>
                        <span style="top: 45%;">-5</span>
                        <span style="top: 58%;">-10</span>
                        <span style="top: 70%;">-20</span>
                        <span style="top: 80%;">-30</span>
                        <span style="top: 90%;">-50</span>
                        <span style="top: 100%;">-∞</span>
                    </div>
                    <div class="fader-track-touch">
                        <div class="fader-track-line"></div>
                        <div class="fader-track-mark-0db"></div>
                        <div class="fader-cap" style="bottom: 70%;"></div>
                    </div>
                </div>
                <div class="channel-label-container">
                    <span class="channel-number">${channelNumber}</span>
                    <input type="text" class="channel-input" value="${defaultName}" ${isInput ? 'readonly' : ''} maxlength="10">
                </div>
            `;
            
            const muteBtn = strip.querySelector('.mute-btn');
            const meterFill = strip.querySelector('.meter-fill');
            const eqDisplay = strip.querySelector('.eq-display');
            const eqCanvas = strip.querySelector('.eq-canvas');
            const faderArea = strip.querySelector('.fader-area');
            const faderTouch = strip.querySelector('.fader-track-touch');
            const faderCap = strip.querySelector('.fader-cap');
            const volReadout = strip.querySelector('.fader-vol-readout');
            const channelInput = strip.querySelector('.channel-input');
            const ctx = eqCanvas.getContext('2d');
            const gainKnob = strip.querySelector('.gain-knob');
            const gainIndicator = strip.querySelector('.gain-indicator');
            const gainVal = strip.querySelector('.gain-val');

            setupGainKnobEvents(gainKnob, gainIndicator, gainVal, i);

            // Quick channel ribbon pill (navegação rápida no celular e desktop)
            const ribbon = document.getElementById('channel-ribbon');
            let pill = null;
            if (ribbon) {
                pill = document.createElement('button');
                pill.className = `ribbon-pill ${isInput ? 'active' : ''}`;
                pill.setAttribute('data-ch', i);
                const labelText = isInput ? "LR" : `${channelNumber}: ${defaultName}`;
                pill.innerHTML = `<span class="ribbon-dot"></span><span class="ribbon-text">${labelText}</span>`;
                pill.onclick = () => {
                    strip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    document.querySelectorAll('.ribbon-pill').forEach((p, idx) => p.classList.toggle('active', idx === i));
                    document.querySelectorAll('.channel-strip').forEach((s, idx) => s.classList.toggle('active-focused', idx === i));
                };
                ribbon.appendChild(pill);
            }

            channelStripsData[i] = {
                strip,
                pill,
                muteBtn,
                meterFill,
                volReadout,
                faderCap,
                faderTouch,
                faderArea,
                channelInput,
                eqCanvas,
                eqCtx: ctx,
                gainKnob,
                gainIndicator,
                gainVal
            };
            
            eqDisplay.addEventListener('click', () => {
                ensureAudioCtx();
                const customName = channelInput.value;
                modalTitle.textContent = "EQ Eight - " + customName;
                initModal(i);
                modal.style.display = 'flex';
                setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
            });
            
            muteBtn.addEventListener('click', () => {
                const willBeMuted = !muteBtn.classList.contains('muted');
                applyMute(i, willBeMuted);
                sendSync({ type: 'mute', channel: i, value: willBeMuted });
            });

            // Toque no display de dB reseta para Unity Gain (0.0 dB / 70%)
            if (volReadout) {
                volReadout.addEventListener('click', () => {
                    applyVolume(i, 70);
                    sendVolumeSync(i, 70, true);
                });
            }
            
            function getTouchY(e) {
                if (e.touches && e.touches.length > 0) return e.touches[0].clientY;
                if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientY;
                return e.clientY;
            }

            let isDraggingFader = false;
            let startDragY = 0;
            let startFaderPct = 0;

            function onFaderStart(clientY) {
                isDraggingFader = true;
                startDragY = clientY;
                startFaderPct = parseFloat(faderCap.style.bottom) || 0;
                faderCap.classList.add('dragging');
            }

            function onFaderMove(clientY) {
                if (!isDraggingFader) return;
                const rect = faderTouch.getBoundingClientRect();
                const trackH = rect.height || 200;
                const dy = startDragY - clientY; // arrastar para cima aumenta ganho
                const deltaPct = (dy / trackH) * 100;
                const newPct = Math.max(0, Math.min(100, startFaderPct + deltaPct));
                applyVolume(i, newPct);
                sendVolumeSync(i, newPct, false);
            }

            function onFaderEnd(clientY) {
                if (!isDraggingFader) return;
                isDraggingFader = false;
                faderCap.classList.remove('dragging');
                const rect = faderTouch.getBoundingClientRect();
                const trackH = rect.height || 200;
                let finalPct = startFaderPct;
                if (clientY !== undefined && clientY !== null && !isNaN(clientY)) {
                    const dy = startDragY - clientY;
                    const deltaPct = (dy / trackH) * 100;
                    finalPct = Math.max(0, Math.min(100, startFaderPct + deltaPct));
                }
                applyVolume(i, finalPct);
                sendVolumeSync(i, finalPct, true);
            }

            // O fader modula EXCLUSIVAMENTE ao clicar/arrastar o botão de volume (fader-cap)
            faderCap.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                onFaderStart(getTouchY(e));
            }, { passive: false });

            faderCap.addEventListener('touchmove', (e) => {
                if (isDraggingFader) {
                    e.preventDefault();
                    e.stopPropagation();
                    onFaderMove(getTouchY(e));
                }
            }, { passive: false });

            faderCap.addEventListener('touchend', (e) => {
                if (isDraggingFader) {
                    e.preventDefault();
                    e.stopPropagation();
                    onFaderEnd(getTouchY(e));
                }
            }, { passive: false });

            faderCap.addEventListener('touchcancel', () => {
                if (isDraggingFader) {
                    isDraggingFader = false;
                    faderCap.classList.remove('dragging');
                }
            });

            // Pointer / Mouse events SOMENTE no botão de volume (fader-cap)
            faderCap.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                e.stopPropagation();
                faderCap.setPointerCapture(e.pointerId);
                onFaderStart(e.clientY);
            });

            faderCap.addEventListener('pointermove', (e) => {
                if (e.pointerType === 'touch') return;
                if (isDraggingFader) {
                    onFaderMove(e.clientY);
                }
            });

            faderCap.addEventListener('pointerup', (e) => {
                if (e.pointerType === 'touch') return;
                if (isDraggingFader) {
                    try { faderCap.releasePointerCapture(e.pointerId); } catch(err) {}
                    onFaderEnd(e.clientY);
                }
            });

            faderCap.addEventListener('pointercancel', (e) => {
                if (isDraggingFader) {
                    isDraggingFader = false;
                    faderCap.classList.remove('dragging');
                    try { faderCap.releasePointerCapture(e.pointerId); } catch(err) {}
                }
            });

            channelInput.addEventListener('input', () => {
                if (pill) {
                    const textSpan = pill.querySelector('.ribbon-text') || pill;
                    textSpan.textContent = isInput ? "LR" : `${channelNumber}: ${channelInput.value}`;
                }
                if (modal.style.display === 'flex') {
                    if (activeChannelIdx === i) {
                        modalTitle.textContent = "EQ Eight - " + channelInput.value;
                    }
                    renderChannelSelector(activeChannelIdx);
                }
                sendSync({ type: 'name', channel: i, value: channelInput.value });
            });
            
            mixerContainer.appendChild(strip);
            drawMiniEQ(i);
        }

        // Restaura imediatamente o último estado salvo localmente antes do handshake
        restoreLocalState();

        // Inicializa o grafo Web Audio se o contexto já estiver ativo
        if (audioCtx) {
            initMixerAudioGraph();
        }

        // Sincronização da barra de atalhos rápidos com o scroll horizontal no celular
        const mixerWrapper = document.querySelector('.mixer-wrapper');
        if (mixerWrapper) {
            let scrollDebounce = null;
            mixerWrapper.addEventListener('scroll', () => {
                if (scrollDebounce) cancelAnimationFrame(scrollDebounce);
                scrollDebounce = requestAnimationFrame(() => {
                    const center = mixerWrapper.scrollLeft + mixerWrapper.clientWidth / 2;
                    let closestIdx = 0;
                    let minDiff = Infinity;
                    channelStripsData.forEach((chData, idx) => {
                        if (!chData || !chData.strip) return;
                        const stripCenter = chData.strip.offsetLeft + chData.strip.offsetWidth / 2;
                        const diff = Math.abs(stripCenter - center);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIdx = idx;
                        }
                    });
                    document.querySelectorAll('.ribbon-pill').forEach((p, idx) => {
                        const isActive = idx === closestIdx;
                        p.classList.toggle('active', isActive);
                        if (isActive && p.scrollIntoView) {
                            p.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                        }
                    });
                });
            }, { passive: true });
        }

        // ── Processador Central de Mensagens Recebidas ────────────────
        function handleIncomingMessage(msgType, data) {
            if (!data) return;

            if (msgType === 'clients_count') {
                setSyncStatus(true, data.count);
                return;
            }

            if (msgType === 'init') {
                setSyncStatus(true);
                const channels = data.channels || (data.data && data.data.channels);
                if (channels) {
                    channels.forEach((ch, idx) => {
                        if (channelStripsData[idx]) {
                            if (ch.gain !== undefined) applyGain(idx, ch.gain);
                            applyVolume(idx, ch.volume);
                            applyMute(idx, ch.mute);
                            applyName(idx, ch.name);
                            if (ch.bands) channelEQState[idx] = ch.bands;
                            if (ch.hpf) channelHPFState[idx] = ch.hpf;
                            if (ch.eqMode && typeof channelEQMode !== 'undefined') channelEQMode[idx] = ch.eqMode;
                            if (ch.geqBands && typeof channelGEQState !== 'undefined') channelGEQState[idx] = ch.geqBands;
                            if (ch.eqEnabled !== undefined) channelEQEnabled[idx] = ch.eqEnabled;
                            drawMiniEQ(idx);
                        }
                    });
                    if (typeof saveLocalState === 'function') saveLocalState();
                }
                return;
            }

            if (msgType === 'update') {
                const payload = data.data || data;
                if (!payload || payload.clientId === CLIENT_ID) return; // ignora eco local

                const ch = payload.channel;
                if (payload.type === 'gain') {
                    applyGain(ch, payload.value);
                } else if (payload.type === 'volume') {
                    applyVolume(ch, payload.value);
                } else if (payload.type === 'mute') {
                    applyMute(ch, payload.value);
                } else if (payload.type === 'name') {
                    applyName(ch, payload.value);
                } else if (payload.type === 'pink_noise') {
                    if (payload.value) {
                        channelPinkOn(ch);
                    } else {
                        channelPinkOff(ch);
                    }
                    if (modal.style.display === 'flex' && activeChannelIdx === ch) {
                        updatePinkNoiseButton();
                    }
                } else if (payload.type === 'eq_mode') {
                    if (typeof channelEQMode !== 'undefined') {
                        channelEQMode[ch] = payload.value;
                        if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(ch);
                        drawMiniEQ(ch);
                        if (modal.style.display === 'flex' && activeChannelIdx === ch) {
                            setChannelEQMode(payload.value, false);
                        }
                    }
                } else if (payload.type === 'geq') {
                    if (typeof channelGEQState !== 'undefined' && payload.bands) {
                        channelGEQState[ch] = payload.bands;
                        if (payload.enabled !== undefined) {
                            channelEQEnabled[ch] = payload.enabled;
                        }
                        if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(ch);
                        drawMiniEQ(ch);
                        if (modal.style.display === 'flex' && activeChannelIdx === ch) {
                            updateGEQToolbarUI();
                            if (channelEQMode[ch] === 'geq') {
                                for (let k = 0; k < NUM_GEQ_BANDS; k++) {
                                    updateGEQSliderUI(k, payload.bands[k] || 0.0);
                                }
                            }
                        }
                    }
                } else if (payload.type === 'eq') {
                    if (payload.hpf && channelHPFState[ch]) {
                        channelHPFState[ch] = payload.hpf;
                    }
                    if (payload.bands && channelEQState[ch]) {
                        channelEQState[ch] = payload.bands;
                        if (payload.enabled !== undefined) {
                            channelEQEnabled[ch] = payload.enabled;
                        }
                        if (typeof updateChannelEQFilters === 'function') {
                            updateChannelEQFilters(ch);
                        }
                        drawMiniEQ(ch);
                        if (modal.style.display === 'flex' && activeChannelIdx === ch) {
                            currentBands = channelEQState[ch];
                            if (payload.enabled !== undefined) {
                                eqEnabled = payload.enabled;
                                eqOnBtn.textContent = eqEnabled ? 'EQ: On' : 'EQ: Off';
                                eqOnBtn.style.background = eqEnabled ? '#FF9900' : '#555';
                                eqOnBtn.style.color = eqEnabled ? '#000' : '#FFF';
                            }
                            updateHPFUI();
                            currentBands.forEach((b, k) => {
                                const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2)+'k' : Math.round(b.freq)+' Hz';
                                setBoxVal(document.getElementById(`bx-f-${k}`), freqStr);
                                setBoxVal(document.getElementById(`bx-g-${k}`), b.gain.toFixed(1));
                                setBoxVal(document.getElementById(`bx-q-${k}`), b.q.toFixed(1));
                            });
                            updateKnobs();
                            drawEQGraph();
                        }
                    }
                }
                if (typeof scheduleSaveLocalState === 'function') {
                    scheduleSaveLocalState(150);
                }
            }
        }

        // ── Conexão em Tempo Real (WebSocket Primário + SSE Fallback) ─
        function connectRealtime() {
            const host = window.location.host || 'localhost:8080';
            const wsProtocol = (window.location.protocol === 'https:') ? 'wss://' : 'ws://';
            const wsUrl = `${wsProtocol}${host}/ws`;

            let wsConnected = false;

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    wsConnected = true;
                    console.log("[WS] Conectado ao servidor!");
                    setSyncStatus(true);
                };

                ws.onmessage = (e) => {
                    try {
                        const parsed = JSON.parse(e.data);
                        handleIncomingMessage(parsed.type, parsed.data || parsed);
                    } catch (err) {
                        console.error("[WS] Erro parsing:", err);
                    }
                };

                ws.onclose = () => {
                    console.warn("[WS] Conexão fechada. Reconectando em 2s...");
                    setSyncStatus(false);
                    setTimeout(connectRealtime, 2000);
                };

                ws.onerror = () => {
                    if (!wsConnected) {
                        console.warn("[WS] Falha na conexão WebSocket, ativando fallback SSE...");
                        initSSEFallback();
                    }
                };
            } catch (e) {
                initSSEFallback();
            }
        }

        function initSSEFallback() {
            if (sse) return;
            try {
                sse = new EventSource('/events');
                sse.addEventListener('init', (e) => handleIncomingMessage('init', JSON.parse(e.data)));
                sse.addEventListener('update', (e) => handleIncomingMessage('update', JSON.parse(e.data)));
                sse.addEventListener('clients_count', (e) => handleIncomingMessage('clients_count', JSON.parse(e.data)));
                sse.onopen = () => setSyncStatus(true);
                sse.onerror = () => setSyncStatus(false);
            } catch (err) {
                console.error("SSE Fallback falhou:", err);
            }
        }

        connectRealtime();
    </script>
