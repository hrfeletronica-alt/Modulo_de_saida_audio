        function setBoxVal(el, val) {
            if (!el) return;
            if (el.tagName === 'INPUT') {
                if (document.activeElement !== el) el.value = val;
            } else {
                el.textContent = val;
            }
        }

        function onBoxParamChange(bandIdx, param, rawVal) {
            selectBand(bandIdx);
            const b = currentBands[bandIdx];
            if (!b) return;

            let s = String(rawVal).trim().toLowerCase().replace(',', '.');
            if (param === 'freq') {
                let isK = s.includes('k');
                s = s.replace(/[^0-9.]/g, '');
                let num = parseFloat(s);
                if (!isNaN(num)) {
                    if (isK && num < 100) num *= 1000;
                    b.freq = Math.max(20, Math.min(20000, Math.round(num)));
                }
            } else if (param === 'gain') {
                s = s.replace(/[^0-9.-]/g, '');
                let num = parseFloat(s);
                if (!isNaN(num)) {
                    b.gain = Math.max(-15, Math.min(15, Math.round(num * 10) / 10));
                }
            } else if (param === 'q') {
                s = s.replace(/[^0-9.]/g, '');
                let num = parseFloat(s);
                if (!isNaN(num)) {
                    b.q = Math.max(0.1, Math.min(10, Math.round(num * 10) / 10));
                }
            }

            const freqStr = b.freq >= 1000 ? (b.freq / 1000).toFixed(2) + 'k' : b.freq + ' Hz';
            const fEl = document.getElementById(`bx-f-${bandIdx}`);
            const gEl = document.getElementById(`bx-g-${bandIdx}`);
            const qEl = document.getElementById(`bx-q-${bandIdx}`);
            if (fEl) fEl.value = freqStr;
            if (gEl) gEl.value = b.gain.toFixed(1);
            if (qEl) qEl.value = b.q.toFixed(1);

            updateKnobs();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(true);
        }

        function selectBand(index) {
            selectedBandIndex = index;
            const hpfBox = document.getElementById('band-box-hpf');
            if (hpfBox) hpfBox.classList.toggle('selected', index === -1);
            const nonHpfBoxes = document.querySelectorAll('.band-box:not(.band-box-hpf)');
            nonHpfBoxes.forEach((b, i) => {
                b.classList.toggle('selected', i === index);
            });
            const targetBox = (index === -1) ? hpfBox : (nonHpfBoxes ? nonHpfBoxes[index] : null);
            if (targetBox && targetBox.scrollIntoView) {
                try {
                    targetBox.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } catch(e) {}
            }
            updateKnobs();
            drawEQGraph();
        }

        function stepParam(type, dir) {
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (!hpf) return;
                if (type === 'freq') {
                    hpf.freq = Math.max(20, Math.min(1000, Math.round(hpf.freq * (dir > 0 ? 1.15 : 0.87))));
                } else if (type === 'gain') {
                    hpf.slope = (hpf.slope === 12) ? 24 : 12;
                } else if (type === 'q') {
                    hpf.enabled = !hpf.enabled;
                }
                updateHPFUI();
                updateKnobs();
                drawEQGraph();
                drawMiniEQ(activeChannelIdx);
                if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
                notifyEQChanged(true);
                return;
            }
            const b = currentBands[selectedBandIndex];
            if (type === 'freq') {
                const minF = 20, maxF = 20000;
                b.freq = Math.max(minF, Math.min(maxF, b.freq * (dir > 0 ? 1.15 : 0.87)));
            } else if (type === 'gain') {
                b.gain = Math.max(-15, Math.min(15, Math.round((b.gain + dir * 0.5) * 10) / 10));
            } else if (type === 'q') {
                b.q = Math.max(0.2, Math.min(10, Math.round((b.q + dir * 0.1) * 10) / 10));
            }
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(true);
        }

        function updateKnobs() {
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (!hpf) return;
                const freqStr = hpf.freq >= 1000 ? (hpf.freq/1000).toFixed(2) + 'k' : Math.round(hpf.freq) + ' Hz';
                document.getElementById('val-freq').textContent = freqStr;
                document.getElementById('val-gain').textContent = `${hpf.slope} dB`;
                document.getElementById('val-q').textContent = hpf.enabled ? 'ON' : 'OFF';

                const minF = Math.log10(20); const maxF = Math.log10(1000);
                const normF = (Math.log10(hpf.freq) - minF) / (maxF - minF);
                document.getElementById('ind-freq').style.transform = `rotate(${Math.max(0, Math.min(1, normF)) * 270 - 135}deg)`;
                document.getElementById('ind-gain').style.transform = hpf.slope === 24 ? 'rotate(90deg)' : 'rotate(-90deg)';
                document.getElementById('ind-q').style.transform = hpf.enabled ? 'rotate(90deg)' : 'rotate(-90deg)';
                return;
            }
            const b = currentBands[selectedBandIndex];
            if (!b) return;
            document.getElementById('val-freq').textContent = b.freq >= 1000 ? (b.freq/1000).toFixed(2) + 'k' : Math.round(b.freq) + ' Hz';
            document.getElementById('val-gain').textContent = (b.gain > 0 ? '+' : '') + b.gain.toFixed(1) + ' dB';
            document.getElementById('val-q').textContent = b.q.toFixed(2);
            
            const minF = Math.log10(20); const maxF = Math.log10(20000);
            const normF = (Math.log10(b.freq) - minF) / (maxF - minF);
            document.getElementById('ind-freq').style.transform = `rotate(${normF * 270 - 135}deg)`;

            const normG = (b.gain + 15) / 30;
            document.getElementById('ind-gain').style.transform = `rotate(${normG * 270 - 135}deg)`;

            const normQ = b.q / 10;
            document.getElementById('ind-q').style.transform = `rotate(${normQ * 270 - 135}deg)`;
        }

        function drawEQGraph() {
            const canvas = document.getElementById('eqGraph');
            const ctx = canvas.getContext('2d');
            
            // Adjust internal canvas resolution to match display size for crisp lines
            const rect = canvas.getBoundingClientRect();
            if (rect.width > 0 && (canvas.width !== rect.width || canvas.height !== rect.height)) {
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            
            const w = canvas.width; const h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i = 0; i <= 6; i++) {
                const y = i * (h / 6);
                ctx.moveTo(0, y); ctx.lineTo(w, y);
            }
            const freqs = [20, 40, 80, 100, 200, 400, 800, 1000, 2000, 4000, 8000, 10000, 20000];
            const minF = Math.log10(20); const maxF = Math.log10(20000);
            freqs.forEach(f => {
                const x = ((Math.log10(f) - minF) / (maxF - minF)) * w;
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
            });
            ctx.stroke();

            ctx.strokeStyle = '#555'; ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();

            // --- RTA Bars (drawn behind EQ curve, from bottom = -15dB upward) ---
            if(rtaEnabled && rtaBands.length > 0) {
                const numBars = rtaBands.length;
                const barW = w / numBars;
                for(let b = 0; b < numBars; b++) {
                    // Full height = full scale (bottom of canvas = -15dB)
                    const barH = rtaBands[b] * h;
                    const bx   = b * barW;
                    const by   = h - barH; // start from the very bottom

                    // Color gradient: dark green (quiet) → bright green → yellow at top
                    const pct = rtaBands[b];
                    const r  = Math.round(pct * pct * 220);
                    const g  = Math.round(180 + pct * 60);
                    const bl = Math.round(30);
                    ctx.fillStyle = `rgba(${r},${g},${bl},0.50)`;
                    ctx.fillRect(bx, by, barW - 1, barH);

                    // Peak hold indicator (bright line at top of bar)
                    ctx.fillStyle = `rgba(${Math.min(255,r+80)},${g},${bl},0.95)`;
                    ctx.fillRect(bx, by - 2, barW - 1, 2);
                }
            }

            // Draw EQ curve (flat if EQ disabled)
            ctx.beginPath();
            ctx.moveTo(0, h/2);
            
            const hpf = getActiveHPF();
            let points = [];
            for(let px = 0; px <= w; px++) {
                const curLogF = minF + (px/w)*(maxF - minF);
                const curF = Math.pow(10, curLogF);
                
                let totalDb = 0;
                if(eqEnabled) {
                    if (hpf && hpf.enabled) {
                        totalDb += getHPFResponseDb(curF, hpf);
                    }
                    currentBands.forEach(b => {
                        if(b.gain === 0) return;
                        const octDiff = Math.log2(curF / b.freq);
                        const bw = 1 / b.q; 
                        const response = b.gain * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                        totalDb += response;
                    });
                }
                
                let y = h/2 - (totalDb / 15) * (h/2);
                y = Math.max(0, Math.min(h, y));
                points.push({x: px, y: y});
                ctx.lineTo(px, y);
            }
            
            const fillPath = new Path2D();
            fillPath.moveTo(0, h/2);
            points.forEach(p => fillPath.lineTo(p.x, p.y));
            fillPath.lineTo(w, h/2);
            fillPath.closePath();
            ctx.fillStyle = eqEnabled ? "rgba(255,136,0,0.6)" : "rgba(100,100,100,0.3)";
            ctx.fill(fillPath);

            ctx.strokeStyle = eqEnabled ? "#FF8800" : "#888";
            ctx.lineWidth = 2;
            ctx.beginPath();
            points.forEach((p, i) => {
                if(i===0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            // Draw HPF Handle Node on graph
            if (hpf) {
                const hpfX = ((Math.log10(hpf.freq) - minF) / (maxF - minF)) * w;
                const hpfDb = (eqEnabled && hpf.enabled) ? getHPFResponseDb(hpf.freq, hpf) : 0;
                const hpfY = h/2 - (hpfDb / 15) * (h/2);
                const isSelected = (selectedBandIndex === -1);
                const nodeColor = hpf.enabled ? "#00E5FF" : "#667788";

                // Guia vertical ciano
                ctx.strokeStyle = hpf.enabled ? "rgba(0, 229, 255, 0.30)" : "rgba(255, 255, 255, 0.08)";
                ctx.lineWidth = isSelected ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(hpfX, 0); ctx.lineTo(hpfX, h);
                ctx.stroke();

                // Círculo externo (touch target)
                const radius = isSelected ? 26 : 20;
                ctx.beginPath();
                ctx.arc(hpfX, hpfY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = isSelected ? "rgba(0, 229, 255, 0.45)" : "rgba(0, 229, 255, 0.15)";
                ctx.fill();

                // Círculo interno sólido
                const innerRadius = isSelected ? 15 : 12;
                ctx.beginPath();
                ctx.arc(hpfX, hpfY, innerRadius, 0, 2 * Math.PI);
                ctx.fillStyle = nodeColor;
                ctx.fill();

                // Texto HP
                ctx.fillStyle = hpf.enabled ? '#000' : '#FFF';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('HP', hpfX, hpfY);
            }

            currentBands.forEach((b, i) => {
                const x = ((Math.log10(b.freq) - minF) / (maxF - minF)) * w;
                const y = h/2 - (b.gain / 15) * (h/2);
                
                const isSelected = (i === selectedBandIndex);
                
                // Faint vertical line
                ctx.strokeStyle = "rgba(255,255,255,0.05)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, h);
                ctx.stroke();
                
                // Translucent outer circle (large for easy touch target)
                const radius = isSelected ? 26 : 20;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = b.color + (isSelected ? "88" : "44"); // Hex alpha
                ctx.fill();
                
                // Inner solid circle
                const innerRadius = isSelected ? 15 : 12;
                ctx.beginPath();
                ctx.arc(x, y, innerRadius, 0, 2 * Math.PI);
                ctx.fillStyle = b.color;
                ctx.fill();
                
                // Band ID text
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(b.id, x, y);
            });
        }

        // Mouse and Touch interaction for knobs
        let isDragging = false;
        let startY = 0;
        let activeKnob = null;
        let lastKnobTapTime = 0;

        const startDrag = (y, knobId) => {
            isDragging = true;
            startY = y;
            activeKnob = knobId;
        };

        const resetKnob = (knobId) => {
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (hpf) {
                    if (knobId === 'knob-freq') hpf.freq = 80;
                    else if (knobId === 'knob-gain') hpf.slope = 12;
                    else if (knobId === 'knob-q') hpf.enabled = false;
                    updateHPFUI();
                    updateKnobs();
                    drawEQGraph();
                    drawMiniEQ(activeChannelIdx);
                    if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
                    notifyEQChanged(true);
                }
                return;
            }
            const b = currentBands[selectedBandIndex];
            const def = defaultBands.find(db => db.id === b.id);
            if(knobId === 'knob-gain') {
                b.gain = 0;
                setBoxVal(document.getElementById(`bx-g-${selectedBandIndex}`), '0.0');
            } else if(knobId === 'knob-freq') {
                b.freq = def.freq;
                const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2) + 'k' : Math.round(b.freq) + ' Hz';
                setBoxVal(document.getElementById(`bx-f-${selectedBandIndex}`), freqStr);
            } else if(knobId === 'knob-q') {
                b.q = def.q;
                setBoxVal(document.getElementById(`bx-q-${selectedBandIndex}`), b.q.toFixed(2));
            }
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(true);
        };

        const moveDrag = (y) => {
            if(!isDragging || !activeKnob) return;
            const dy = startY - y; // up is positive
            startY = y;
            
            if (selectedBandIndex === -1) {
                const hpf = getActiveHPF();
                if (hpf) {
                    if (activeKnob === 'knob-freq') {
                        const logF = Math.log10(hpf.freq);
                        const newF = Math.pow(10, logF + dy * 0.015);
                        hpf.freq = Math.max(20, Math.min(1000, Math.round(newF)));
                    } else if (activeKnob === 'knob-gain') {
                        if (dy > 4) hpf.slope = 24;
                        else if (dy < -4) hpf.slope = 12;
                    } else if (activeKnob === 'knob-q') {
                        if (dy > 4) hpf.enabled = true;
                        else if (dy < -4) hpf.enabled = false;
                    }
                    updateHPFUI();
                    updateKnobs();
                    drawEQGraph();
                    drawMiniEQ(activeChannelIdx);
                    if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
                    notifyEQChanged(false);
                }
                return;
            }

            const b = currentBands[selectedBandIndex];
            
            if(activeKnob === 'knob-freq') {
                const logF = Math.log10(b.freq);
                const newF = Math.pow(10, logF + dy * 0.015);
                b.freq = Math.max(20, Math.min(20000, newF));
                const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2) + 'k' : Math.round(b.freq) + ' Hz';
                setBoxVal(document.getElementById(`bx-f-${selectedBandIndex}`), freqStr);
            }
            else if(activeKnob === 'knob-gain') {
                b.gain = Math.max(-15, Math.min(15, b.gain + dy * 0.3));
                setBoxVal(document.getElementById(`bx-g-${selectedBandIndex}`), b.gain.toFixed(1));
            }
            else if(activeKnob === 'knob-q') {
                b.q = Math.max(0.1, Math.min(10, b.q + dy * 0.08));
                setBoxVal(document.getElementById(`bx-q-${selectedBandIndex}`), b.q.toFixed(2));
            }
            
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(false);
        };

        const endDrag = () => {
            if(isDragging) {
                isDragging = false;
                activeKnob = null;
                notifyEQChanged(true);
            }
        };

        document.querySelectorAll('.knob').forEach(knob => {
            const handleKnobStart = (y, id) => {
                const now = Date.now();
                if(now - lastKnobTapTime < 300 && activeKnob === id) {
                    resetKnob(id);
                }
                lastKnobTapTime = now;
                startDrag(y, id);
            };
            knob.addEventListener('mousedown', (e) => { e.preventDefault(); handleKnobStart(e.clientY, knob.id); });
            knob.addEventListener('touchstart', (e) => { e.preventDefault(); handleKnobStart(e.touches[0].clientY, knob.id); }, {passive: false});
        });

        window.addEventListener('mousemove', (e) => moveDrag(e.clientY));
        window.addEventListener('touchmove', (e) => {
            if(isDragging) { e.preventDefault(); moveDrag(e.touches[0].clientY); }
        }, {passive: false});

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        // Graph Interaction (Drag directly on the canvas)
        const eqCanvasNode = document.getElementById('eqGraph');
        let isPointerDown   = false; // true while mouse/finger is held
        let isDraggingGraph = false; // true only after crossing threshold
        let graphHasMoved   = false; // true if actual drag happened
        let startGraphX = 0, startGraphY = 0;
        let initialBandFreq = 0, initialBandGain = 0;
        const DRAG_THRESHOLD = 8;

        // Double-tap tracking
        let lastTapBandIdx = -1;
        let lastTapTime    = 0;

        const getGraphCoords = (e) => {
            const rect = eqCanvasNode.getBoundingClientRect();
            const src  = e.changedTouches ? e.changedTouches[0]
                       : e.touches        ? e.touches[0]
                       : e;
            return {
                x: (src.clientX - rect.left) * (eqCanvasNode.width  / rect.width),
                y: (src.clientY - rect.top)  * (eqCanvasNode.height / rect.height)
            };
        };

        const selectNearestBand = (x) => {
            const w = eqCanvasNode.width;
            const minF = Math.log10(20), maxF = Math.log10(20000);
            const curF = Math.pow(10, minF + (x / w) * (maxF - minF));
            
            const hpf = getActiveHPF();
            let nearestIdx = 0;
            let minDist = Infinity;

            if (hpf) {
                const dHP = Math.abs(Math.log10(hpf.freq) - Math.log10(curF));
                minDist = dHP;
                nearestIdx = -1; // -1 represents HPF node
            }

            currentBands.forEach((b, i) => {
                const d = Math.abs(Math.log10(b.freq) - Math.log10(curF));
                if(d < minDist) { minDist = d; nearestIdx = i; }
            });
            return nearestIdx;
        };

        const resetBandGain = (idx) => {
            if (idx === -1) {
                toggleHPF();
                return;
            }
            currentBands[idx].gain = 0;
            setBoxVal(document.getElementById(`bx-g-${idx}`), '0.0');
            updateKnobs();
            drawEQGraph();
            notifyEQChanged(true);
        };

        // ── POINTER DOWN ──────────────────────────────────────────────
        const onGraphDown = (e) => {
            e.preventDefault();
            isPointerDown   = true;
            isDraggingGraph = false;
            graphHasMoved   = false;

            const {x, y} = getGraphCoords(e);
            startGraphX = x;
            startGraphY = y;

            const idx = selectNearestBand(x);
            selectBand(idx);
            if (idx === -1) {
                const hpf = getActiveHPF();
                initialBandFreq = hpf ? hpf.freq : 80;
                initialBandGain = 0;
            } else {
                initialBandFreq = currentBands[idx].freq;
                initialBandGain = currentBands[idx].gain;
            }
        };

        // ── POINTER MOVE ──────────────────────────────────────────────
        const onGraphMove = (e) => {
            if(!isPointerDown) return;   // ignore move when not pressing
            e.preventDefault();

            const {x, y} = getGraphCoords(e);
            const dx = x - startGraphX;
            const dy = y - startGraphY;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if(!isDraggingGraph) {
                if(dist > DRAG_THRESHOLD) {
                    isDraggingGraph = true;
                    graphHasMoved   = true;
                } else {
                    return; // still within tap zone
                }
            }

            const w = eqCanvasNode.width, h = eqCanvasNode.height;
            const minF = Math.log10(20), maxF = Math.log10(20000);
            const initX = ((Math.log10(initialBandFreq) - minF) / (maxF - minF)) * w;
            const newX  = Math.max(0, Math.min(w, initX + dx));

            if (selectedBandIndex === -1) {
                // Dragging HPF cutoff frequency (20 Hz - 1000 Hz)
                const hpf = getActiveHPF();
                if (hpf) {
                    const newFreq = Math.pow(10, minF + (newX / w) * (maxF - minF));
                    hpf.freq = Math.max(20, Math.min(1000, Math.round(newFreq)));
                    updateHPFUI();
                    updateKnobs();
                    drawEQGraph();
                    drawMiniEQ(activeChannelIdx);
                    if (typeof updateChannelEQFilters === 'function') {
                        updateChannelEQFilters(activeChannelIdx);
                    }
                    notifyEQChanged(false);
                }
                return;
            }

            const b = currentBands[selectedBandIndex];
            b.freq  = Math.max(20,  Math.min(20000, Math.pow(10, minF + (newX / w) * (maxF - minF))));
            b.gain  = Math.max(-15, Math.min(15, initialBandGain - (dy / (h / 2)) * 15));

            const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2)+'k' : Math.round(b.freq)+' Hz';
            setBoxVal(document.getElementById(`bx-f-${selectedBandIndex}`), freqStr);
            setBoxVal(document.getElementById(`bx-g-${selectedBandIndex}`), b.gain.toFixed(1));
            updateKnobs();
            drawEQGraph();
            drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') {
                updateChannelEQFilters(activeChannelIdx);
            }
            notifyEQChanged(false);
        };

        // ── POINTER UP ────────────────────────────────────────────────
        const onGraphUp = (e) => {
            if(!isPointerDown) return;
            isPointerDown   = false;
            isDraggingGraph = false;

            if(!graphHasMoved) {
                // Clean tap → check for double-tap
                const now        = Date.now();
                const tappedBand = selectedBandIndex;
                if(now - lastTapTime < 400 && lastTapBandIdx === tappedBand) {
                    resetBandGain(tappedBand);
                    lastTapTime    = 0;
                    lastTapBandIdx = -999;
                } else {
                    lastTapTime    = now;
                    lastTapBandIdx = tappedBand;
                }
            }
            graphHasMoved = false;
            notifyEQChanged(true);
        };

        eqCanvasNode.addEventListener('mousedown',  (e) => onGraphDown(e));
        eqCanvasNode.addEventListener('touchstart', (e) => onGraphDown(e), {passive: false});

        window.addEventListener('mousemove',  (e) => onGraphMove(e));
        window.addEventListener('touchmove',  (e) => onGraphMove(e), {passive: false});

        window.addEventListener('mouseup',  (e) => onGraphUp(e));
        window.addEventListener('touchend', (e) => onGraphUp(e));

        // Handle window resize for canvas redraw
        window.addEventListener('resize', () => {
            if(modal.style.display === 'flex') drawEQGraph();
        });

        // --- RTA Animation Loop (Espectro Real do Áudio no Canal) ---
        let rtaPeak = new Array(64).fill(0);
        let rtaSmooth = new Array(64).fill(0);
        let rtaTarget = new Array(64).fill(0);
        const rtaFreqData = new Uint8Array(512);

        function updateRTA() {
            const numBars = 64;
            const minF = Math.log10(20);
            const maxF = Math.log10(20000);

            const activeData = channelStripsData[activeChannelIdx];
            const isMuted = activeData && activeData.muteBtn.classList.contains('muted');
            const faderPct = activeData ? (parseFloat(activeData.faderCap.style.bottom) || 0) : 0;

            // Ganho do potenciômetro do canal ativo (70% = 0.0 dB / ganho 1.0)
            let potGain = 0;
            let potDb = -60;
            if (!isMuted && faderPct > 1.0) {
                if (faderPct >= 70) {
                    potGain = 1.0 + ((faderPct - 70) / 30) * 1.0;
                } else {
                    potGain = Math.pow(faderPct / 70, 2);
                }
                potDb = 20 * Math.log10(Math.max(0.0001, potGain));
            }

            // Flag explícita: true quando a fonte de áudio do canal é o gerador de ruído rosa
            let isPinkNoise = false;
            let activeAnalyser = null;

            // Identifica analisador de entrada de áudio real (player ou mic)
            const realInputAnalyser = (playerAnalyser && playerElement && !playerElement.paused)
                ? playerAnalyser
                : micAnalyser;

            const inputData = channelStripsData[0];
            const isInputMuted = inputData && inputData.muteBtn.classList.contains('muted');
            const inputFaderPct = (inputData && !isInputMuted) ? (parseFloat(inputData.faderCap.style.bottom) || 0) : 0;

            if (!isMuted && faderPct > 1.0) {
                // 1. Ruído Rosa ativo no canal atual (saídas 1 a 10)
                if (activeChannelIdx > 0 && activeData && activeData.noiseEnabled && activeData.rtaAnalyser) {
                    activeAnalyser = activeData.rtaAnalyser;
                    isPinkNoise = true;
                }
                // 2. Ou áudio real (player / mic / entrada externa) lido do Analyser pós-fader do canal
                else if (activeData && activeData.rtaAnalyser) {
                    // Se for canal de saída (1 a 10), só recebe áudio se a Entrada LR estiver aberta
                    if (activeChannelIdx === 0 || inputFaderPct > 1.0) {
                        activeAnalyser = activeData.rtaAnalyser;
                    }
                }
                else if (realInputAnalyser) {
                    if (activeChannelIdx === 0 || inputFaderPct > 1.0) {
                        activeAnalyser = realInputAnalyser;
                    }
                }
            }

            // Para ruído rosa: sinal ativo se o fader do canal estiver aberto
            // Para player/microfone: detecta via energia dos bins FFT pós-fader
            let hasAudioSignal = isPinkNoise && !isMuted && faderPct > 1.0;

            if (!isPinkNoise && activeAnalyser && audioCtx && audioCtx.state === 'running' && !isMuted && faderPct > 1.0) {
                activeAnalyser.getByteFrequencyData(rtaFreqData);
                let energySum = 0;
                for (let k = 0; k < rtaFreqData.length; k++) energySum += rtaFreqData[k];
                if (energySum > 100) {
                    hasAudioSignal = true;
                }
            } else if (isPinkNoise && activeAnalyser && audioCtx && audioCtx.state === 'running') {
                activeAnalyser.getByteFrequencyData(rtaFreqData);
            }

            const sampleRate = audioCtx ? audioCtx.sampleRate : 48000;
            const nyquist = sampleRate / 2;
            const binCount = rtaFreqData.length;

            for (let b = 0; b < numBars; b++) {
                if (hasAudioSignal && activeAnalyser && !isMuted && faderPct > 1.0) {
                    // Mapeamento logarítmico de 20 Hz a 20.000 Hz
                    const curLogF = minF + (b / numBars) * (maxF - minF);
                    const curF = Math.pow(10, curLogF);

                    let normLevel = 0;

                    // Resposta da curva do EQ Eight em dB na frequência exata desta barra
                    let eqDb = 0;
                    if (eqEnabled) {
                        const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[activeChannelIdx])
                            ? channelHPFState[activeChannelIdx] : null;
                        if (hpf && hpf.enabled) {
                            eqDb += getHPFResponseDb(curF, hpf);
                        }
                        currentBands.forEach(band => {
                            if (band.gain === 0) return;
                            const octDiff = Math.log2(curF / band.freq);
                            const bw = 1 / Math.max(0.1, band.q);
                            eqDb += band.gain * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                        });
                    }

                    // === 1. RUÍDO ROSA: curva plana modulada pelo EQ + ganho do potenciômetro ===
                    if (isPinkNoise) {
                        const jitterDb = Math.sin(b * 13.7 + Date.now() * 0.005) * 0.25 + (Math.random() - 0.5) * 0.3;
                        const totalDb = eqDb + potDb + jitterDb;
                        // 0dB (fader em 70%) = normLevel 0.50 (linha central de 0dB).
                        // +6dB = 0.70. -15dB = 0.0.
                        normLevel = Math.max(0, Math.min(1, 0.50 + (totalDb / 30)));
                    }
                    // === 2. ÁUDIO REAL (PLAYER OU MICROFONE): espectro FFT modulado pelo EQ e ganho do potenciômetro ===
                    else {
                        const centerBin = (curF / nyquist) * binCount;
                        const binLow = Math.max(0, Math.floor(centerBin - 1));
                        const binHigh = Math.min(binCount - 1, Math.ceil(centerBin + 1));
                        let binVal = 0;
                        let weightSum = 0;
                        for (let k = binLow; k <= binHigh; k++) {
                            const dist = Math.abs(k - centerBin);
                            const w = Math.max(0.1, 1 - dist * 0.5);
                            binVal += rtaFreqData[k] * w;
                            weightSum += w;
                        }
                        binVal = binVal / weightSum;

                        // FFT medido no Analyser pós-fader
                        const rawSignal = (binVal / 255);

                        // Modulação adicional proporcional ao ganho do potenciômetro (0dB = 0 offset, +6dB eleva, atenuação reduz)
                        const potOffset = (potDb / 30);
                        const eqOffset = (eqDb / 30);

                        // Em 0dB (fader em 70%), o sinal de áudio padrão fica em torno de 50% da altura (linha de 0dB)
                        const scaledSignal = rawSignal * 0.70;
                        const presence = Math.min(1.0, scaledSignal * 2.2);

                        normLevel = Math.max(0, Math.min(1, scaledSignal + (potOffset * 0.30) + (eqOffset * presence)));
                    }

                    rtaTarget[b] = Math.max(0, Math.min(1, normLevel));
                } else {
                    // Sem áudio no canal ou potenciômetro fechado/mutado -> barras zeram completamente
                    rtaTarget[b] = 0;
                }

                // Attack rápido, Decay suave (mais ágil durante ajustes manuais do EQ)
                const isActivelyAdjusting = (typeof isPointerDown !== 'undefined' && isPointerDown) || 
                                           (typeof isDragging !== 'undefined' && isDragging);
                const attack = isActivelyAdjusting ? 0.85 : 0.65;
                const decay  = isActivelyAdjusting ? 0.40 : 0.15;
                const speed  = rtaSmooth[b] < rtaTarget[b] ? attack : decay;
                rtaSmooth[b] += (rtaTarget[b] - rtaSmooth[b]) * speed;

                if (rtaSmooth[b] < 0.008) rtaSmooth[b] = 0;

                // Peak hold com decaimento que acompanha cortes do EQ
                if (rtaSmooth[b] > rtaPeak[b]) {
                    rtaPeak[b] = rtaSmooth[b];
                } else {
                    rtaPeak[b] = Math.max(0, Math.min(rtaPeak[b] - 0.005, rtaSmooth[b] + 0.12));
                }

                rtaBands[b] = rtaSmooth[b];
            }

            if (rtaEnabled && modal.style.display === 'flex') {
                drawEQGraph();
            }
            requestAnimationFrame(updateRTA);
        }
        updateRTA(); // Start loop always, drawing only when enabled

        closeModal.onclick = () => { modal.style.display = 'none'; };

        // ── Fader Vertical do Modal ─────────────────────────────────────
        // Converte pct (0-100) para dB display (70% = 0.0 dB exato)
        function pctToDbStr(pct) {
            if (pct <= 1) return '-∞ dB';
            let db = 0;
            if (pct >= 70) {
                const gain = 1.0 + ((pct - 70) / 30) * 1.0;
                db = 20 * Math.log10(gain);
            } else {
                const gain = Math.pow(pct / 70, 2);
                db = 20 * Math.log10(gain);
                if (db < -60) return '-∞ dB';
            }
            return (db >= 0 ? '+' : '') + db.toFixed(1) + ' dB';
        }

        // Sincroniza posição visual do fader do modal com o fader real do canal
        function syncModalFader(channelIdx) {
            const data = channelStripsData[channelIdx];
            if (!data) return;
            const pct = parseFloat(data.faderCap.style.bottom) || 0;
            const cap = document.getElementById('modal-fader-cap');
            const val = document.getElementById('modal-fader-val');
            if (cap) cap.style.bottom = pct + '%';
            if (val) val.textContent = pctToDbStr(pct);
        }

        // Lógica de drag do fader do modal
        const modalFaderTrack = document.getElementById('modal-fader-track');
        const modalFaderCap   = document.getElementById('modal-fader-cap');
        const modalFaderVal   = document.getElementById('modal-fader-val');
        let isModalFaderDragging = false;

        function getModalFaderPct(clientY) {
            const rect = modalFaderTrack.getBoundingClientRect();
            const pct = 1 - (clientY - rect.top) / rect.height;
            return Math.max(0, Math.min(1, pct)) * 100;
        }

        function applyModalFader(clientY, isFinal) {
            const valPct = getModalFaderPct(clientY);
            // Atualiza visualmente o fader do modal
            if (modalFaderCap) modalFaderCap.style.bottom = valPct + '%';
            if (modalFaderVal) modalFaderVal.textContent = pctToDbStr(valPct);
            // Atualiza o canal real (fader no mixer + áudio + VU)
            applyVolume(activeChannelIdx, valPct);
            sendVolumeSync(activeChannelIdx, Math.round(valPct * 10) / 10, isFinal);
        }

        // Mouse
        modalFaderTrack.addEventListener('pointerdown', (e) => {
            isModalFaderDragging = true;
            modalFaderTrack.setPointerCapture(e.pointerId);
            modalFaderCap && modalFaderCap.classList.add('dragging');
            applyModalFader(e.clientY, false);
            e.preventDefault();
        });
        window.addEventListener('pointermove', (e) => {
            if (!isModalFaderDragging) return;
            applyModalFader(e.clientY, false);
            e.preventDefault();
        });
        window.addEventListener('pointerup', (e) => {
            if (!isModalFaderDragging) return;
            isModalFaderDragging = false;
            modalFaderCap && modalFaderCap.classList.remove('dragging');
            applyModalFader(e.clientY, true);
        });

        // Touch
        modalFaderTrack.addEventListener('touchstart', (e) => {
            isModalFaderDragging = true;
            modalFaderCap && modalFaderCap.classList.add('dragging');
            applyModalFader(e.touches[0].clientY, false);
            e.preventDefault();
        }, { passive: false });
        modalFaderTrack.addEventListener('touchmove', (e) => {
            if (!isModalFaderDragging) return;
            applyModalFader(e.touches[0].clientY, false);
            e.preventDefault();
        }, { passive: false });
        modalFaderTrack.addEventListener('touchend', (e) => {
            if (!isModalFaderDragging) return;
            isModalFaderDragging = false;
            modalFaderCap && modalFaderCap.classList.remove('dragging');
            const t = e.changedTouches[0];
            applyModalFader(t.clientY, true);
        }, { passive: false });


        // ── Drawing Mini EQ Curves (Retina / Mobile Crisp) ─────────
        function drawMiniEQ(chIdx) {
            const data = channelStripsData[chIdx];
            if (!data) return;
            const canvas = data.eqCanvas;
            const ctx = data.eqCtx;
            if (!canvas || !ctx) return;

            const w = 70, h = 32;
            const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
            const tw = Math.round(w * dpr);
            const th = Math.round(h * dpr);
            if (canvas.width !== tw || canvas.height !== th) {
                canvas.width = tw;
                canvas.height = th;
            }
            if (ctx.resetTransform) ctx.resetTransform();
            else ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, w, h);

            const bands = channelEQState[chIdx] || defaultBands;
            const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[chIdx]) 
                ? channelHPFState[chIdx] : null;
            const isEqOn = (typeof channelEQEnabled !== 'undefined' && channelEQEnabled[chIdx] !== undefined)
                ? channelEQEnabled[chIdx] : true;
            const minF = Math.log10(20), maxF = Math.log10(20000);

            ctx.fillStyle = "rgba(255, 136, 0, 0.2)";
            ctx.strokeStyle = "#FF8800";
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(0, h/2);
            for (let px = 0; px <= w; px++) {
                const curLogF = minF + (px / w) * (maxF - minF);
                const curF = Math.pow(10, curLogF);
                let totalDb = 0;
                if (isEqOn) {
                    if (hpf && hpf.enabled) {
                        totalDb += getHPFResponseDb(curF, hpf);
                    }
                    bands.forEach(b => {
                        if (b.gain === 0) return;
                        const octDiff = Math.log2(curF / b.freq);
                        const bw = 1 / b.q;
                        totalDb += b.gain * Math.exp(-Math.pow(octDiff, 2) / (2 * Math.pow(bw, 2)));
                    });
                }
                let y = h/2 - (totalDb / 15) * (h/2);
                y = Math.max(0, Math.min(h, y));
                ctx.lineTo(px, y);
            }
            ctx.stroke();
        }

        // ── Apply Remote Updates ──────────────────────────────────────
        function applyVolume(idx, valPct) {
            const data = channelStripsData[idx];
            if (!data) return;
            const clamped = Math.max(0, Math.min(100, valPct));
            data.faderCap.style.bottom = clamped + '%';
            if (data.volReadout && typeof pctToDbStr === 'function') {
                data.volReadout.textContent = pctToDbStr(clamped);
            }
            
            // Atualiza o ganho do fader no grafo de áudio do mixer
            updateChannelFaderGain(idx);

            // Sincroniza o fader do modal se o EQ estiver aberto neste canal
            if (modal.style.display === 'flex' && idx === activeChannelIdx) {
                const cap = document.getElementById('modal-fader-cap');
                const val = document.getElementById('modal-fader-val');
                if (cap) cap.style.bottom = clamped + '%';
                if (val && typeof pctToDbStr === 'function') val.textContent = pctToDbStr(clamped);
            }
        }


        function applyMute(idx, isMuted) {
            const data = channelStripsData[idx];
            if (!data) return;
            if (isMuted) {
                data.muteBtn.classList.add('muted');
                data.meterFill.classList.add('muted');
                if (data.pill) data.pill.classList.add('is-muted');
                if (data.volReadout) data.volReadout.classList.add('muted');
            } else {
                data.muteBtn.classList.remove('muted');
                data.meterFill.classList.remove('muted');
                if (data.pill) data.pill.classList.remove('is-muted');
                if (data.volReadout) data.volReadout.classList.remove('muted');
            }
            
            // Atualiza o ganho do fader considerando o mute
            updateChannelFaderGain(idx);
        }

        function applyName(idx, name) {
            const data = channelStripsData[idx];
            if (!data) return;
            if (data.channelInput.value !== name) {
                data.channelInput.value = name;
            }
            if (modal.style.display === 'flex') {
                if (activeChannelIdx === idx) {
                    modalTitle.textContent = "EQ Eight - " + name;
                }
                renderChannelSelector(activeChannelIdx);
            }
        }

        // ── Throttled Volume Sync ─────────────────────────────────────
        let lastVolSendTime = 0;
        let volSendTimer = null;
        function sendVolumeSync(channel, valPct, isFinal = false) {
            const now = Date.now();
            const valRounded = Math.round(valPct * 10) / 10;
            if (isFinal) {
                if (volSendTimer) clearTimeout(volSendTimer);
                sendSync({ type: 'volume', channel, value: valRounded });
                return;
            }
            if (now - lastVolSendTime > 35) {
                lastVolSendTime = now;
                sendSync({ type: 'volume', channel, value: valRounded });
            } else {
                if (volSendTimer) clearTimeout(volSendTimer);
                volSendTimer = setTimeout(() => {
                    sendSync({ type: 'volume', channel, value: valRounded });
                }, 35);
            }
        }

        // Generate mixer channels (LR Entrada + Ch 1 to Ch 10 Saídas)
        for (let i = 0; i < 11; i++) {
            const isInput = i === 0;
            const channelNumber = isInput ? "LR" : `${i}`;
            const defaultName = isInput ? "Entrada" : `Ch ${i}`;
            
            const strip = document.createElement('div');
            strip.className = `channel-strip ${isInput ? 'main-strip' : ''}`;
            
            strip.innerHTML = `
                <div class="eq-display" title="Abrir EQ Eight">
                    <canvas class="eq-canvas" width="70" height="32"></canvas>
                </div>
                <button class="mute-btn">Mute</button>
                <div class="fader-vol-readout" title="Toque para resetar para 0.0 dB">+0.0 dB</div>
                <div class="fader-area">
                    <div class="meter-bg">
                        <div class="meter-clip line1"></div>
                        <div class="meter-clip line2"></div>
                        <div class="meter-fill" style="height: 100%"></div>
                    </div>
                    <div class="fader-track"></div>
                    <div class="scale-marks">
                        <span style="top: 0%;">+6</span>
                        <span style="top: 15%;">+3</span>
                        <span class="scale-mark-0u" style="top: 30%;">0 U</span>
                        <span style="top: 45%;">-5</span>
                        <span style="top: 58%;">-10</span>
                        <span style="top: 70%;">-20</span>
                        <span style="top: 80%;">-30</span>
                        <span style="top: 90%;">-50</span>
                        <span style="top: 100%;">-∞</span>
                    </div>
                    <div class="fader-track-touch">
                        <div class="fader-track-line"></div>
                        <div class="fader-track-mark-0db"></div>
                        <div class="fader-cap" style="bottom: 70%;"></div>
                    </div>
                </div>
                <div class="channel-label-container">
                    <span class="channel-number">${channelNumber}</span>
                    <input type="text" class="channel-input" value="${defaultName}" ${isInput ? 'readonly' : ''} maxlength="10">
                </div>
            `;
            
            const muteBtn = strip.querySelector('.mute-btn');
            const meterFill = strip.querySelector('.meter-fill');
            const eqDisplay = strip.querySelector('.eq-display');
            const eqCanvas = strip.querySelector('.eq-canvas');
            const faderArea = strip.querySelector('.fader-area');
            const faderTouch = strip.querySelector('.fader-track-touch');
            const faderCap = strip.querySelector('.fader-cap');
            const volReadout = strip.querySelector('.fader-vol-readout');
            const channelInput = strip.querySelector('.channel-input');
            const ctx = eqCanvas.getContext('2d');

            // Quick channel ribbon pill (navegação rápida no celular e desktop)
            const ribbon = document.getElementById('channel-ribbon');
            let pill = null;
            if (ribbon) {
                pill = document.createElement('button');
                pill.className = `ribbon-pill ${isInput ? 'active' : ''}`;
                pill.setAttribute('data-ch', i);
                const labelText = isInput ? "LR" : `${channelNumber}: ${defaultName}`;
                pill.innerHTML = `<span class="ribbon-dot"></span><span class="ribbon-text">${labelText}</span>`;
                pill.onclick = () => {
                    strip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                    document.querySelectorAll('.ribbon-pill').forEach((p, idx) => p.classList.toggle('active', idx === i));
                    document.querySelectorAll('.channel-strip').forEach((s, idx) => s.classList.toggle('active-focused', idx === i));
                };
                ribbon.appendChild(pill);
            }

            channelStripsData[i] = {
                strip,
                pill,
                muteBtn,
                meterFill,
                volReadout,
                faderCap,
                faderTouch,
                faderArea,
                channelInput,
                eqCanvas,
                eqCtx: ctx
            };
            
            eqDisplay.addEventListener('click', () => {
                ensureAudioCtx();
                const customName = channelInput.value;
                modalTitle.textContent = "EQ Eight - " + customName;
                initModal(i);
                modal.style.display = 'flex';
                setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
            });
            
            muteBtn.addEventListener('click', () => {
                const willBeMuted = !muteBtn.classList.contains('muted');
                applyMute(i, willBeMuted);
                sendSync({ type: 'mute', channel: i, value: willBeMuted });
            });

            // Toque no display de dB reseta para Unity Gain (0.0 dB / 70%)
            if (volReadout) {
                volReadout.addEventListener('click', () => {
                    applyVolume(i, 70);
                    sendVolumeSync(i, 70, true);
                });
            }
            
            function getTouchY(e) {
                if (e.touches && e.touches.length > 0) return e.touches[0].clientY;
                if (e.changedTouches && e.changedTouches.length > 0) return e.changedTouches[0].clientY;
                return e.clientY;
            }

            function updateFaderFromY(clientY, isFinal = false) {
                if (clientY === undefined || clientY === null || isNaN(clientY)) return;
                const rect = faderTouch.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
                const valPct = (1 - pct) * 100;
                applyVolume(i, valPct);
                sendVolumeSync(i, valPct, isFinal);
            }

            let isDraggingFader = false;

            // Touch events específicos para telas de celular em toda a coluna do fader
            faderArea.addEventListener('touchstart', (e) => {
                isDraggingFader = true;
                e.preventDefault();
                updateFaderFromY(getTouchY(e), false);
            }, { passive: false });

            faderArea.addEventListener('touchmove', (e) => {
                if (isDraggingFader) {
                    e.preventDefault();
                    updateFaderFromY(getTouchY(e), false);
                }
            }, { passive: false });

            faderArea.addEventListener('touchend', (e) => {
                if (isDraggingFader) {
                    isDraggingFader = false;
                    e.preventDefault();
                    updateFaderFromY(getTouchY(e), true);
                }
            }, { passive: false });

            faderArea.addEventListener('touchcancel', () => {
                isDraggingFader = false;
            });

            // Pointer / Mouse events para computador
            faderArea.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'touch') return;
                isDraggingFader = true;
                faderArea.setPointerCapture(e.pointerId);
                updateFaderFromY(e.clientY, false);
            });
            faderArea.addEventListener('pointermove', (e) => {
                if (e.pointerType === 'touch') return;
                if (isDraggingFader) updateFaderFromY(e.clientY, false);
            });
            faderArea.addEventListener('pointerup', (e) => {
                if (e.pointerType === 'touch') return;
                if (isDraggingFader) {
                    isDraggingFader = false;
                    updateFaderFromY(e.clientY, true);
                }
            });
            faderArea.addEventListener('pointercancel', () => {
                isDraggingFader = false;
            });

            channelInput.addEventListener('input', () => {
                if (pill) {
                    const textSpan = pill.querySelector('.ribbon-text') || pill;
                    textSpan.textContent = isInput ? "LR" : `${channelNumber}: ${channelInput.value}`;
                }
                if (modal.style.display === 'flex') {
                    if (activeChannelIdx === i) {
                        modalTitle.textContent = "EQ Eight - " + channelInput.value;
                    }
                    renderChannelSelector(activeChannelIdx);
                }
                sendSync({ type: 'name', channel: i, value: channelInput.value });
            });
            
            mixerContainer.appendChild(strip);
            drawMiniEQ(i);
        }

        // Inicializa o grafo Web Audio se o contexto já estiver ativo
        if (audioCtx) {
            initMixerAudioGraph();
        }

        // Sincronização da barra de atalhos rápidos com o scroll horizontal no celular
        const mixerWrapper = document.querySelector('.mixer-wrapper');
        if (mixerWrapper) {
            let scrollDebounce = null;
            mixerWrapper.addEventListener('scroll', () => {
                if (scrollDebounce) cancelAnimationFrame(scrollDebounce);
                scrollDebounce = requestAnimationFrame(() => {
                    const center = mixerWrapper.scrollLeft + mixerWrapper.clientWidth / 2;
                    let closestIdx = 0;
                    let minDiff = Infinity;
                    channelStripsData.forEach((chData, idx) => {
                        if (!chData || !chData.strip) return;
                        const stripCenter = chData.strip.offsetLeft + chData.strip.offsetWidth / 2;
                        const diff = Math.abs(stripCenter - center);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestIdx = idx;
                        }
                    });
                    document.querySelectorAll('.ribbon-pill').forEach((p, idx) => {
                        const isActive = idx === closestIdx;
                        p.classList.toggle('active', isActive);
                        if (isActive && p.scrollIntoView) {
                            p.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                        }
                    });
                });
            }, { passive: true });
        }

        // ── Processador Central de Mensagens Recebidas ────────────────
        function handleIncomingMessage(msgType, data) {
            if (!data) return;

            if (msgType === 'clients_count') {
                setSyncStatus(true, data.count);
                return;
            }

            if (msgType === 'init') {
                setSyncStatus(true);
                const channels = data.channels || (data.data && data.data.channels);
                if (channels) {
                    channels.forEach((ch, idx) => {
                        if (channelStripsData[idx]) {
                            applyVolume(idx, ch.volume);
                            applyMute(idx, ch.mute);
                            applyName(idx, ch.name);
                            if (ch.bands) channelEQState[idx] = ch.bands;
                            if (ch.hpf) channelHPFState[idx] = ch.hpf;
                            drawMiniEQ(idx);
                        }
                    });
                }
                return;
            }

            if (msgType === 'update') {
                const payload = data.data || data;
                if (!payload || payload.clientId === CLIENT_ID) return; // ignora eco local

                const ch = payload.channel;
                if (payload.type === 'volume') {
                    applyVolume(ch, payload.value);
                } else if (payload.type === 'mute') {
                    applyMute(ch, payload.value);
                } else if (payload.type === 'name') {
                    applyName(ch, payload.value);
                } else if (payload.type === 'pink_noise') {
                    if (payload.value) {
                        channelPinkOn(ch);
                    } else {
                        channelPinkOff(ch);
                    }
                    if (modal.style.display === 'flex' && activeChannelIdx === ch) {
                        updatePinkNoiseButton();
                    }
                } else if (payload.type === 'eq') {
                    if (payload.hpf && channelHPFState[ch]) {
                        channelHPFState[ch] = payload.hpf;
                    }
                    if (payload.bands && channelEQState[ch]) {
                        channelEQState[ch] = payload.bands;
                        if (payload.enabled !== undefined) {
                            channelEQEnabled[ch] = payload.enabled;
                        }
                        if (typeof updateChannelEQFilters === 'function') {
                            updateChannelEQFilters(ch);
                        }
                        drawMiniEQ(ch);
                        if (modal.style.display === 'flex' && activeChannelIdx === ch) {
                            currentBands = channelEQState[ch];
                            if (payload.enabled !== undefined) {
                                eqEnabled = payload.enabled;
                                eqOnBtn.textContent = eqEnabled ? 'EQ: On' : 'EQ: Off';
                                eqOnBtn.style.background = eqEnabled ? '#FF9900' : '#555';
                                eqOnBtn.style.color = eqEnabled ? '#000' : '#FFF';
                            }
                            updateHPFUI();
                            currentBands.forEach((b, k) => {
                                const freqStr = b.freq >= 1000 ? (b.freq/1000).toFixed(2)+'k' : Math.round(b.freq)+' Hz';
                                setBoxVal(document.getElementById(`bx-f-${k}`), freqStr);
                                setBoxVal(document.getElementById(`bx-g-${k}`), b.gain.toFixed(1));
                                setBoxVal(document.getElementById(`bx-q-${k}`), b.q.toFixed(1));
                            });
                            updateKnobs();
                            drawEQGraph();
                        }
                    }
                }
            }
        }

        // ── Conexão em Tempo Real (WebSocket Primário + SSE Fallback) ─
        function connectRealtime() {
            const host = window.location.host || 'localhost:8080';
            const wsProtocol = (window.location.protocol === 'https:') ? 'wss://' : 'ws://';
            const wsUrl = `${wsProtocol}${host}/ws`;

            let wsConnected = false;

            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    wsConnected = true;
                    console.log("[WS] Conectado ao servidor!");
                    setSyncStatus(true);
                };

                ws.onmessage = (e) => {
                    try {
                        const parsed = JSON.parse(e.data);
                        handleIncomingMessage(parsed.type, parsed.data || parsed);
                    } catch (err) {
                        console.error("[WS] Erro parsing:", err);
                    }
                };

                ws.onclose = () => {
                    console.warn("[WS] Conexão fechada. Reconectando em 2s...");
                    setSyncStatus(false);
                    setTimeout(connectRealtime, 2000);
                };

                ws.onerror = () => {
                    if (!wsConnected) {
                        console.warn("[WS] Falha na conexão WebSocket, ativando fallback SSE...");
                        initSSEFallback();
                    }
                };
            } catch (e) {
                initSSEFallback();
            }
        }

        function initSSEFallback() {
            if (sse) return;
            try {
                sse = new EventSource('/events');
                sse.addEventListener('init', (e) => handleIncomingMessage('init', JSON.parse(e.data)));
                sse.addEventListener('update', (e) => handleIncomingMessage('update', JSON.parse(e.data)));
                sse.addEventListener('clients_count', (e) => handleIncomingMessage('clients_count', JSON.parse(e.data)));
                sse.onopen = () => setSyncStatus(true);
                sse.onerror = () => setSyncStatus(false);
            } catch (err) {
                console.error("SSE Fallback falhou:", err);
            }
        }

        connectRealtime();
    </script>
