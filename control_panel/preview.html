<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Audio Mixer Preview</title>
        <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background-color: #121316;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Top Navigation App Bar */
        .app-header {
            height: 48px;
            background: #191a1f;
            border-bottom: 1px solid #2a2c34;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            flex-shrink: 0;
            z-index: 100;
            gap: 8px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .mixer-logo {
            font-size: 18px;
            filter: drop-shadow(0 0 4px rgba(255, 153, 0, 0.4));
        }
        .mixer-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #eeeeee;
            white-space: nowrap;
        }

        /* Sync Status Badge */
        .sync-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(26, 28, 34, 0.95);
            border: 1px solid #3d414d;
            border-radius: 14px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: #00ff66;
            box-shadow: 0 1px 4px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #00ff66;
            box-shadow: 0 0 6px #00ff66;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .sync-badge.disconnected {
            color: #ff4444;
            border-color: #772222;
        }
        .sync-badge.disconnected .status-dot {
            background-color: #ff4444;
            box-shadow: 0 0 6px #ff4444;
        }

        /* Player de Áudio */
        .audio-player-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #23252d;
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid #383b45;
            max-width: 480px;
            overflow: hidden;
        }
        .player-load-btn {
            background: #ff9900;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .player-load-btn:hover { background: #ffaa22; }
        .player-load-btn:active { transform: scale(0.96); }

        .player-demo-btn {
            background: #333640;
            color: #ffaa33;
            border: 1px solid #484d5c;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .player-demo-btn:hover { background: #3f4350; }
        .player-demo-btn:active { transform: scale(0.96); }

        .player-play-btn {
            background: #2b2e38;
            color: #00ff88;
            border: 1px solid #484d5c;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            width: 28px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .player-play-btn:hover:not(:disabled) { background: #3c404e; }
        .player-play-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .player-info-container {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 80px;
            overflow: hidden;
        }
        .player-track-name {
            font-size: 10px;
            font-weight: bold;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-time {
            font-size: 9px;
            color: #888;
            font-family: monospace;
        }
        .player-progress-bar {
            width: 60px;
            height: 5px;
            background: #17181c;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        .player-progress-fill {
            height: 100%;
            width: 0%;
            background: #00ff88;
            transition: width 0.1s linear;
        }

        /* Barra de Navegação Rápida entre Canais */
        .channel-nav-ribbon {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 6px;
            padding: 6px 10px;
            background: #16171b;
            border-bottom: 1px solid #23252d;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex-shrink: 0;
            z-index: 50;
        }
        .channel-nav-ribbon::-webkit-scrollbar {
            display: none;
        }
        .ribbon-pill {
            flex: 0 0 auto;
            min-width: 44px;
            height: 36px;
            padding: 0 10px;
            background: #25272e;
            border: 1px solid #3c3f4a;
            border-radius: 18px;
            color: #cfd3dc;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.12s ease;
            outline: none;
            font-family: inherit;
        }
        .ribbon-pill:hover {
            background: #31343e;
            border-color: #555a68;
            color: #fff;
        }
        .ribbon-pill:active {
            transform: scale(0.95);
        }
        .ribbon-pill.active {
            background: #ff9900;
            color: #000;
            border-color: #ffaa22;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.55);
            font-weight: 800;
        }
        .ribbon-pill[data-ch="0"] {
            border-color: #ff7700;
            color: #ffaa44;
        }
        .ribbon-pill[data-ch="0"].active {
            background: #ff7700;
            color: #000;
            border-color: #ff9900;
        }
        .ribbon-pill.is-muted {
            border-color: #ff3344 !important;
            color: #ff4455 !important;
        }
        .ribbon-pill.is-muted::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff2233;
            box-shadow: 0 0 5px #ff2233;
        }
        .ribbon-pill .ribbon-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: transparent;
            display: none;
        }
        .ribbon-pill.pink-noise-active {
            border-color: #ff0055 !important;
            color: #ff0055 !important;
        }
        .ribbon-pill.pink-noise-active .ribbon-dot {
            display: inline-block;
            background-color: #ff0055 !important;
            box-shadow: 0 0 6px #ff0055;
        }

        /* Mixer horizontal container & channels */
        .mixer-wrapper {
            flex: 1;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 8px 10px;
            box-sizing: border-box;
            display: flex;
            align-items: stretch;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
            scrollbar-color: #383b46 transparent;
        }
        .mixer-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .mixer-wrapper::-webkit-scrollbar-thumb {
            background: #383b46;
            border-radius: 3px;
        }
        .mixer-container {
            display: inline-flex;
            background-color: #17181c;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #23252d;
            gap: 6px;
            height: 100%;
            min-height: 420px;
            box-sizing: border-box;
        }
        .channel-strip {
            width: 86px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #24262d 0%, #191b20 100%);
            border: 1px solid #343742;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .channel-strip.active-focused {
            border-color: #ff9900 !important;
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.4);
        }
        .main-strip {
            background: linear-gradient(180deg, #322216 0%, #1c140e 100%);
            border: 1.5px solid #ff7700;
            box-shadow: 0 4px 12px rgba(255, 119, 0, 0.2);
        }

        .eq-display {
            background-color: #0c0d11;
            border: 1px solid #262933;
            border-radius: 4px;
            margin: 4px 4px 0 4px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }
        .eq-display:hover { border-color: #ff9900; }
        .eq-canvas { width: 100%; height: 100%; pointer-events: none; }

        .mute-btn {
            background: linear-gradient(180deg, #32353d 0%, #202227 100%);
            border: 1px solid #141518;
            border-radius: 4px;
            color: #a0a6b2;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.8px;
            height: 30px;
            margin: 4px 4px 2px 4px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .mute-btn:hover {
            background: linear-gradient(180deg, #3a3e47 0%, #292c33 100%);
            color: #c8ceda;
        }
        .mute-btn:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }
        .mute-btn.muted {
            background: linear-gradient(180deg, #e6202f 0%, #9e101c 100%);
            color: #ffffff;
            border-color: #610910;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 12px rgba(230, 32, 47, 0.75);
            text-shadow: 0 0 4px rgba(255,255,255,0.7);
        }

        /* Real-Time Volume Readout Badge */
        .fader-vol-readout {
            font-size: 10px;
            font-weight: 800;
            color: #ff9900;
            font-family: monospace, sans-serif;
            text-align: center;
            background: #0d0f13;
            border: 1px solid #282a33;
            border-radius: 4px;
            margin: 2px 4px;
            padding: 2px 0;
            cursor: pointer;
            touch-action: manipulation;
            letter-spacing: 0.5px;
            transition: all 0.1s ease;
        }
        .fader-vol-readout:hover {
            border-color: #ff9900;
            background: #14171d;
        }
        .fader-vol-readout:active {
            transform: scale(0.95);
            background: #222630;
        }
        .fader-vol-readout.muted {
            color: #ff4444;
            opacity: 0.6;
            text-decoration: line-through;
        }

        /* Fader & Meter Column */
        .fader-area {
            background-color: #0a0b0e;
            border: 1px solid #202229;
            border-radius: 6px;
            margin: 2px 4px;
            flex: 1;
            position: relative;
            min-height: 220px;
            display: flex;
            overflow: hidden;
            touch-action: none;
            cursor: pointer;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        .main-strip .fader-area {
            border: 1.5px solid #ff7700;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 8px rgba(255,119,0,0.25);
        }

        .meter-bg {
            position: absolute;
            left: 6px;
            top: 10px;
            bottom: 10px;
            width: 10px;
            background: linear-gradient(to top, 
                #00b020 0%, #00d028 55%, 
                #ffb800 68%, #ff9900 80%, 
                #ff2a1a 92%, #ff0000 100%);
            border-radius: 2px;
            border: 1px solid #111215;
            box-shadow: inset 0 0 3px rgba(0,0,0,0.9);
            overflow: hidden;
            pointer-events: none;
        }
        .meter-fill {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 100%;
            background: #0a0b0e;
            transition: height 0.04s linear;
        }
        .meter-fill.muted {
            height: 100% !important;
        }
        .meter-clip.line1 {
            position: absolute;
            left: 0;
            right: 0;
            top: 3px;
            height: 1px;
            background: rgba(0,0,0,0.6);
            z-index: 2;
        }
        .meter-clip.line2 {
            position: absolute;
            left: 0;
            right: 0;
            top: 7px;
            height: 1px;
            background: rgba(0,0,0,0.6);
            z-index: 2;
        }

        .scale-marks {
            position: absolute;
            right: 4px;
            top: 10px;
            bottom: 10px;
            width: 22px;
            pointer-events: none;
            font-size: 8px;
            font-weight: bold;
            color: #ffffff;
            font-family: monospace, sans-serif;
            opacity: 0.8;
        }
        .scale-marks span {
            position: absolute;
            right: 0;
            transform: translateY(-50%);
            line-height: 1;
            white-space: nowrap;
        }
        .scale-mark-0u {
            color: #ff9900 !important;
            font-weight: 800 !important;
            text-shadow: 0 0 6px rgba(255, 153, 0, 0.7);
        }

        .fader-track {
            display: none;
        }

        .fader-track-touch {
            position: absolute;
            left: 18px;
            right: 2px;
            top: 10px;
            bottom: 10px;
            cursor: pointer;
            touch-action: none;
            user-select: none;
            z-index: 5;
        }

        .fader-track-line {
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #050608;
            border: 1px solid #1a1b20;
            border-radius: 2px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        .fader-track-mark-0db {
            position: absolute;
            left: 6px;
            right: 22px;
            height: 2px;
            background: #ff9900;
            box-shadow: 0 0 6px rgba(255, 153, 0, 0.8);
            border-radius: 1px;
            bottom: 70%;
            pointer-events: none;
            z-index: 2;
        }

        .fader-cap {
            position: absolute;
            left: 22px;
            transform: translate(-50%, 50%);
            width: 30px;
            height: 56px;
            background-image: url('fader_knob.svg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.85)) drop-shadow(0 1px 3px rgba(0,0,0,0.6));
            cursor: grab;
            z-index: 10;
            transition: filter 0.1s ease;
        }
        .fader-cap:active, .fader-cap.dragging {
            cursor: grabbing;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95)) drop-shadow(0 0 8px rgba(255, 153, 0, 0.7));
        }

        .channel-label-container {
            height: 50px;
            background-color: #17181c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3px;
            border-top: 1px solid #282a32;
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
        }
        .main-strip .channel-label-container {
            background-color: #26170d;
            border-top: 1px solid #ff7700;
        }
        .channel-number {
            font-size: 10px;
            font-weight: 800;
            color: #a0a6b2;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .main-strip .channel-number {
            color: #ff9900;
        }
        .channel-input {
            width: 92%;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            background-color: #23252d;
            border: 1px solid #3a3d48;
            border-radius: 4px;
            padding: 3px 2px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: inherit;
        }
        .channel-input:focus {
            outline: none;
            border-color: #ff9900;
            background-color: #2b2e38;
        }
        .main-strip .channel-input {
            background-color: transparent;
            border: none;
            color: #ffaa33;
            pointer-events: none;
            font-weight: 800;
        }

        .channel-strip.pink-noise-active {
            border-color: #ff0055 !important;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.45);
        }

        /* Parametric EQ Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 1000;
            padding-top: 3vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .modal-content {
            background: #202126;
            border-radius: 10px;
            border: 1px solid #333640;
            width: 96%;
            max-width: 820px;
            color: #b3b3b3;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            font-family: inherit;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .close-btn {
            background: #333640;
            border: 1px solid #484d5c;
            color: #ffffff;
            height: 38px;
            padding: 0 18px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            touch-action: manipulation;
            user-select: none;
            transition: transform 0.05s, background 0.1s;
        }
        .close-btn:hover { background: #3f4350; }
        .close-btn:active { transform: scale(0.95); }

        .ch-selector-row {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 6px;
            margin-bottom: 8px;
            padding: 6px 8px;
            background: #15161a;
            border-radius: 6px;
            border: 1px solid #282a33;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .ch-selector-row::-webkit-scrollbar { display: none; }
        .ch-btn {
            flex: 0 0 auto;
            min-width: 44px;
            height: 36px;
            padding: 0 10px;
            background: #25272e;
            border: 1px solid #3d414e;
            border-radius: 6px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            transition: all 0.1s ease;
        }
        .ch-btn:active { transform: scale(0.95); }
        .ch-btn.active {
            background: #ff9900;
            color: #000;
            border-color: #ffaa22;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.6);
            font-weight: 800;
        }

        .eq-graph-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: stretch;
        }
        .eq-graph-container {
            height: 220px;
            background-color: #0c0d10;
            border: 1px solid #282a33;
            position: relative;
            border-radius: 6px;
            flex: 1;
        }
        .eq-main-canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 6px;
        }

        /* Lateral Fader in EQ Modal */
        .modal-fader-panel {
            width: 60px;
            min-height: 220px;
            background: #141519;
            border: 1px solid #2a2d37;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6px 3px;
            gap: 4px;
            flex-shrink: 0;
        }
        .modal-fader-label {
            font-size: 9px;
            font-weight: 800;
            color: #888;
            letter-spacing: 0.5px;
        }
        .modal-fader-val {
            font-size: 10px;
            font-weight: 800;
            color: #ff9900;
            text-align: center;
            background: #0d0e12;
            border: 1px solid #2a2c35;
            border-radius: 4px;
            padding: 2px 4px;
            min-width: 46px;
            font-family: monospace;
            flex-shrink: 0;
        }
        .modal-fader-track-area {
            flex: 1;
            width: 100%;
            position: relative;
            cursor: pointer;
            touch-action: none;
            min-height: 120px;
        }
        .modal-fader-track-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            margin-left: -2px;
            background: #050608;
            border-radius: 2px;
            border: 1px solid #1a1b20;
        }
        .modal-fader-mark-0db {
            position: absolute;
            left: 4px;
            right: 4px;
            height: 2px;
            background: #ff9900;
            box-shadow: 0 0 6px rgba(255,153,0,0.8);
            border-radius: 1px;
            bottom: 70%;
            pointer-events: none;
            z-index: 2;
        }
        .modal-fader-scale {
            position: absolute;
            right: 2px;
            top: 0;
            bottom: 0;
            width: 18px;
            pointer-events: none;
            font-size: 8px;
            font-weight: bold;
            font-family: monospace, sans-serif;
            color: #666;
            user-select: none;

<body>

    <!-- Header Superior com Logo e Status de Conexão -->

    </nav>

    <script>
        const CLIENT_ID = 'client_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
        const channelStripsData = [];
        let ws = null;
        let sse = null;

        function setSyncStatus(connected, count = null) {
            const badge = document.getElementById('sync-badge');
            const text = document.getElementById('sync-text');
            if (!badge || !text) return;
            if (connected) {
                badge.classList.remove('disconnected');
                if (count !== null) {
                    if (count >= 2) {
                        badge.style.color = '#00ff66';
                        badge.style.borderColor = '#00ff66';
                        text.textContent = `🟢 Sincronizado (${count} aparelhos)`;
                    } else {
                        badge.style.color = '#ffcc00';
                        badge.style.borderColor = '#ffcc00';
                        text.textContent = `🟡 1 aparelho (conecte o outro)`;
                    }
                } else {
                    text.textContent = '🟢 Conectado';
                }
            } else {
                badge.classList.add('disconnected');
                badge.style.color = '#ff4444';
                badge.style.borderColor = '#772222';
                text.textContent = '🔴 Reconectando...';
            }
        }

        function sendSync(payload) {
            payload.clientId = CLIENT_ID;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            } else {
                fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => setSyncStatus(false));
            }
        }

        let eqSyncTimer = null;
        function notifyEQChanged(immediate = false) {
            if (typeof drawMiniEQ === 'function') drawMiniEQ(activeChannelIdx);
            if (typeof updateChannelEQFilters === 'function') updateChannelEQFilters(activeChannelIdx);
            if (eqSyncTimer) clearTimeout(eqSyncTimer);
            const payload = {
                type: 'eq',
                channel: activeChannelIdx,
                bands: currentBands,
                enabled: eqEnabled,
                hpf: (typeof channelHPFState !== 'undefined') ? channelHPFState[activeChannelIdx] : undefined
            };
            if (immediate) {
                sendSync(payload);
            } else {
                eqSyncTimer = setTimeout(() => sendSync(payload), 40);
            }
        }

        const mixerContainer = document.getElementById('mixer');
        const modal = document.getElementById('eq-modal');
        const closeModal = document.getElementById('close-modal');
        const modalTitle = document.getElementById('modal-title');
        const rtaBtn = document.getElementById('rta-btn');
        const hpfBtn = document.getElementById('hpf-btn');
        
        let currentBands = [];
        let selectedBandIndex = 3; 
        let rtaEnabled = true;
        let eqEnabled = true;
        let rtaBands = new Array(64).fill(0);

        rtaBtn.onclick = () => {
            rtaEnabled = !rtaEnabled;
            rtaBtn.textContent = rtaEnabled ? 'RTA: On' : 'RTA: Off';
            rtaBtn.style.background = rtaEnabled ? '#FF9900' : '#555';
            rtaBtn.style.color = rtaEnabled ? '#000' : '#FFF';
            if(!rtaEnabled) drawEQGraph();
        };

        if (hpfBtn) {
            hpfBtn.onclick = () => {
                if (typeof toggleHPF === 'function') toggleHPF();
            };
        }

        // ─── Motor de Áudio: VU Meter Reativo + Ruído Rosa + EQ em Tempo Real ─
        let audioCtx          = null;
        let micAnalyser       = null;    // analisa microfone / áudio real
        let micStream         = null;
        let micSource         = null;
        let vuAnimId          = null;
        let vuSmooth          = new Array(11).fill(0);
        let sharedNoiseSource = null;    // fonte única compartilhada de ruído rosa
        let sharedNoiseUsers  = 0;       // contagem de canais com ruído ligado
        let mixerMasterBus    = null;    // barramento mestre interno do mixer
        let masterLimiter     = null;    // compressor/limiter de proteção na saída

        function ensureAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            initMixerAudioGraph();
            return audioCtx;
        }

        function createAnalyser(ctx) {
            const an = ctx.createAnalyser();
            an.fftSize = 1024;
            an.smoothingTimeConstant = 0.5;
            return an;
        }

        // Buffer de Ruído Rosa sintetizado (algoritmo de Voss-McCartney)
        function buildPinkNoiseBuffer(ctx) {
            const bufSize = 2 * ctx.sampleRate;
            const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
            const out = buf.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufSize; i++) {
                const w = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + w * 0.0555179;
                b1 = 0.99332 * b1 + w * 0.0750759;
                b2 = 0.96900 * b2 + w * 0.1538520;
                b3 = 0.86650 * b3 + w * 0.3104856;
                b4 = 0.55000 * b4 + w * 0.5329522;
                b5 = -0.7616 * b5 - w * 0.0168980;
                out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.04;
                b6 = w * 0.115926;
            }
            return buf;
        }

        function ensureSharedNoise() {
            ensureAudioCtx();
            if (sharedNoiseSource) return;
            sharedNoiseSource = audioCtx.createBufferSource();
            sharedNoiseSource.buffer = buildPinkNoiseBuffer(audioCtx);
            sharedNoiseSource.loop = true;
            sharedNoiseSource.start();

            // Conecta ruído rosa aos nós de ruído dos canais de saída 1 a 10
            for (let ch = 1; ch <= 10; ch++) {
                const data = channelStripsData[ch];
                if (data && data.noiseGain) {
                    try { sharedNoiseSource.connect(data.noiseGain); } catch(e) {}
                }
            }
        }

        // Configura a cascata de filtros Web Audio API para o canal (HPF 12/24dB + 6 bandas paramétricas)
        function setupChannelEQAudioNodes(idx) {
            const data = channelStripsData[idx];
            if (!data) return;
            ensureAudioCtx();

            if (!data.hpfFilter1) {
                // Filtro Passa-Altas (HPF) com 12 ou 24 dB/oitava (Butterworth)
                data.hpfFilter1 = audioCtx.createBiquadFilter();
                data.hpfFilter1.type = 'highpass';
                data.hpfFilter1.frequency.value = 10;
                data.hpfFilter1.Q.value = 0.707;

                data.hpfFilter2 = audioCtx.createBiquadFilter();
                data.hpfFilter2.type = 'highpass';
                data.hpfFilter2.frequency.value = 10;
                data.hpfFilter2.Q.value = 0.707;

                data.hpfFilter1.connect(data.hpfFilter2);
                data.channelInputNode = data.hpfFilter1;
            }

            if (!data.eqFilters) {
                const bands = (typeof channelEQState !== 'undefined' && channelEQState[idx]) ? channelEQState[idx] : defaultBands;
                data.eqFilters = [];

                bands.forEach((b) => {
                    const filter = audioCtx.createBiquadFilter();
                    if (b.mode === 'LShv') {
                        filter.type = 'lowshelf';
                    } else if (b.mode === 'HShv') {
                        filter.type = 'highshelf';
                    } else {
                        filter.type = 'peaking';
                        filter.Q.value = b.q || 2.0;
                    }
                    filter.frequency.value = b.freq || 1000;
                    const isEqActive = (typeof channelEQEnabled !== 'undefined' && channelEQEnabled[idx] !== undefined)
                        ? channelEQEnabled[idx] : true;
                    filter.gain.value = isEqActive ? b.gain : 0;
                    data.eqFilters.push(filter);
                });

                // Conecta HPF -> EQ cascata (hpfFilter2 -> eqFilters[0] -> 1 -> 2 -> 3 -> 4 -> 5)
                data.hpfFilter2.connect(data.eqFilters[0]);
                for (let i = 0; i < data.eqFilters.length - 1; i++) {
                    data.eqFilters[i].connect(data.eqFilters[i + 1]);
                }
            }
        }

        // Configura a cadeia de áudio completa do canal (HPF + EQ + Analyser + Fader Gain + Roteamento)
        function setupChannelAudioChain(idx) {
            const data = channelStripsData[idx];
            if (!data || !audioCtx) return;
            if (data.audioChainReady) return;

            setupChannelEQAudioNodes(idx);
            const inputNode   = data.channelInputNode || data.eqFilters[0];
            const lastFilter  = data.eqFilters[data.eqFilters.length - 1];

            // Analisador RTA pós-EQ exclusivo deste canal
            if (!data.rtaAnalyser) {
                data.rtaAnalyser = createAnalyser(audioCtx);
            }

            // Ganho do canal (controlado pelo fader e mute)
            if (!data.channelGain) {
                data.channelGain = audioCtx.createGain();
                data.channelGain.gain.value = 0.00001;
            }

            // Encadeamento interno do canal (PÓS-FADER: para o Analyser e RTA refletirem ganho real do potenciômetro):
            // inputNode(HPF) -> eqFilters[0..5] -> channelGain -> rtaAnalyser
            lastFilter.connect(data.channelGain);
            data.channelGain.connect(data.rtaAnalyser);

            if (idx === 0) {
                // Canal 0 (Entrada LR): alimenta o barramento mestre interno do mixer pós-fader e pós-EQ
                data.rtaAnalyser.connect(mixerMasterBus);
            } else {
                // Canais 1 a 10 (Saídas):
                // Recebe sinal do barramento mestre e entra no nó de entrada (HPF) do canal
                mixerMasterBus.connect(inputNode);

                // Entrada de ruído rosa independente
                data.noiseGain = audioCtx.createGain();
                data.noiseGain.gain.value = 0.00001;
                data.noiseGain.connect(inputNode);

                if (sharedNoiseSource) {
                    try { sharedNoiseSource.connect(data.noiseGain); } catch(e) {}
                }

                // Saída pós-fader do canal vai para o Master Limiter -> destination (caixas de som)
                data.rtaAnalyser.connect(masterLimiter);
            }

            data.audioChainReady = true;
            updateChannelFaderGain(idx);
            updateChannelEQFilters(idx);
        }

        // Inicializa o grafo Web Audio completo do mixer
        function initMixerAudioGraph() {
            if (!audioCtx) return;
            if (mixerMasterBus) return;
            if (!channelStripsData[0] || !channelStripsData[10]) return; // aguarda criação do DOM

            // Limiter profissional para evitar clipping ou distorção digital
            masterLimiter = audioCtx.createDynamicsCompressor();
            masterLimiter.threshold.value = -1.0;
            masterLimiter.knee.value = 3;
            masterLimiter.ratio.value = 20;
            masterLimiter.attack.value = 0.003;
            masterLimiter.release.value = 0.1;
            masterLimiter.connect(audioCtx.destination);

            // Barramento mestre interno (liga a saída do Canal 0 à entrada dos Canais 1 a 10)
            mixerMasterBus = audioCtx.createGain();
            mixerMasterBus.gain.value = 1.0;

            for (let i = 0; i < 11; i++) {
                setupChannelAudioChain(i);
            }

            // Se o player já tiver nó criado, conecta na entrada do Canal 0
            if (playerAnalyser && channelStripsData[0]) {
                const targetNode = channelStripsData[0].channelInputNode || (channelStripsData[0].eqFilters && channelStripsData[0].eqFilters[0]);
                if (targetNode) {
                    try { playerAnalyser.connect(targetNode); } catch(e) {}
                }
            }
        }

        // Atualiza os parâmetros dos filtros de áudio em tempo real quando o usuário mexe no EQ
        function updateChannelEQFilters(idx) {
            const data = channelStripsData[idx];
            if (!data || !data.eqFilters || !audioCtx) return;
            const bands = (typeof channelEQState !== 'undefined' && channelEQState[idx]) ? channelEQState[idx] : defaultBands;
            const isEqActive = (typeof channelEQEnabled !== 'undefined' && channelEQEnabled[idx] !== undefined)
                ? channelEQEnabled[idx] : true;
            const hpf = (typeof channelHPFState !== 'undefined' && channelHPFState[idx]) 
                ? channelHPFState[idx] : { enabled: false, freq: 80, slope: 12 };

            // Atualiza os filtros passa-altas (HPF: 12 ou 24 dB/oitava Butterworth)
            if (data.hpfFilter1 && data.hpfFilter2) {
                const isHpfActive = isEqActive && hpf.enabled;
                const targetFreq = isHpfActive ? Math.max(20, Math.min(1000, hpf.freq || 80)) : 10;
                data.hpfFilter1.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.01);
                data.hpfFilter1.Q.setTargetAtTime(0.707, audioCtx.currentTime, 0.01);

                const targetFreq2 = (isHpfActive && hpf.slope === 24) ? targetFreq : 10;
                data.hpfFilter2.frequency.setTargetAtTime(targetFreq2, audioCtx.currentTime, 0.01);
                data.hpfFilter2.Q.setTargetAtTime(0.707, audioCtx.currentTime, 0.01);
            }

            bands.forEach((b, i) => {
                const filter = data.eqFilters[i];
                if (!filter) return;
                try {
                    const targetFreq = Math.max(20, Math.min(20000, b.freq));
                    const targetGain = isEqActive ? b.gain : 0;
                    filter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.01);
                    filter.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.01);
                    if (filter.type === 'peaking') {
                        filter.Q.setTargetAtTime(Math.max(0.1, b.q), audioCtx.currentTime, 0.01);
                    }
                } catch(e) {}
            });
        }

        // Atualiza o ganho do fader do canal
        function updateChannelFaderGain(idx) {
            const data = channelStripsData[idx];
            if (!data || !data.channelGain || !audioCtx) return;

            const isMuted = data.muteBtn && data.muteBtn.classList.contains('muted');
            const faderPct = parseFloat(data.faderCap.style.bottom) || 0;

            if (isMuted || faderPct <= 1.0) {
                data.channelGain.gain.setTargetAtTime(0.00001, audioCtx.currentTime, 0.015);
                return;
            }

            // Curva do fader: 70% = 0 dB (ganho 1.0); 100% = +6 dB (~ ganho 2.0); 0% = silêncio
            let gainVal = 0;
            if (faderPct <= 70) {
                gainVal = Math.pow(faderPct / 70, 2);
            } else {
                gainVal = 1.0 + ((faderPct - 70) / 30) * 1.0;
            }

            // Canal 0 (Entrada LR): ganho unitário
            // Canais 1 a 10 (Saídas): fator 0.7 para folga de mixagem na soma
            const factor = (idx === 0) ? 1.0 : 0.7;
            const targetGain = Math.max(0.00001, Math.min(3.0, gainVal * factor));
            data.channelGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.015);
        }

        // Aciona ruído rosa individualmente no canal passando pelo equalizador (EQ Eight)
        function channelPinkOn(idx) {
            if (idx === 0) return; // Canal de Entrada (LR) não possui ruído rosa
            const data = channelStripsData[idx];
            if (!data) return;
            ensureAudioCtx();
            initMixerAudioGraph();
            ensureSharedNoise();

            data.noiseEnabled = true;
            sharedNoiseUsers++;
            if (data.noiseGain) {
                data.noiseGain.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.015);
            }
            updateChannelEQFilters(idx);
            updateChannelFaderGain(idx);

            if (data.strip) data.strip.classList.add('pink-noise-active');
            if (data.pill) data.pill.classList.add('pink-noise-active');
        }

        // Desliga ruído rosa do canal
        function channelPinkOff(idx) {
            const data = channelStripsData[idx];
            if (!data || !data.noiseEnabled) return;

            data.noiseEnabled = false;
            sharedNoiseUsers = Math.max(0, sharedNoiseUsers - 1);

            if (data.noiseGain) {
                data.noiseGain.gain.setTargetAtTime(0.00001, audioCtx.currentTime, 0.015);
            }
            updateChannelFaderGain(idx);

            if (data.strip) data.strip.classList.remove('pink-noise-active');
            if (data.pill) data.pill.classList.remove('pink-noise-active');

            if (sharedNoiseUsers <= 0 && sharedNoiseSource) {
                try {
                    sharedNoiseSource.stop();
                    sharedNoiseSource.disconnect();
                } catch(e) {}
                sharedNoiseSource = null;
                sharedNoiseUsers = 0;
            }
        }

        // Atualiza o estado visual do botão de ruído rosa no modal do EQ
        function updatePinkNoiseButton() {
            if (activeChannelIdx === 0) {
                // Canal de entrada LR não possui ruído rosa
                pinkNoiseBtn.style.display = 'none';
                return;
            }
            pinkNoiseBtn.style.display = 'inline-block';
            const isNoiseOn = !!(channelStripsData[activeChannelIdx] && channelStripsData[activeChannelIdx].noiseEnabled);
            pinkNoiseBtn.textContent = isNoiseOn ? 'Ruído Rosa: On' : 'Ruído Rosa: Off';
            pinkNoiseBtn.style.background = isNoiseOn ? '#FF0055' : '#555';
            pinkNoiseBtn.style.color = '#FFF';
        }

        // Botão de ruído rosa: aciona individualmente no canal ativo (apenas saídas 1 a 10)
        const pinkNoiseBtn = document.getElementById('pink-noise-btn');
        pinkNoiseBtn.onclick = () => {
            if (activeChannelIdx === 0) return;
            ensureAudioCtx();
            const idx = activeChannelIdx;
            const data = channelStripsData[idx];
            if (!data) return;

            const willBeOn = !data.noiseEnabled;
            if (willBeOn) {
                channelPinkOn(idx);
            } else {
                channelPinkOff(idx);
            }
            updatePinkNoiseButton();
            sendSync({ type: 'pink_noise', channel: idx, value: willBeOn });
        };

        // Captura de áudio real do microfone/entrada
        async function startMicCapture() {
            try {
                ensureAudioCtx();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                micSource = audioCtx.createMediaStreamSource(micStream);
                micAnalyser = createAnalyser(audioCtx);
                micSource.connect(micAnalyser);
                console.log('[VU] Entrada de áudio conectada');
            } catch (err) {
                console.log('[VU] Áudio externo não disponível ou não autorizado:', err.message);
            }
        }

        // ── Player Provisório de Áudio Local (Carregar do PC) ───────────
        let playerElement      = null;
        let playerSourceNode   = null;
        let playerAnalyser     = null;
        let playerMasterGain   = null;

        function formatAudioTime(sec) {
            if (!sec || isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }

        function initLocalAudioPlayer() {
            playerElement = document.getElementById('local-audio-element');
            const fileInput = document.getElementById('local-audio-file');
            const loadBtn = document.getElementById('player-load-btn');
            const playBtn = document.getElementById('player-play-btn');
            const trackName = document.getElementById('player-track-name');
            const timeLabel = document.getElementById('player-time');
            const progressBar = document.getElementById('player-progress-bar');
            const progressFill = document.getElementById('player-progress-fill');

            if (!playerElement || !fileInput) return;

            // Permite carregar por clique e também arrastar e soltar arquivo
            fileInput.onchange = async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                await loadAndPlayAudioFile(files[0]);
            };

            // Gera áudio sintetizado em WAV diretamente na memória do navegador para teste imediato
            const demoBtn = document.getElementById('player-demo-btn');
            if (demoBtn) {
                demoBtn.onclick = async () => {
                    try {
                        ensureAudioCtx();
                        if (audioCtx && audioCtx.state === 'suspended') {
                            await audioCtx.resume();
                        }
                        trackName.textContent = 'Gerando áudio demo...';

                        // Gera um groove rítmico musical de 10 segundos com bumbo, baixo e acordes
                        const sampleRate = 44100;
                        const duration = 12; // 12 segundos em loop
                        const totalSamples = sampleRate * duration;
                        const buffer = new Float32Array(totalSamples);
                        
                        const bpm = 120;
                        const beatSec = 60 / bpm; // 0.5s por batida
                        
                        for (let s = 0; s < totalSamples; s++) {
                            const t = s / sampleRate;
                            let val = 0;

                            // 1. Kick Drum (bumbo nas batidas 1, 2, 3, 4)
                            const beatTime = t % beatSec;
                            if (beatTime < 0.25) {
                                const kickFreq = 120 * Math.exp(-beatTime * 28) + 40;
                                const kickEnv = Math.exp(-beatTime * 14);
                                val += Math.sin(2 * Math.PI * kickFreq * beatTime) * kickEnv * 0.7;
                            }

                            // 2. Linha de Baixo melódica nos 16 avos
                            const bassNotes = [55, 55, 65.4, 73.4, 82.4, 73.4, 65.4, 49]; // Lá, Dó, Ré, Mi...
                            const bassIdx = Math.floor((t / (beatSec / 2)) % bassNotes.length);
                            const bassFreq = bassNotes[bassIdx];
                            const bassBeatTime = t % (beatSec / 2);
                            const bassEnv = Math.exp(-bassBeatTime * 6);
                            val += (Math.sin(2 * Math.PI * bassFreq * t) + 0.3 * Math.sin(4 * Math.PI * bassFreq * t)) * bassEnv * 0.35;

                            // 3. Sintetizador / Acordes
                            const chordFreqs = [220, 261.63, 329.63, 392]; // Am7
                            chordFreqs.forEach((f, fi) => {
                                const tremolo = 0.8 + 0.2 * Math.sin(2 * Math.PI * 4 * t);
                                val += Math.sin(2 * Math.PI * f * t) * 0.06 * tremolo;
                            });

                            // 4. Hi-hat / Prato leve nos contra-tempos
                            const hatBeat = (t + beatSec / 2) % beatSec;
                            if (hatBeat < 0.08) {
                                const whiteNoise = (Math.random() * 2 - 1);
                                val += whiteNoise * Math.exp(-hatBeat * 40) * 0.15;
                            }

                            buffer[s] = Math.max(-1, Math.min(1, val));
                        }

                        // Converte Float32Array para Blob WAV mono
                        const wavBlob = createWavBlob(buffer, sampleRate);
                        const fileUrl = URL.createObjectURL(wavBlob);
                        
                        playerElement.src = fileUrl;
                        playerElement.loop = true;
                        trackName.textContent = '🎵 Demo Groove (120 BPM)';
                        trackName.title = 'Áudio de demonstração sintetizado para teste';
                        trackName.style.color = '#00ff88';
                        playBtn.disabled = false;
                        playBtn.textContent = '⏸';
                        playBtn.style.color = '#ff9900';

                        setupPlayerAudioNodes();
                        await playerElement.play();
                    } catch(err) {
                        console.error('Erro ao gerar demo:', err);
                        trackName.textContent = 'Erro ao sintetizar demo: ' + err.message;
                    }
                };
            }

            // Utilitário rápido para codificar WAV PCM 16-bit
            function createWavBlob(samples, sampleRate) {
                const buffer = new ArrayBuffer(44 + samples.length * 2);
                const view = new DataView(buffer);
                const writeString = (offset, string) => {
                    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
                };
                writeString(0, 'RIFF');
                view.setUint32(4, 36 + samples.length * 2, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true); // PCM
                view.setUint16(22, 1, true); // Mono
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeString(36, 'data');
                view.setUint32(40, samples.length * 2, true);
                let offset = 44;
                for (let i = 0; i < samples.length; i++, offset += 2) {
                    const s = Math.max(-1, Math.min(1, samples[i]));
                    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                }
                return new Blob([buffer], { type: 'audio/wav' });
            }

            async function loadAndPlayAudioFile(file) {
                try {
                    ensureAudioCtx();
                    if (audioCtx && audioCtx.state === 'suspended') {
                        await audioCtx.resume();
                    }
                    
                    const fileUrl = URL.createObjectURL(file);
                    playerElement.src = fileUrl;
                    trackName.textContent = file.name;
                    trackName.title = file.name;
                    trackName.style.color = '#fff';
                    playBtn.disabled = false;
                    playBtn.textContent = '▶';

                    // Conecta AudioContext e os nós de saída / analisador
                    setupPlayerAudioNodes();

                    const playPromise = playerElement.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            playBtn.textContent = '⏸';
                            playBtn.style.color = '#ff9900';
                        }).catch(err => {
                            console.warn('Autoplay bloqueado ou aguardando clique explícito:', err);
                            trackName.textContent = '▶ Clique Play para iniciar: ' + file.name;
                            playBtn.textContent = '▶';
                            playBtn.style.color = '#00ff88';
                        });
                    }
                } catch(err) {
                    console.error('Erro ao carregar arquivo de áudio:', err);
                    trackName.textContent = 'Erro ao carregar: ' + err.message;
                    trackName.style.color = '#ff4444';
                }
            }

            // Suporte para arrastar e soltar arquivo direto na barra do player
            const playerBar = document.getElementById('audio-player-bar');
            if (playerBar) {
                playerBar.ondragover = (e) => {
                    e.preventDefault();
                    playerBar.style.borderColor = '#ff9900';
                };
                playerBar.ondragleave = () => {
                    playerBar.style.borderColor = '#3d3f47';
                };
                playerBar.ondrop = (e) => {
                    e.preventDefault();
                    playerBar.style.borderColor = '#3d3f47';
                    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        loadAndPlayAudioFile(e.dataTransfer.files[0]);
                    }
                };
            }

            playBtn.onclick = async () => {
                if (!playerElement.src) return;
                ensureAudioCtx();
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                setupPlayerAudioNodes();
                if (playerElement.paused) {
                    try {
                        await playerElement.play();
                        playBtn.textContent = '⏸';
                        playBtn.style.color = '#ff9900';
                    } catch(err) {
                        console.error('Erro ao dar play:', err);
                    }
                } else {
                    playerElement.pause();
                    playBtn.textContent = '▶';
                    playBtn.style.color = '#00ff88';
                }
            };

            playerElement.onerror = (e) => {
                console.error('Elemento de áudio com erro:', playerElement.error);
                trackName.textContent = 'Formato não suportado pelo navegador';
                trackName.style.color = '#ff4444';
            };

            playerElement.ontimeupdate = () => {
                const cur = playerElement.currentTime || 0;
                const dur = playerElement.duration || 0;
                timeLabel.textContent = formatAudioTime(cur) + ' / ' + formatAudioTime(dur);
                if (dur > 0) {
                    const pct = (cur / dur) * 100;
                    progressFill.style.width = pct + '%';
                }
            };

            playerElement.onended = () => {
                playBtn.textContent = '▶';
                playBtn.style.color = '#00ff88';
                progressFill.style.width = '0%';
            };

            if (progressBar) {
                progressBar.onclick = (e) => {
                    if (!playerElement.duration) return;
                    const rect = progressBar.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const ratio = Math.max(0, Math.min(1, clickX / rect.width));
                    playerElement.currentTime = ratio * playerElement.duration;
                };
            }
        }

        function setupPlayerAudioNodes() {
            ensureAudioCtx();
            initMixerAudioGraph();
            if (playerSourceNode) return; // já configurado

            try {
                // Conecta o elemento de áudio ao Web Audio Graph
                playerSourceNode = audioCtx.createMediaElementSource(playerElement);

                // Analisador exclusivo do player
                playerAnalyser = createAnalyser(audioCtx);

                // Roteamento físico de estúdio:
                // Player -> playerAnalyser -> Entrada (HPF / EQ) do Canal 0 (LR Entrada)
                playerSourceNode.connect(playerAnalyser);
                if (channelStripsData[0]) {

                    if (targetNode) {

                    }

                // Aplica imediatamente a posição atual de todos os faders
                for (let ch = 0; ch < 11; ch++) {

        // ── Loop de Animação do VU Meter ─────────────────────────────
        // O VU meter SÓ se move quando houver sinal de áudio real OU ruído rosa acionado
        function vuLoop() {
            requestAnimationFrame(vuLoop);

            // Mede sinal geral da entrada (Canal 0 pós-EQ, player ou microfone)
            let inputSignalPct = 0;
            const activeInputAnalyser = (channelStripsData[0] && channelStripsData[0].rtaAnalyser)
                ? channelStripsData[0].rtaAnalyser
                : (playerAnalyser || micAnalyser);

            if (activeInputAnalyser) {
                const buf = new Float32Array(activeInputAnalyser.fftSize);
                activeInputAnalyser.getFloatTimeDomainData(buf);
                let sum = 0;
                for (let j = 0; j < buf.length; j++) sum += buf[j] * buf[j];
                const rms = Math.sqrt(sum / buf.length);
                if (rms > 0.001) {
                    const db = 20 * Math.log10(rms);
                    // -50dB = 0%, 0dB = 72% (marca 0U), +6dB = 100%
                    inputSignalPct = Math.max(0, Math.min(100, (db + 50) / 56 * 100));
                }
            }

            // Atualiza cada um dos 11 canais
            for (let i = 0; i < 11; i++) {
                const data = channelStripsData[i];
                if (!data || !data.meterFill) continue;

                const isMuted = data.muteBtn.classList.contains('muted');
                const faderPct = parseFloat(data.faderCap.style.bottom) || 0;

                let targetLevel = 0;

                if (!isMuted && faderPct > 1.0) {
                    // 1. Sinal do Ruído Rosa (apenas nos canais de saída 1 a 10)
                    let noiseLevel = 0;
                    if (i > 0 && data.noiseEnabled) {
                        const flutter = (Math.random() - 0.5) * 5;
                        noiseLevel = Math.max(0, Math.min(100, faderPct + flutter));
                    }

                    // 2. Sinal de Áudio Real (se presente: Player ou Mic)
                    let audioLevel = 0;
                    if (inputSignalPct > 0) {
                        const inputFaderPct = (channelStripsData[0] && !channelStripsData[0].muteBtn.classList.contains('muted'))
                            ? (parseFloat(channelStripsData[0].faderCap.style.bottom) || 0)
                            : 0;
                        const inputFactor = inputFaderPct / 100;

                        if (i === 0) {
                            // LR Entrada Master recebe sinal proporcional ao próprio fader de entrada
                            audioLevel = inputSignalPct * inputFactor;
                        } else {
                            // Canais 1 a 10 de Saída recebem sinal condicionado à Entrada LR E ao fader do canal
                            audioLevel = inputSignalPct * inputFactor * (faderPct / 100);
                        }
                    }

                    targetLevel = Math.max(audioLevel, noiseLevel);
                }

                // Balística de VU Meter analógico (Attack rápido, Decay suave)
                const attack = 0.65;
                const decay  = 0.16;
                const speed = targetLevel > vuSmooth[i] ? attack : decay;
                vuSmooth[i] += (targetLevel - vuSmooth[i]) * speed;

                if (vuSmooth[i] < 0.25) vuSmooth[i] = 0;

                // A cortina escura cobre o medidor: 100% = apagado (silêncio)
                // Quanto maior o sinal, menor a cortina (revela o gradiente verde/amarelo/vermelho)
                data.meterFill.style.height = (100 - vuSmooth[i]) + '%';
            }
        }

        // Inicia o motor de VU, player local e captura de áudio
        vuLoop();
        initLocalAudioPlayer();
        startMicCapture();

        const eqOnBtn = document.getElementById('eq-on-btn');

        const defaultBands = [
            { id: 1, name: 'Low',     color: '#00FFFF', freq: 80,    gain: 0,    q: 2.0, mode: 'LShv' },
            { id: 2, name: 'Low 2',   color: '#00FF00', freq: 160,   gain: 0,    q: 2.0, mode: 'PEQ'  },
            { id: 3, name: 'Low Mid', color: '#FFFF00', freq: 500,   gain: 0,    q: 2.0, mode: 'PEQ'  },
            { id: 4, name: 'High Mid',color: '#FF00FF', freq: 1720,  gain: 0,    q: 1.4, mode: 'PEQ'  },
            { id: 5, name: 'High 2',  color: '#FF0000', freq: 4370,  gain: 0,    q: 2.0, mode: 'PEQ'  },

        // ── Per-channel EQ state (11 channels: 1 Entrada LR + 10 Saídas Ch 1..10) ──
        const NUM_CHANNELS = 11;
        const channelEQState = Array.from({length: NUM_CHANNELS}, () =>

        const channelEQEnabled = new Array(NUM_CHANNELS).fill(true);

        let activeChannelIdx = 0; // which channel's EQ is open

        function getActiveHPF() {
            return channelHPFState[activeChannelIdx];
        }

        function getHPFResponseDb(f, hpf) {
            if (!hpf || !hpf.enabled) return 0;
            const order = (hpf.slope === 24) ? 8 : 4;
            const ratio = (hpf.freq || 80) / Math.max(1, f);
            const db = -10 * Math.log10(1 + Math.pow(ratio, order));
            return Math.max(-36, db);
        }

        function updateHPFUI() {
            const hpf = getActiveHPF();
            if (!hpf) return;

                    <div class="band-param"><span class="param-lbl">Q</span><input type="text" class="param-val-box" id="bx-q-${i}" value="${b.q.toFixed(1)}" onclick="event.stopPropagation()" onfocus="this.select()" onchange="onBoxParamChange(${i}, 'q', this.value)" onkeydown="if(event.key==='Enter'){this.blur();}"></div>
                `;
                boxesContainer.appendChild(box);

            updateHPFUI();
            updateKnobs();
            drawEQGraph();
